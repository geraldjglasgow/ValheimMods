# Wayfare - English words
#
# To translate: copy this file as Wayfare.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the mod), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it).

# Portal access modes: the Alt+E line on a portal's (and a sea gate pillar's) hover text, $1 is the mode
wf_mode_public: "Public"
wf_mode_private: "Private"
wf_mode_admin: "Admin"
wf_hover_cycle: "Cycle access mode: $1"
wf_notowner: "You don't own this portal"

# The map while choosing a destination: the portal you stand at, right click to favourite, the favourites list
wf_you_are_here: "You are here"
wf_favourited: "Added to favourites"
wf_unfavourited: "Removed from favourites"
wf_unnamed_portal: "(unnamed portal)"

# Why the server refused a teleport
wf_denied_private: "Only the portal's owner may target it"
wf_denied_admin: "Only a server admin may target this portal"
wf_denied_blocked: "Portal travel is blocked here"
wf_denied_generic: "You may not target that portal"

# The Teleport Mode TargetTeleport window: its title, its button, the list of portals with their distance ($1)
wf_picker_topic: "Teleport to"
wf_picker_go: "Teleport"
wf_picker_none: "No other named portal"
wf_picker_unnamed: "Name this portal to connect it"
wf_distance_m: "$1 m"
wf_distance_km: "$1 km"

