wf_sg_hover_sailin: "Sail in with someone at the helm to pick any sea gate"
wf_sg_hover_rename: "Name"
wf_sg_rename: "Name this sea gate"
wf_sg_notowner: "You don't own this sea gate"

# Sea gates: pairing two pillars, on the hover text and over the water; $1 is what was measured, $2 the limit (metres)
wf_sg_unpaired: "Not paired: build a second pillar 10 to 15 m away across the water"
wf_sg_pair_ok: "Pairs with this pillar"
wf_sg_pair_far: "Too far from the other pillar: $1 m, at most $2 m"
wf_sg_pair_close: "Too close to the other pillar: $1 m, at least $2 m"
wf_sg_pair_height: "$1 m higher or lower than the other pillar, at most $2 m"
wf_sg_pair_nowater: "No water between the pillars"
wf_sg_pair_shallow: "Too shallow at the red marks: $1 m deep, a ship needs $2 m"
wf_sg_pair_deep: "Too deep for a pillar: $1 m under water, at most $2 m"
wf_sg_fix_hint: "Fix it and the gate opens by itself"
wf_sg_paired: "The sea gate is open"

# Sea gates: the map while a ship waits in a gate; $1 is the helmsman's name, or the helmsman word below
wf_sg_picker_hint: "Click a sea gate to sail there. Close the map to sail on. The crew sees your pointer."
wf_sg_picker_crew: "$1 at the helm picks the sea gate. The crew sees your pointer."
wf_sg_helmsman: "The helmsman"
wf_sg_helm_picks: "Only the helmsman picks the sea gate"

# Sea gates: why a ship could not jump, told to the crew
wf_sg_denied_nohelm: "A ship passes through a sea gate only with someone at the helm"
wf_sg_denied_cargo: "Ore and other restricted cargo can't pass through a sea gate"
wf_sg_denied_closed: "This sea gate is closed"
wf_sg_denied_gone: "The destination sea gate is gone"
