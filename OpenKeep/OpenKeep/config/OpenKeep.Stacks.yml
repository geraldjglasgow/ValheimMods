# OpenKeep.Stacks.yml - stack sizes and weights.
#
# This file wins over the .cfg: "stack multiplier" and "weight multiplier" replace the .cfg multipliers when they
# are present, and every entry under items: sets an absolute stack or weight for the items it names, replacing the
# multiplied value. Keys use the OpenKeep item vocabulary: a prefab name (Wood), a name token ($item_wood),
# prefix:Trophy, suffix:Ore, type:Material, group:Ores (a group from the groups: map) or * for everything.
# A plain name wins over a pattern; among patterns the later entry wins. Items with a vanilla stack of 1 keep it
# under the multiplier; an absolute stack: applies to them too.
#
# The file is synced from the server, reloaded a few seconds after it is saved and can be edited in game
# (Configuration Manager, "Edit YAML"). Extra files named OpenKeep.Stacks<anything>.yml next to this one are read
# as well. OpenKeep.Items.txt next to the .cfg lists every item with its prefab name and vanilla values.
#
# stack multiplier: 2        # replaces the .cfg Stack Multiplier
# weight multiplier: 0.5     # replaces the .cfg Weight Multiplier
groups:
  Ores: [prefix:CopperOre, TinOre, IronScrap, SilverOre, BlackMetalScrap, FlametalOre]
items:
#  Wood: { stack: 100 }
#  Stone: { stack: 100, weight: 1.0 }
#  group:Ores: { weight: 5 }
