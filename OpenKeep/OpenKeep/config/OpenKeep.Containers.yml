# OpenKeep.Containers.yml - container sizes.
#
# One entry per container prefab with the width and height of its grid. Sizes apply to new containers and to
# every loaded container of that prefab; a container is never shrunk below a row or column that holds an item
# (the log names the prefab and the container keeps its size). Players without the mod, and the vanilla game,
# do not see items that sit in the extra rows and columns.
#
# The file is synced from the server, reloaded a few seconds after it is saved and can be edited in game
# (Configuration Manager, "Edit YAML"). Extra files named OpenKeep.Containers<anything>.yml next to this one are
# read as well. The first time a world loads, every container prefab of the game and of other mods is listed
# below with its vanilla size, commented out: remove the # of a line and change the numbers.
containers:
  # piece_chest_wood: { width: 5, height: 2 }
  # piece_chest: { width: 6, height: 3 }
  # VikingShip: { width: 8, height: 2 }
  # Cart: { width: 6, height: 3 }
