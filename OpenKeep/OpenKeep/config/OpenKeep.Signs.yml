# OpenKeep.Signs.yml - which containers get a contents sign and where it sits.
#
# Every player-built container gets a sign unless its prefab is listed with enabled: false. offset moves the
# sign from the computed place (the middle of the container's top, Height metres up) in the container's own
# axes: x to its right, y up, z forward, in metres. rotation is added to the container's yaw for this prefab,
# on top of the Rotation setting.
#
# The file is synced from the server, reloaded a few seconds after it is saved and can be edited in game
# (Configuration Manager, "Edit YAML"). Extra files named OpenKeep.Signs<anything>.yml next to this one are
# read as well. Container keys are prefab names; OpenKeep.Containers.txt lists them all.
containers:
#  piece_chest_wood: { enabled: true, offset: [0, 0, 0.3], rotation: 0 }
#  piece_chest_private: { enabled: false }
