# Publish settings for tcli. No secrets here: the token comes from TCLI_AUTH_TOKEN or --token.
#   tcli publish --config-path DevBridge/thunderstore/thunderstore.toml --file DevBridge/thunderstore/DevBridge-X.Y.Z.zip
[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MilkyTeam"
name = "DevBridge"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "tools", "client-side", "server-side"]
