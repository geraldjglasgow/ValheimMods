# The players' greataxe and its axehead
item_ecp_executionergreataxe: "Đại Rìu Đao Phủ"
item_ecp_executionergreataxe_description: "Đại rìu của Đao Phủ Hầm Mộ, cán rìu được xâu từ các đốt sống. Nó chém, xoay tròn một vòng rồi giội xuống từ trên đầu; đòn đánh cuối cùng tốn thời gian để hồi phục."
item_ecp_executioneraxehead: "Lưỡi Rìu Đao Phủ"
item_ecp_executioneraxehead_description: "Đầu rìu bằng xương của Đao Phủ Hầm Mộ. Gắn vào cán bằng cột sống tại bàn chế tạo, nó lại tiếp tục vung đòn."

