# Elite Creatures Pack - Vietnamese words (Tiếng Việt), translated by QuânKha (Zono) [VLHM], 2026-10-19
#
# Used while the game's language is Vietnamese, which a language mod adds (the game ships no Vietnamese). A language
# mod that writes Vietnamese into the game's English instead needs this file copied as
# BepInEx/config/EliteCreaturesPack.translations.English.yml.
# The keys are the ones in English.yml beside this file; a key left out stays English.

# The kraken
enemy_ecp_kraken: "Kraken"
se_ecp_inked: "Dính Mực"
se_ecp_inked_tooltip: "Mực bắn vào mắt bạn."
item_ecp_krakenbeak: "Mỏ Kraken"
item_ecp_krakenbeak_description: "Chiếc mỏ quặp của Kraken: sừng tối màu với viền hổ phách có thể xé tạc thân tàu. Thợ rèn có thể gắn nó vào một chiếc khiên."
item_ecp_krakenmeat: "Xúc Tua Kraken Sống"
item_ecp_krakenmeat_description: "Một miếng xúc tua Kraken dày, nguyên cả các giác hút. Nướng nó trên trạm nấu ăn bằng sắt."
item_ecp_krakenmeatcooked: "Xúc Tua Kraken Chín"
item_ecp_krakenmeatcooked_description: "Xúc tua nướng xém, đậm đà và dai ngon. Giúp thủy thủ đoàn chèo thuyền qua đêm dài nhất."
item_ecp_shieldkraken: "Khiên Kraken"
item_ecp_shieldkraken_description: "Gỗ tốt và bạc bọc quanh mỏ Kraken. Đỡ đòn chuẩn xác bằng chiếc khiên này và chiếc mỏ sẽ cắn trả."

