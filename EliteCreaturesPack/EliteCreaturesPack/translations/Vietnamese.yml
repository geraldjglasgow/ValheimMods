# The bone weapons
item_ecp_bonedagger: "Dao Găm Xương"
item_ecp_bonedagger_description: "Lưỡi dao là mỏm gai của một đốt sống, chuôi dao là chuỗi đốt sống nhỏ. Nhanh, êm và tàn nhẫn."
item_ecp_bonesword: "Kiếm Xương"
item_ecp_bonesword_description: "Lưỡi kiếm bằng xương có cột sống chạy dọc ở giữa, một đốt sống làm quai bảo vệ và nhiều đốt sống khác làm chuôi."
item_ecp_boneaxe: "Rìu Xương"
item_ecp_boneaxe_description: "Lưỡi xương gắn vào một đốt sống, trên cán bằng cột sống. Nó bổ vào thịt hay gỗ đều như nhau."
item_ecp_bonemace: "Chùy Xương"
item_ecp_bonemace_description: "Một khối đốt sống gồ ghề trên cán bằng cột sống. Đủ nặng để đập nát bất cứ thứ gì nó đụng phải."
item_ecp_bonespear: "Giáo Xương"
item_ecp_bonespear_description: "Xương dài làm cán dưới, cột sống làm cán trên, lá xương làm mũi giáo."
item_ecp_boneatgeir: "Trường Đao Xương"
item_ecp_boneatgeir_description: "Nửa xương dài, nửa cột sống, kết thúc bằng lưỡi xương cong và răng nanh móc. Nó giữ kẻ chết ở một khoảng cách an toàn."
item_ecp_bonebow: "Cung Xương"
item_ecp_bonebow_description: "Xương sườn làm cánh cung và cột sống làm tay cầm. Kẻ chết kéo cung rất cừ; bạn cũng có thể làm vậy."
# The spine and the bone arrows
item_ecp_spine: "Cột Sống"
item_ecp_spine_description: "Một đoạn cột sống cũ, vẫn cứng như đá. Bộ xương chế tạo vũ khí của chúng xung quanh nó."
item_ecp_arrowbone: "Tên Xương"
item_ecp_arrowbone_description: "Thân tên bằng xương có đầu là đốt sống mài nhọn. Tốt hơn gỗ, không bằng đá lửa."
# The Skeleton Crossbowman and the Bone Crossbow
enemy_ecp_skeletoncrossbowman: "Bộ Xương Nỏ Thủ"
item_ecp_skeletoncrossbow: "Nỏ"
item_ecp_bonecrossbow: "Nỏ Xương"
item_ecp_bonecrossbow_description: "Khẩu nỏ bằng xương, làm theo cách kẻ chết tạo ra: xương đùi làm báng, cột sống làm thân nỏ, xương sườn làm cánh nỏ. Nó đánh như chùy, dù bắn ra bất kỳ loại tên nỏ nào."
item_ecp_boltboneblunt: "Tên Nỏ Xương Tù"
item_ecp_boltboneblunt_description: "Mũi tên nỏ bằng xương có đầu mài tù và không có lông vũ, dùng cho nỏ xương. Nó làm gãy xương hơn là đâm xuyên."
# The Bone Ballista
piece_ecp_boneballista: "Súng Bắn Tên Xương Ballista"
piece_ecp_boneballista_description: "Một súng bắn tên nhỏ bằng xương, hai cánh cung là hai cột sống. Giữ để nhắm và bắn; nó nạp lại từ tên đạn xương bạn mang theo, xoay 45 độ mỗi bên."
item_ecp_bonemissile: "Tên Đạn Xương"
item_ecp_bonemissile_description: "Đạn tên cho súng bắn tên xương: thân xương dài với đầu là răng nanh và các tấm xương làm cánh đuôi."
