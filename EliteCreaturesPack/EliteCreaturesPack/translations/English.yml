# The players' greataxe and its axehead
item_ecp_executionergreataxe: "Executioner's Greataxe"
item_ecp_executionergreataxe_description: "The Crypt Executioner's greataxe, its haft strung from vertebrae. It slashes, whirls all the way round, then falls from overhead; the last blow is slow to recover from."
item_ecp_executioneraxehead: "Executioner's axehead"
item_ecp_executioneraxehead_description: "The bone head of the Crypt Executioner's axe. Set on a haft of spines at the workbench, it swings again."

