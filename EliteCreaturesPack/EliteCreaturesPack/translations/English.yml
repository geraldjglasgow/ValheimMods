# Elite Creatures Pack - English words
#
# To translate: copy this file as EliteCreaturesPack.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the game), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it).

# The kraken
enemy_ecp_kraken: "Kraken"
se_ecp_inked: "Inked"
se_ecp_inked_tooltip: "Ink in your eyes."
item_ecp_krakenbeak: "Kraken beak"
item_ecp_krakenbeak_description: "The kraken's hooked beak: dark horn with an amber edge that could shear through a hull. A smith could set it in a shield."
item_ecp_krakenmeat: "Raw kraken tentacle"
item_ecp_krakenmeat_description: "A thick cut of kraken arm, suckers and all. Cook it on an iron cooking station."
item_ecp_krakenmeatcooked: "Cooked kraken tentacle"
item_ecp_krakenmeatcooked_description: "Seared tentacle, rich and chewy. Keeps a crew rowing through the longest night."
item_ecp_shieldkraken: "Kraken shield"
item_ecp_shieldkraken_description: "Fine wood and silver bound round the kraken's beak. Parry a blow with it and the beak bites back."

