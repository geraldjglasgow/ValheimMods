# The bone weapons
item_ecp_bonedagger: "Bone Dagger"
item_ecp_bonedagger_description: "Its blade is the spine of a single vertebra, its grip a tail of small ones. Quick, quiet and cruel."
item_ecp_bonesword: "Bone Sword"
item_ecp_bonesword_description: "A blade of bone with a spine running down its middle, a vertebra for a guard and more for a grip."
item_ecp_boneaxe: "Bone Axe"
item_ecp_boneaxe_description: "A bone blade set in a vertebra, on a haft of spine. It bites flesh and wood alike."
item_ecp_bonemace: "Bone Mace"
item_ecp_bonemace_description: "A knot of vertebrae on a haft of spine. Heavy enough to crack whatever it meets."
item_ecp_bonespear: "Bone Spear"
item_ecp_bonespear_description: "Long bones for the lower shaft, a spine for the upper, a leaf of bone for a point."
item_ecp_boneatgeir: "Bone Atgeir"
item_ecp_boneatgeir_description: "Half long bones, half spine, ending in a curved bone blade and a hooked fang. It keeps the dead at a distance."
item_ecp_bonebow: "Bone Bow"
item_ecp_bonebow_description: "Ribs for limbs and a backbone for a grip. The dead draw it well enough; so can you."
# The spine and the bone arrows
item_ecp_spine: "Spine"
item_ecp_spine_description: "A length of an old spine, still hard as stone. The skeletons build their weapons around it."
item_ecp_arrowbone: "Bone Arrow"
item_ecp_arrowbone_description: "A shaft of bone tipped with a sharpened vertebra. Better than wood, not as good as flint."
# The Skeleton Crossbowman and the Bone Crossbow
enemy_ecp_skeletoncrossbowman: "Skeleton Crossbowman"
item_ecp_skeletoncrossbow: "Crossbow"
item_ecp_bonecrossbow: "Bone Crossbow"
item_ecp_bonecrossbow_description: "A crossbow of bones, made the way the dead make theirs: a femur for a stock, a spine for a tiller, ribs for a prod. It hits like a club, whatever bolt it looses."
item_ecp_boltboneblunt: "Blunted Bone Bolt"
item_ecp_boltboneblunt_description: "A bolt of bone with its head ground blunt and no fletching, for the bone crossbow. It breaks bones rather than piercing them."
# The Bone Ballista
piece_ecp_boneballista: "Bone Ballista"
piece_ecp_boneballista_description: "A small ballista of bones, its arms two spines. Hold it to aim and shoot; it reloads from the bone missiles you carry, a turn of 45 degrees either way."
item_ecp_bonemissile: "Bone Missile"
item_ecp_bonemissile_description: "A missile for the bone ballista: a long bone shaft with a fang for a head and bone plates for fletching."
