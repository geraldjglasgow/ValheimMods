# Гросс-топор игроков и набалдашник для него
item_ecp_executionergreataxe: "Гросс-топор палача"
item_ecp_executionergreataxe_description: "Огромный топор Криптового палача, топорище которого набрано из позвонков. Он наносит рубящие удары, кружится по полной оси, а затем обрушивается сверху; после последнего удара требуется время на восстановление сил."
item_ecp_executioneraxehead: "Набалдашник топора палача"
item_ecp_executioneraxehead_description: "Костяное лезвие топора Криптового палача. Насадите его на топорище из позвоночников на верстаке, чтобы снова пустить в бой."

