# Elite Creatures Pack - Официальные строки перевода
# В переводе строго сохранены все системные переменные ($1, $2, \n) и кавычки.

# Кракен (The kraken)
enemy_ecp_kraken: "Кракен"
se_ecp_inked: "Ослепление чернилами"
se_ecp_inked_tooltip: "Чернила попали вам в глаза."
item_ecp_krakenbeak: "Клюв Кракена"
item_ecp_krakenbeak_description: "Изогнутый клюв кракена: темный рог с янтарным краем, способный пробить обшивку корабля. Кузнец мог бы закрепить его на щите."
item_ecp_krakenmeat: "Сырое щупальце кракена"
item_ecp_krakenmeat_description: "Толстый кусок щупальца кракена, со всеми присосками. Приготовьте его на железной стойке для готовки."
item_ecp_krakenmeatcooked: "Приготовленное щупальце кракена"
item_ecp_krakenmeatcooked_description: "Обжаренное щупальце, сытное и сочное. Помогает команде грести на протяжении самой долгой ночи."
item_ecp_shieldkraken: "Щит Кракена"
item_ecp_shieldkraken_description: "Качественная древесина и серебро, скрепленные вокруг клюва кракена. Парируйте им удар, и клюв укусит врага в ответ."

