# Костяное оружие
item_ecp_bonedagger: "Костяной кинжал"
item_ecp_bonedagger_description: "Его лезвие — это остистый отросток одного позвонка, а рукоять — хвост из мелких костей. Быстрый, тихий и жестокий."
item_ecp_bonesword: "Костяной меч"
item_ecp_bonesword_description: "Костяной клинок с хребтом, проходящим по всей его длине, позвонком вместо гарды и еще несколькими в качестве рукояти."
item_ecp_boneaxe: "Костяной топор"
item_ecp_boneaxe_description: "Костяное лезвие, закрепленное в позвонке на топорище из хребта. Одинаково хорошо врезается как во плоть, так и в дерево."
item_ecp_bonemace: "Костяная палица"
item_ecp_bonemace_description: "Узел из позвонков на рукояти из костяного хребта. Достаточно тяжелая, чтобы раздробить всё, что встретит на пути."
item_ecp_bonespear: "Костяное копье"
item_ecp_bonespear_description: "Длинные кости образуют нижнюю часть древка, хребет — верхнюю, а острая костяная пластина служит наконечником."
item_ecp_boneatgeir: "Костяной алебард (Атгейр)"
item_ecp_boneatgeir_description: "Наполовину длинные кости, наполовину хребет, оканчивающийся изогнутым костяным лезвием и зазубренным клыком. Позволяет удерживать мертвецов на расстоянии."
item_ecp_bonebow: "Костяной лук"
item_ecp_bonebow_description: "Ребра служат плечами лука, а позвоночник — рукоятью. Мертвецы натягивают его без проблем; сможете и вы."
# Позвоночник и костяные стрелы
item_ecp_spine: "Позвоночник"
item_ecp_spine_description: "Кусок старого позвоночника, всё ещё твердый как камень. Скелеты собирают свое оружие вокруг него."
item_ecp_arrowbone: "Костяная стрела"
item_ecp_arrowbone_description: "Древко из кости с наконечником из заточенного позвонка. Лучше деревянной, но уступает кремневой."
# Скелет-арбалетчик и Костяной арбалет
enemy_ecp_skeletoncrossbowman: "Скелет-арбалетчик"
item_ecp_skeletoncrossbow: "Арбалет"
item_ecp_bonecrossbow: "Костяной арбалет"
item_ecp_bonecrossbow_description: "Арбалет из костей, созданный точно так же, как их делают мертвецы: бедренная кость вместо ложа, хребет вместо направляющей, ребра вместо дуги. Какой бы болт он ни выпускал, удар ощущается как удар дубиной."
item_ecp_boltboneblunt: "Тупой костяной болт"
item_ecp_boltboneblunt_description: "Костяной болт с затупленным наконечником и без оперения, созданный для костяного арбалета. Он скорее ломает кости, чем пронзает их."
# Костяная баллиста
piece_ecp_boneballista: "Костяная баллиста"
piece_ecp_boneballista_description: "Небольшая баллиста из костей, плечами которой служат два позвоночника. Удерживайте ее, чтобы целиться и стрелять; она перезаряжается костяными снарядами из вашего инвентаря, поворачиваясь на 45 градусов в любую сторону."
item_ecp_bonemissile: "Костяной снаряд баллисты"
item_ecp_bonemissile_description: "Снаряд для костяной баллисты: длинное костяное древко с клыком вместо наконечника и костяными пластинами вместо оперения."
# Текст наведения на Костяную баллисту: имя, затем "(заряжено)" или "(пусто)", затем [E] Нажать/Удерживать или Отпустить
