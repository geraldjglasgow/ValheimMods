# The kraken
enemy_ecp_kraken: "Kraken"
se_ecp_inked: "Zalane atramentem"
se_ecp_inked_tooltip: "Atrament w twoich oczach."
item_ecp_krakenbeak: "Dziób Krakena"
item_ecp_krakenbeak_description: "Zakrzywiony dziób Krakena — ciemny róg z bursztynową krawędzią, zdolną rozciąć kadłub statku. Kowal mógłby oprawić go w tarczę."
item_ecp_krakenmeat: "Surowe macki Krakena"
item_ecp_krakenmeat_description: "Gruby kawałek ramienia Krakena, wraz z przyssawkami. Upiecz go na żelaznym ruszcie do gotowania."
item_ecp_krakenmeatcooked: "Pieczone macki Krakena"
item_ecp_krakenmeatcooked_description: "Przypieczona macka o wyrazistym smaku i zwartej konsystencji. Doda sił wioślarzom nawet podczas najdłuższej nocy."
item_ecp_shieldkraken: "Tarcza Krakena"
item_ecp_shieldkraken_description: "Szlachetne drewno i srebro oplatają dziób Krakena. Sparuj nią cios, a dziób odda uderzenie."

