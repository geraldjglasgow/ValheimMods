# The players' greataxe and its axehead
item_ecp_executionergreataxe: "Wielki topór egzekutora"
item_ecp_executionergreataxe_description: "Wielki topór Kryptowego Egzekutora, którego trzonek połączono z kręgów. Broń tnie, obraca się dookoła, a następnie spada z góry; po ostatnim ciosie długo dochodzi się do siebie."
item_ecp_executioneraxehead: "Głowica topora egzekutora"
item_ecp_executioneraxehead_description: "Kostna głowica topora Kryptowego Egzekutora. Osadź ją na trzonku z kolców przy stole warsztatowym, a znów będzie gotowa do walki."

