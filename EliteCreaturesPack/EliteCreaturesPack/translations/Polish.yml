# The bone weapons
item_ecp_bonedagger: "Kostny sztylet"
item_ecp_bonedagger_description: "Jego ostrze wykonano z pojedynczego kręgu, a rękojeść z szeregu mniejszych. Szybki, cichy i bezlitosny."
item_ecp_bonesword: "Kostny miecz"
item_ecp_bonesword_description: "Ostrze z kości z kręgosłupem biegnącym przez środek, kręgiem pełniącym funkcję jelca i kolejnymi kręgami tworzącymi rękojeść."
item_ecp_boneaxe: "Kostny topór"
item_ecp_boneaxe_description: "Kostne ostrze osadzone w kręgu i zamocowane na trzonku z kręgosłupa. Rozcina zarówno ciało, jak i drewno."
item_ecp_bonemace: "Kostna maczuga"
item_ecp_bonemace_description: "Zbiór kręgów osadzonych na trzonku z kręgosłupa. Wystarczająco ciężka, by zmiażdżyć wszystko, co napotka."
item_ecp_bonespear: "Kostna włócznia"
item_ecp_bonespear_description: "Dolną część drzewca tworzą długie kości, górną — kręgosłup, a grot wykonano z płaskiej kości."
item_ecp_boneatgeir: "Kostny atgeir"
item_ecp_boneatgeir_description: "Połączenie długich kości i kręgosłupa, zakończone zakrzywionym kostnym ostrzem i haczykowatym kłem. Trzyma nieumarłych na dystans."
item_ecp_bonebow: "Kostny łuk"
item_ecp_bonebow_description: "Żebra tworzą ramiona łuku, a kręgosłup — uchwyt. Zmarli potrafią się nim posługiwać; ty też dasz radę."
# The spine and the bone arrows
item_ecp_spine: "Kręgosłup"
item_ecp_spine_description: "Fragment starego kręgosłupa, wciąż twardy jak kamień. Szkielety budują wokół niego swoje bronie."
item_ecp_arrowbone: "Kostna strzała"
item_ecp_arrowbone_description: "Drzewce z kości zakończone zaostrzonym kręgiem. Lepsza niż drewniana, ale gorsza od krzemiennej."
# The Skeleton Crossbowman and the Bone Crossbow
enemy_ecp_skeletoncrossbowman: "Szkieletowy kusznik"
item_ecp_skeletoncrossbow: "Kusza"
item_ecp_bonecrossbow: "Kostna kusza"
item_ecp_bonecrossbow_description: "Kusza z kości, wykonana tak, jak robią to nieumarli: kość udowa służy za łoże, kręgosłup za cięciwę, a żebra za ramiona. Uderza jak maczuga, niezależnie od użytego bełtu."
item_ecp_boltboneblunt: "Tępy kostny bełt"
item_ecp_boltboneblunt_description: "Bełt do kostnej kuszy wykonany z kości, z tępym grotem i bez lotek. Miażdży kości zamiast je przebijać."
# The Bone Ballista
piece_ecp_boneballista: "Kostna balista"
piece_ecp_boneballista_description: "Mała balista z kości, której ramiona wykonano z dwóch kręgosłupów. Przytrzymaj przycisk, aby wycelować i strzelić. Broń przeładowuje się kostnymi pociskami, które masz przy sobie, i obraca o 45 stopni w każdą stronę."
item_ecp_bonemissile: "Kostny pocisk"
item_ecp_bonemissile_description: "Pocisk do kostnej balisty: długie kostne drzewce z kłem w roli grotu i kostnymi płytkami pełniącymi funkcję lotek."
