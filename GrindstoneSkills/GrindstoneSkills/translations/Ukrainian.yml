# Farming page
gs_page_farming_about: "Земля віддячить щедрим врожаєм і скоріше. Уміння зростає, коли ви садите й збираєте плоди своєї праці."
gs_page_farming_off: "Фермерство GrindstoneSkills вимкнене на цьому сервері."
