# Cooking page
gs_page_cooking_about: "Ви вправляєтесь на кухні швидше, а всі ваші страви виходять смачнішими та ситнішими. Вправність зростає з кожною стравою, що вийшла з-під вашої руки."
gs_page_cooking_heading_kitchen: "Кухня"
gs_page_cooking_speed: "Швидкість приготування"
gs_page_cooking_speed_line: "$1 +$2"
gs_page_cooking_speed_tip: "Діє на рожнах і в кам'яній печі: їжа, яку ви туди поклали, готується швидше."
gs_page_cooking_burn: "Затримка підгорання"
gs_page_cooking_burn_line: "$1 +$2"
gs_page_cooking_burn_tip: "Готова страва довше лишається неспаленою на цей відсоток. У грі страва підгорає, коли після готовності мине стільки ж часу, скільки її готували."
gs_page_cooking_craft: "Час приготування"
gs_page_cooking_craft_line: "$1 -$2"
gs_page_cooking_craft_tip: "Діє в казані, казані для медовиці та на столі приготування їжі. Цей бонус за Кухарство дає сама гра."
gs_page_cooking_ferment: "Швидкість бродіння"
gs_page_cooking_ferment_line: "$1 +$2"
gs_page_cooking_ferment_tip: "Діє на основи медовиці, які ви кладете в бродильну бочку: вони бродять швидше."
gs_page_cooking_extra_food: "Додаткова порція"
gs_page_cooking_extra_food_line: "$1: шанс $2 на +$3"
gs_page_cooking_extra_food_tip: "Діє на кожній кухонній станції: рожнах, кам'яній печі, казані, казані для медовиці та столі приготування їжі. Замінює власний шанс гри на додаткову їжу."
gs_page_cooking_ingredient: "Збережений інгредієнт"
gs_page_cooking_ingredient_line: "$1: $2"
gs_page_cooking_ingredient_tip: "Щоразу, коли ви готуєте в казані, казані для медовиці чи на столі приготування їжі, є шанс залишити один із інгредієнтів невикористаним."
gs_page_cooking_heading_experience: "Досвід"
gs_page_cooking_rich: "Ситні страви"
gs_page_cooking_rich_line: "$1: до x$2"
gs_page_cooking_rich_tip: "Досвід Кухарства за страву росте з її поживністю, тобто сумою здоров'я, витривалості й ейтиру: до $1 це x1, від $3 x$2."
gs_page_cooking_new_dish: "Нова страва"
gs_page_cooking_new_dish_line: "$1: x$2"
gs_page_cooking_new_dish_tip: "Коли ви вперше готуєте нову страву."
gs_page_cooking_experience_line: "Досвід кухарства x$1"

# Fishing page
gs_page_fishing_about: "Підсікайте частіше й витягуйте справжніх велетнів. Вправність зростає з кожною рибою, яку ви здолали в боротьбі."
gs_page_fishing_off: "Риболовля GrindstoneSkills вимкнена на цьому сервері."
gs_page_fishing_reel_speed: "Швидкість змотування"
gs_page_fishing_reel_speed_line: "$1 $2 м/с"
gs_page_fishing_reel_speed_tip: "Власний показник гри: як швидко змотується волосінь, поки ви її змотуєте (утримуйте блок). Коли риба б'ється, удвічі повільніше."
gs_page_fishing_reel_stamina: "Витрати витривалості при змотуванні"
gs_page_fishing_reel_stamina_line: "$1 -$2"
gs_page_fishing_reel_stamina_tip: "Власний показник гри: змотування вимагає менше сил. Але риба на волосіні й сама виснажує вас на $1 витривалості щосекунди."
gs_page_fishing_bite: "Шанс клювання"
gs_page_fishing_bite_line: "$1 +$2"
gs_page_fishing_bite_tip: "Шанс, що риба клюне на ваш поплавець. Клювання також частішає на $1% на світанку й у присмерку та на $2% під дощем."
gs_page_fishing_bite_tip_chum: "Шанс, що риба клюне на ваш поплавець. Клювання також частішає на $1% на світанку й у присмерку, на $2% під дощем і на $3% у межах $4 м від принади ($5), що плаває у воді."
gs_page_fishing_heading_fight: "Боротьба"
gs_page_fishing_strike: "Вікно підсікання"
gs_page_fishing_strike_line: "$1 $2 с"
gs_page_fishing_strike_tip: "Ви можете встигнути підсікти рибу, якщо почнете змотувати протягом цього часу після поклювання. У грі за замовчуванням 0,5 с."
gs_page_fishing_tension: "Натяг волосіні"
gs_page_fishing_tension_line: "$1 $2/с"
gs_page_fishing_tension_tip: "Коли ви змотуєте волосінь поки риба б'ється, заповнення шкали під прицілом відбувається з такою швидкістю, при повному заповненні шкали - волосінь рветься. Якщо послабити, вона спадає на $1/с."
gs_page_fishing_tension_tip_spent: "Після $1 ривків риба вимотується й витягається на $2% швидше."
gs_page_fishing_heading_catch: "Улов"
gs_page_fishing_big_one: "Велика риба"
gs_page_fishing_big_one_line: "$1 $2"
gs_page_fishing_big_one_tip: "Шанс, що підсічена риба виявиться на рівень більшою. Перевірка повторюється, поки не дійде до рівня $1. Вночі шанс більший на $2%."
gs_page_fishing_bonus: "Бонусний предмет"
gs_page_fishing_bonus_line: "$1 $2"
gs_page_fishing_bonus_range: "$1-$2"
gs_page_fishing_bonus_tip: "Шанс, що витягнута риба принесе ще й власний бонусний предмет. Легендарна риба приносить його завжди."
gs_page_fishing_bait: "Збереження наживки"
gs_page_fishing_bait_line: "$1 $2"
gs_page_fishing_bait_tip: "Шанс, що після вилову риби ви отримаєте наживку назад."
gs_page_fishing_snag: "Зачеп"
gs_page_fishing_snag_line: "$1 $2"
gs_page_fishing_snag_tip: "Раз за закидання: якщо $1 у воді риба не клює, на волосінь може зачепитися знахідка, яка залежить від біому. Вона тягнеться повільно й важко та не дає досвіду."
gs_page_fishing_line: "волосінь"
gs_page_fishing_cast_line: "Закидання +$2, $1 +$3"
gs_page_fishing_line_tip: "Вудка закидається далі, а волосінь рветься на більшій відстані від неї."
gs_page_fishing_line_tip_reach: "Вудка закидається далі, а волосінь рветься, лише коли поплавець віддалиться від неї на $1 м."
gs_page_fishing_perfect_tip: "Почніть змотувати протягом $1 с після поклювання, якщо ще не змотували, — і риба пропустить свій перший ривок."
gs_page_fishing_log_tip: "Журнал записує кожен вид і розмір виловленої риби та ваш найважчий улов. Введіть $1 у чаті або наведіть на рибу, щоб побачити підказку."
gs_page_fishing_log_tip_bonus: "Кожен новий вид чи розмір дарує бонусний досвід."
gs_page_fishing_species_tip: "Коли риба клює, видно, що це за риба, а вдале закидання показує умови лову: світанок, присмерк, дощ чи ніч."
gs_page_fishing_size_tip: "Поклювання також видає рівень риби, так само як і погляд на неї у воді."
gs_page_fishing_double_tip: "Бонусний предмет із витягнутої риби може випасти подвійним: два замість одного."
gs_page_fishing_legendary_tip_tire: "Легендарною виявляється $1% риби, що з'являється у воді: рівень $2, світиться й вимотується після $3 ривків."
gs_page_fishing_legendary_tip_never: "Легендарною виявляється $1% риби, що з'являється у воді: рівень $2, світиться й ніколи не вимотується."
gs_page_fishing_legendary_tip_bait: "З цього рівня легендарна риба забирає вашу наживку, але завжди приносить бонусний предмет."
gs_page_fishing_grace_tip: "Якщо під час боротьби з рибою у вас закінчиться витривалість, вона не зірветься одразу: $1 ви ще тягнете волосінь, поки сили відновлюються. Це працює один раз на рибу. Якщо сил досі немає, риба зривається."
gs_page_fishing_water_tip: "Вдале закидання показує, яка риба в межах досяжності клюне на вашу наживку і чи не ховається неподалік легендарна."

# Husbandry page
gs_page_husbandry_about: "Звірі довіряються вам охочіше, а їхнє потомство виросте сильнішим. Вправність зростає, коли ви приборкуєте, годуєте або розводите тварин."
gs_page_husbandry_off: "Вимкнено на цьому сервері."
gs_page_husbandry_heading_taming: "Приборкання"
gs_page_husbandry_taming: "Швидкість приборкання"
gs_page_husbandry_taming_line: "$1 +$2"
gs_page_husbandry_taming_tip: "Враховується найвищий рівень у межах діапазону приборкання істоти. Додається до бонусу гри на приборкання."
gs_page_husbandry_taming_tip_boar: "Враховується найвищий рівень у межах діапазону приборкання істоти. Приборкання кабана скоротиться із $1 до $2. Додається до бонусу гри на приборкання."
gs_page_husbandry_gates: "Пороги рівня"
gs_page_husbandry_gates_line: "$1: ви проходите $2 із $3"
gs_page_husbandry_gates_tip: "Приборкання просувається, лише коли поруч, у межах діапазону приборкання, є гравець потрібного рівня: $1."
gs_page_husbandry_gate: "$1 $2"
gs_page_husbandry_fed: "Час ситості"
gs_page_husbandry_fed_line: "$1 +$2"
gs_page_husbandry_fed_tip: "Для тварин, що їдять у межах $1 м від вас. Вони приборкуються, розмножуються й лікуються лише поки ситі."
gs_page_husbandry_fed_tip_boar: "Для тварин, що їдять у межах $1 м від вас: час ситості кабана збільшиться із $2 до $3. Вони приборкуються, розмножуються й лікуються лише поки ситі."
gs_page_husbandry_pack: "Ватажок зграї"
gs_page_husbandry_pack_line: "$1: шкода +$2, отримана -$3"
gs_page_husbandry_pack_tip: "Приборканий вовк, що йде за вами, завдає на стільки більше шкоди й отримує на стільки менше."
gs_page_husbandry_heading_breeding: "Розведення"
gs_page_husbandry_breeding: "Швидкість розведення"
gs_page_husbandry_breeding_line: "$1 +$2"
gs_page_husbandry_breeding_tip: "Коротша вагітність і частіше настає кохання в тварин у межах $1 м від вас. Враховується найвищий рівень поруч із ними."
gs_page_husbandry_herd: "Розмір стада"
gs_page_husbandry_herd_line: "$1 +$2"
gs_page_husbandry_herd_tip: "Скільки тварин одного виду можуть тіснитися разом, поки розмноження не припиниться. Гра дозволяє від 4 до 10 залежно від виду."
gs_page_husbandry_offspring: "Краще потомство"
gs_page_husbandry_offspring_line: "$1 $2"
gs_page_husbandry_offspring_tip_ecr: "Шанс, що новонароджений отримає на одну зірку більше, ніж випадає в Elite Creatures Reborn, але не більше ніж на одну зірку вище за сильнішого з батьків."
gs_page_husbandry_offspring_tip_one: "Шанс, що новонароджений або знесене яйце матиме на одну зірку більше, ніж батьки, до $1 зірки."
gs_page_husbandry_offspring_tip_many: "Шанс, що новонароджений або знесене яйце матиме на одну зірку більше, ніж батьки, до $1 зірок."
gs_page_husbandry_twins: "Двійнята"
gs_page_husbandry_twins_line: "$1 $2"
gs_page_husbandry_twins_tip: "Шанс, що слідом за пологами ще за пів хвилини народиться друге маля (у курей знесеться друге яйце). Двійнята двійнят не мають."
gs_page_husbandry_growth: "Швидкість росту"
gs_page_husbandry_growth_line: "$1 +$2"
gs_page_husbandry_growth_tip: "Приборкані малята дорослішають, а теплі яйця вилуплюються швидше, якщо ви в межах $1 м від них."
gs_page_husbandry_growth_tip_piglet: "Приборкані малята дорослішають, а теплі яйця вилуплюються швидше, якщо ви в межах $1 м від них. Час дорослішання порося скоротиться із $2 до $3."
gs_page_husbandry_heading_yield: "Видобуток"
gs_page_husbandry_butcher: "Вихід із туші"
gs_page_husbandry_butcher_line: "$1 +$2"
gs_page_husbandry_butcher_tip: "Більше м'яса, шкур і пір'я з приборканих тварин, яких ви вбиваєте (трофеїв це не стосується). Дробова частина — це шанс на ще одну одиницю."
gs_page_husbandry_produce: "Продукція"
gs_page_husbandry_produce_line: "$1 $2 кожні $3"
gs_page_husbandry_produce_tip: "Шанс, що сита приборкана тварина в межах $1 м від вас сама скине пір'я, обрізки, хутро чи шкури, і вбивати її не доведеться. Враховується найвищий рівень поруч із нею."
gs_page_husbandry_honey: "Додатковий мед"
gs_page_husbandry_honey_line: "$1 $2 за мед"
gs_page_husbandry_honey_tip: "Шанс отримати ще один мед за кожен, який ви забираєте з вулика."
gs_page_husbandry_petting_tip: "Погладьте приборкану тварину, якій не можна віддавати наказів (не вовка): вона буде задоволена $1. Уміння зростає лише від погладжування тієї, що ще не задоволена."
gs_page_husbandry_petting_tip_breeds: "Погладьте приборкану тварину, якій не можна віддавати наказів (не вовка): вона буде задоволена $1 і розмножується на $2% швидше. Уміння зростає лише від погладжування тієї, що ще не задоволена."
gs_page_husbandry_eggs_tip: "Яйця зберігають зірки своєї курки: показують їх, складаються окремо й виводять зіркових курчат."
gs_page_husbandry_lore_tip: "Наведіть курсор на тварину чи яйце, щоб побачити таймери: ситість, приборкання, кохання чи вагітність, місце в стаді, задоволеність, дорослішання й виведення."
gs_page_husbandry_feeder_build: "Молот, Різне, біля верстака."
gs_page_husbandry_feeder_build_cost: "Молот, Різне, біля верстака: $1."
gs_page_husbandry_feeder_cost_item: "$1 $2"
gs_page_husbandry_feeder_walk: "Голодні приборкані тварини та ті, яких зараз приборкують, у межах $1 м підходять до годівниці й їдять із неї."
gs_page_husbandry_calm_tip: "Тварина, яку ви почали приборкувати, не тікає й не нападає, тож приборкання триває поруч із вами. Якщо ви поранили її, вона битиметься з вами $1."

