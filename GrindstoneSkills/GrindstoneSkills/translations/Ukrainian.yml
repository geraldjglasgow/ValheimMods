gs_page_farming_reach_line: "$1: радіус $2 м"
gs_page_farming_reach_tip: "Власний показник гри: один змах збирає всі стиглі рослини в цьому радіусі."
gs_page_farming_bonus: "Бонусний врожай"
gs_page_farming_bonus_game_line: "$1: шанс росте з рівнем"
gs_page_farming_bonus_game_tip: "Власний показник гри: зібрана рослина іноді дає бонус."
gs_page_farming_bonus_line: "$1 $2"
gs_page_farming_bonus_tip: "Шанс, що кожна зібрана рослина додатково дасть свій бонусний врожай."
gs_page_farming_seed: "Повернення насіння"
gs_page_farming_seed_line: "$1 $2"
gs_page_farming_seed_tip: "Шанс, що під час збору ви отримаєте назад ще й насіння, з якого виросла рослина."
gs_page_farming_growth: "Ріст"
gs_page_farming_growth_line: "$1 +$2"
gs_page_farming_growth_tip: "Усе, що ви садите, росте швидше на цей відсоток, і саджанці теж."
gs_page_farming_growth_tip_rain: "Усе, що ви садите, росте швидше на цей відсоток, і саджанці теж. Дощ додає $1%, поки йде."
gs_page_farming_growth_tip_compost: "Усе, що ви садите, росте швидше на цей відсоток, і саджанці теж. Компост додає $1%."
gs_page_farming_growth_tip_both: "Усе, що ви садите, росте швидше на цей відсоток, і саджанці теж. Дощ додає $1%, поки йде, а компост $2%."
gs_page_farming_spacing: "Відстань між рослинами"
gs_page_farming_spacing_line: "$1 -$2"
gs_page_farming_spacing_tip: "Рослинам, які ви садите, потрібно на цю величину менше місця навколо, тож їх можна садити ближче одна до одної."
gs_page_farming_ripening: "Дозрівання"
gs_page_farming_giant: "Гігантська рослина"
gs_page_farming_giant_line: "$1 $2"
gs_page_farming_giant_tip: "Посаджена вами рослина може дозріти гігантською: розміром у x$1 і з урожаєм x$2. Збір такої рослини дає x$3 досвіду."
gs_page_farming_tending_tip: "Натисніть $1 на рослині, що росте: вона отримає $2% часу росту. Раз на ігрову добу."
gs_page_farming_tending_tip_area: "Натисніть $1 на рослині, що росте: вона та кожна рослина, що росте в межах $2 м, отримають $3% часу росту. Раз на ігрову добу."
gs_page_farming_compost_tip: "Бочка в меню розпушувача. Залишки їжі й зайвий врожай у ній щоразу через $1 стають одиницею компосту, і кожна рослина, що росте в межах $2 м, бере по одній: +$3% росту."
gs_page_farming_row_tip: "Поставивши насіння, ви садите ряд із $1 рослин упоперек вашого погляду, кожна за своє насіння. Утримуйте $2, щоб посадити лише одну."
gs_page_farming_replant_tip: "Коли ви збираєте врожай, рослина одразу повертається на те саме місце, а насіння береться з вашого інвентарю."
gs_page_farming_heat_tip: "Рослини, які ви садите, ростуть у Попелистих землях і без щита."
gs_page_farming_cold_tip: "Рослини, які ви садите на Левадах, ростуть також у біомі Гора та в Далекій півночі."
# After a perk's tip when the player switched it off in their own .cfg; $1 is the setting's name as the .cfg writes it
gs_page_farming_own_off: "Вимкнено у вашому конфігу ($1)."

# Woodcutting page
gs_page_woodcutting_about: "Валіть дерева скоріше й добувайте з кожного більше деревини. Вправність зростає, коли ви рубаєте сокирою дерева й колоди."
gs_page_woodcutting_off: "Додатки GrindstoneSkills вимкнені на цьому сервері."
gs_page_woodcutting_felling: "Валка"
gs_page_woodcutting_damage: "Шкода рубки"
gs_page_woodcutting_damage_line: "$1 $2"
gs_page_woodcutting_damage_tip: "Власний показник гри: кожен удар сокири по деревині завдає цю частку шкоди сокири, випадково для кожного удару (на рівні 100 це 85–100%). Витрати витривалості на змах залежать від уміння Сокири."
gs_page_woodcutting_refund: "Повернення витривалості"
gs_page_woodcutting_refund_line: "$1 $2, знос сокири -$3"
gs_page_woodcutting_refund_tip: "Змах, що влучив у деревину, повертає вам цю частку витривалості й на стільки ж менше зношує сокиру. На рівні 100: $1 і -$2."
gs_page_woodcutting_split: "Миттєвий розкол"
gs_page_woodcutting_split_line: "$1 $2, +$3 деревини"
gs_page_woodcutting_split_tip: "Шанс, що удар сокири по колоді одразу розколе її, якщо сокира здатна рубати цю деревину. Така колода дасть на $1 більше деревини. На рівні 100: $2."
gs_page_woodcutting_oldgrowth: "Старий ліс"
gs_page_woodcutting_oldgrowth_line: "$1 до +$2 деревини"
gs_page_woodcutting_oldgrowth_tip: "Колоди великих дерев дають більше деревини залежно від розміру дерева серед його власного виду: нічого, якщо розмір не доходить до $1% свого діапазону, і максимум від $2%. Залежить від рівня того, хто розбиває колоду. На рівні 100: +$3."
gs_page_woodcutting_xp: "Досвід"
gs_page_woodcutting_xp_line: "$1 +$2 за дерево, +$3 за колоду"
gs_page_woodcutting_xp_tip: "Досвід нараховується за кожне зрубане дерево й кожну колоду, розбиту на деревину, а також $1 за кожен змах, що влучив у деревину."
gs_page_woodcutting_xp_tip_tiers: "Береза й дуб дають ×$1 досвіду, Іґґдрасіль ×$2."
gs_page_woodcutting_xp_tip_small: "Саджанці й малі дерева (менш ніж $1 здоров'я) дають $2 досвіду."
gs_page_woodcutting_xp_tip_discovery: "Перше дерево кожного виду дає ×$1 досвіду."
gs_page_woodcutting_timber: "Бережись!"
gs_page_woodcutting_timber_line: "$1 поштовх +$2, безпека від колод $3"
gs_page_woodcutting_timber_tip: "Зрубане вами дерево падає від вас із поштовхом ×$1 сильнішим, ніж у грі, а його колоди завдають вам на стільки менше шкоди (іншим гравцям як зазвичай у грі). На рівні 100: ×$2 і $3."
gs_page_woodcutting_domino: "Доміно"
gs_page_woodcutting_domino_line: "$1 удар +$2"
gs_page_woodcutting_domino_tip: "Колоди зрубаних вами дерев б'ють по інших деревах, колодах і пеньках ×$1 дужче, тож одне дерево може повалити наступне, і так до $2 дерев у ланцюжку. На рівні 100: ×$3."
gs_page_woodcutting_cleanfell: "Чиста валка"
gs_page_woodcutting_cleanfell_line: "$1 $2"
gs_page_woodcutting_cleanfell_tip: "Шанс, що зрубане вами дерево забере з собою пеньок: з пенька випаде його деревина. На рівні 100: $1."
gs_page_woodcutting_replanting: "Пересадка"
gs_page_woodcutting_replanting_line: "$1 $2"
gs_page_woodcutting_replanting_tip: "Шанс, що на місці зрубаного вами дерева пустить корінь вільний саджанець того ж виду, якщо він може там рости. Не в кожного дерева є саджанець. На рівні 100: $1."
gs_page_woodcutting_finds: "Знахідки"
gs_page_woodcutting_finds_line: "$1 $2 за дерево"
gs_page_woodcutting_finds_tip: "Шанс, що зрубане вами дерево ховає знахідку, наприклад пташине гніздо чи дике бджолине гніздо. На рівні 100: $1."

# Pickaxes page
gs_page_pickaxes_about: "Гора піддається скоріше й віддає більше. Вправність зростає, коли ви б'єте кайлом по скелі."
gs_page_pickaxes_off: "Додатки GrindstoneSkills вимкнені на цьому сервері."
gs_page_pickaxes_damage: "Шкода видобутку"
gs_page_pickaxes_damage_line: "$1 $2"
gs_page_pickaxes_damage_tip: "Власний показник гри: кожен удар кайла завдає цю частку його шкоди, випадково для кожного удару (на рівні 100 це 85–100%)."
