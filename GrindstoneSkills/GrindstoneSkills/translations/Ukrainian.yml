gs_page_pickaxes_seams_tip: "Шанс, що змах по скелі з багатьох шматків підсвітить один із шматків поруч: він світиться лише для вас упродовж вказаного часу. Влучіть у нього вчасно, і вийде чистий удар."
gs_page_pickaxes_clean: "Чистий удар"
gs_page_pickaxes_clean_line: "$1 ×$2 шкоди"
gs_page_pickaxes_clean_tip: "Удар по підсвіченому шматку завдає цю шкоду, дає ще один шанс на здобич, коли шматок руди ламається, і одразу відкриває наступну жилу. Удар у будь-яке інше місце скелі перериває ланцюжок."
gs_page_pickaxes_clean_tip_xp: "Удар по підсвіченому шматку завдає цю шкоду, дає ще один шанс на здобич, коли шматок руди ламається, приносить +$1 досвіду (більше в пізніших біомах і на руді) та одразу відкриває наступну жилу. Удар у будь-яке інше місце скелі перериває ланцюжок."
gs_page_pickaxes_splash: "Розліт"
gs_page_pickaxes_splash_line: "$1 $2 шкоди"
gs_page_pickaxes_splash_tip: "Перший удар кожного маху по шматку завдає цю шкоду й сусіднім шматкам: вони діляться нею між собою. Зростає кожні 10 рівнів, до $1 на рівні 100."
gs_page_pickaxes_ore: "Додаткова руда"
gs_page_pickaxes_ore_line: "$1 $2"
gs_page_pickaxes_ore_tip: "Шанс, що кожен розбитий вами шматок рудного покладу скине здобич ще раз. На рівні 100: $1."
gs_page_pickaxes_wear: "Знос кайла"
gs_page_pickaxes_wear_line: "$1 -$2 на камені"
gs_page_pickaxes_wear_tip: "Удари по каменю зношують кайло менше: -$1 на рівні 100."
gs_page_pickaxes_finds: "Знахідки"
gs_page_pickaxes_finds_line: "$1 $2 за шматок"
gs_page_pickaxes_finds_tip: "Шанс, що розбитий вами шматок ховає коштовність, наприклад бурштин чи рубін. Шматки з менш ніж 50 здоров'я отримують лише частину цього шансу, купа бруду десяту. На рівні 100: $1."
gs_page_pickaxes_xp: "Досвід"
gs_page_pickaxes_xp_line: "$1 +$2% за біом, ×$3 на руді"
gs_page_pickaxes_xp_tip: "Змахи, що влучають у камінь, дають більше досвіду в пізніших біомах: від ×$1 у Чорноліссі до ×$2 у Попелистих землях."
gs_page_pickaxes_xp_tip_discovery: "Перший удар по кожному виду рудного покладу дає +$1 досвіду, а далі множиться за тією самою шкалою біомів."
gs_page_pickaxes_xp_tip_server: "Усе це ×$1 на цьому сервері."
gs_page_pickaxes_readtherock_tip: "Наведіть курсор на рудний поклад, щоб побачити зірки жили й шматки, що лишилися. Багаті жили: 1 зірка у $1 покладів, 2 зірки у $2, 3 зірки у $3. Кожна зірка дає тому, хто копає, додаткові кидки здобичі: +$4."
gs_page_pickaxes_echo_tip: "Змах по каменю відшукує найближчий рудний поклад у межах $1 м: звук лунає з його боку, а ви дізнаєтесь його назву й відстань. Не частіше ніж раз на $2; поклади, які знаходить Вилочка, лишаються їй."
gs_page_pickaxes_unbroken_tip: "Чисті удари поспіль б'ють дедалі дужче: другий ×$1, кожен наступний ще +$2, до ×$3."

