gs_page_fishing_log_tip_bonus: "Each new species or size gives bonus experience."
gs_page_fishing_species_tip: "A nibble names the fish, and a cast that lands tells the fishing conditions: dawn, dusk, rain, night."
gs_page_fishing_size_tip: "A nibble also tells the fish's level, and so does looking at a fish in the water."
gs_page_fishing_double_tip: "A landed fish's bonus roll can bring two items instead of one."
gs_page_fishing_legendary_tip_tire: "$1% of spawned fish are legendary: level $2, glowing, and they tire after $3 thrashes."
gs_page_fishing_legendary_tip_never: "$1% of spawned fish are legendary: level $2, glowing, and they never tire."
gs_page_fishing_legendary_tip_bait: "From this level they take your bait, and they always bring a bonus item."
gs_page_fishing_grace_tip: "Once per fish, running out of stamina does not lose it at once: for $1 it takes line while your stamina comes back. Still empty after that, it gets away."
gs_page_fishing_water_tip: "A cast that lands tells which fish in reach take your bait, and whether a legendary one lurks."

