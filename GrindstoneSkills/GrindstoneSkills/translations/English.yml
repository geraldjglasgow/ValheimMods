gs_dodge_counter_tip: "Dodging through an attack readies a counter for $1: the next melee attack you start deals $2 more damage with every hit it lands. Bows, staffs and throws neither use it up nor gain from it."
gs_dodge_heavyroll_tip: "You can dodge while over-encumbered, at x$1 stamina: $2 a roll now, against $3 for an ordinary one."

