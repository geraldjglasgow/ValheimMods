gs_mastery_edge_tip: "Sword hits on a staggered foe deal $1 more damage, on top of the double damage the game already gives a staggered creature."
gs_mastery_bleed_tip: "Knife hits also poison the foe for $1 of the hit's damage, before its resistances; foes immune to poison take none. Poison does not stack: a new dose replaces the one running only when it is bigger."
gs_mastery_crush_tip: "Club hits build $1 more stagger, so foes are knocked off balance sooner."
gs_mastery_sweep_tip: "Atgeir hits knock foes back $1 harder. Heavy foes still barely move."
gs_mastery_longthrow_tip: "Thrown spears deal $1 more damage. Held spear thrusts are unchanged."
gs_mastery_rend_tip: "Each axe hit on the same foe within $1 of the last deals $2 more than the one before, up to $3 once $4 hits have landed in a row."
gs_mastery_brawler_tip: "Unarmed hits, bare fists and claws alike, deal $1 more damage."

# Weapon Mastery: ranged and magic milestones
gs_perk_recover: "Recover"
gs_perk_steadyreload: "Steady Reload"
gs_perk_attunement: "Attunement"
gs_perk_lifetap: "Life Tap"
gs_perk_shieldtraining: "Shield Training"
gs_mastery_recover_tip: "Each bow shot has a $1 chance to use no arrow: it stays in your inventory."
gs_mastery_steadyreload_tip: "Sprinting, jumping or dodging pauses a crossbow reload instead of restarting it: it goes on from where it was once you stop."
gs_mastery_attunement_tip: "+$1 eitr regeneration while you hold an Elemental Magic staff. Adds up with the regeneration bonuses of meads and gear."
gs_mastery_lifetap_tip: "Blood magic spells that cost health cost $1 less health, on top of the skill's own cut."
gs_mastery_shieldtraining_tip: "A blood magic shield you cast, on yourself or anyone else, trains your Blood Magic as it absorbs hits from creatures: 1 experience per $1 damage (a spell that hits gives 1), at most $2 per hit. Falls, fire and players' hits train nothing. The game's own experience when a shield breaks still goes to whoever wears it."
