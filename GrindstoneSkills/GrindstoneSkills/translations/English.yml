gs_sneak_prowl_tip: "Crouched walking $1 m/s at your level (+$2), $3 untrained, before gear. +$4 at level 100. Not while over-encumbered."
gs_sneak_softsteps_tip: "Attacking, dodging, mining and building from a crouch make $1 less noise at your level, $2 less at level 100. Creatures hear you only within your noise; crouched walking makes none."
gs_sneak_assassin_tip: "A sneak attack, on a creature that has not noticed you, deals $1 more at your level, $2 more at level 100, on top of the weapon's own bonus, and gives $3 Sneak experience. One per creature every $4, as in the game."
gs_sneak_vanish_tip: "Crouch for $1 with no enemy within $2 m while creatures hunt you, and every one within $3 m loses track of you. Not bosses. Once every $4."

