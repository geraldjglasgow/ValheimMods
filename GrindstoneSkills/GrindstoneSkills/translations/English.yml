# GrindstoneSkills - English words
#
# To translate: copy this file as GrindstoneSkills.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the game), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it). In the skills window a word you can hover (a "term") is its own
# key and goes into its line as $1: translate the term once and the line keeps it.

# GrindstoneSkills: the skills window (sort bar, info pane, page helpers) and the names of the mod's own skills.
# One line per word, the text double-quoted; $1, $2 ... are values filled in by the mod.

# The mod's own skills, named the way the game names a skill: skill_ + its type number (the stable hash of its identity)
skill_2060925741: "Sailing"
skill_585068027: "Foraging"
skill_1869457860: "Husbandry"
skill_1650628550: "Defense"

