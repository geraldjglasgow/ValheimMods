gs_jump_lightfeet_tip: "A jump costs $1 stamina at your level instead of $2, before gear: -$3. -$4 at level 100."
gs_jump_softlanding_tip: "Falls up to $1 m do you no harm at your level ($2 m untrained, $3 m at level 100). Longer falls hurt $4 less ($5 at level 100): at most $6 damage, from $7 m."
gs_jump_roll_tip: "Land from a fall that would hurt while moving forward and you roll: no damage from falls up to $1 m ($2 m at level 100), $3 of the damage above that. The roll costs no stamina and does not shield you from hits."

# Swimming
gs_perk_quickdry: "Quick Dry"
gs_perk_longbreath: "Long Breath"
gs_perk_salvage: "Salvage"
gs_perk_diving: "Diving"
gs_perk_waterbuilder: "Water Builder"
gs_swim_quickdry_tip: "Wet ends $1 sooner after you leave the water or the rain. $2 at level 100."
gs_swim_quickdry_tip_times: "Wet ends $1 sooner after you leave the water or the rain: $2 at your level, $3 untrained, $4 at level 100."
gs_swim_longbreath_tip: "Out of stamina in water, drowning starts $1 s later and hurts $2 less: $3 of max health a second instead of $4. $5 s later and $6 less at level 100."
gs_swim_salvage_tip: "While you swim, loose items are picked up from $1 m instead of $2 m. $3 m at level 100."
gs_swim_diving_tip: "Hold Crouch to dive and Jump to swim up; under water you swim where you look. Breath lasts $1 s at your level ($2 s untrained, $3 s at level 100), then you drown until you come up for air."
gs_swim_waterbuilder_tip: "The hammer, hoe and cultivator stay in your hands while you swim: build from the water, or on the bottom while you dive."
gs_swim_breath: "Breath"
gs_swim_breath_tooltip: "Seconds of breath left under water."

