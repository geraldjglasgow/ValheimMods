gs_page_fishing_snag: "Snag"
gs_page_fishing_snag_line: "$1 $2"
gs_page_fishing_snag_tip: "Once per cast, after $1 in the water without a bite, the line can catch a find from the biome's snag list. It reels in slow and heavy, and gives no experience."
gs_page_fishing_line: "line"
gs_page_fishing_cast_line: "Cast +$2, $1 +$3"
gs_page_fishing_line_tip: "Casts fly farther, and the line snaps further from the rod."
gs_page_fishing_line_tip_reach: "Casts fly farther, and the line snaps only once the float is $1 m from the rod."
