gs_page_husbandry_fed: "Tempo alimentado"
gs_page_husbandry_fed_line: "$1 +$2"
gs_page_husbandry_fed_tip: "Para animais que comem em um raio de $1 m de você. Eles só domesticam, reproduzem e curam enquanto estiverem alimentados."
gs_page_husbandry_fed_tip_boar: "Para animais que comem em um raio de $1 m de você: os $2 de um javali tornam-se $3. Eles só domesticam, reproduzem e curam enquanto estiverem alimentados."
