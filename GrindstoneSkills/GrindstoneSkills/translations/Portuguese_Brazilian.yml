gs_page_fishing_reel_stamina: "Vigor ao recolher"
gs_page_fishing_reel_stamina_line: "$1 -$2"
gs_page_fishing_reel_stamina_tip: "Própria do jogo: recolher consome essa quantidade a menos de vigor. Um peixe na linha também drena $1 de vigor por segundo."
