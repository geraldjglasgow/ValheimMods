gs_sneak_vanish_tip: "Agache-se por $1 sem nenhum inimigo em um raio de $2 m enquanto as criaturas te caçam, e cada uma delas em um raio de $3 m perderá o seu rastro. Não afeta chefes. Ativa uma vez a cada $4."

# Dodging
gs_perk_longroll: "Rolagem Longa"
gs_perk_counter: "Contra-ataque"
gs_perk_heavyroll: "Rolagem Pesada"
gs_dodge_counter_callout: "Contra-ataque!"
gs_dodge_longroll_tip: "Sua rolagem te mantém invulnerável por $1 a mais no seu nível atual, e por $2 a mais no nível 100."
gs_dodge_longroll_last: "Sua última rolagem: $1 s invulnerável sem a vantagem, $2 s com ela."
gs_dodge_counter_tip: "Esquivar-se através de um ataque prepara um contra-ataque por $1: o próximo ataque corpo a corpo que você iniciar causará $2 a mais de dano a cada golpe que acertar. Arcos, cajados e arremessos não consomem nem se beneficiam deste efeito."
gs_dodge_heavyroll_tip: "Você pode se esquivar mesmo com excesso de peso, ao custo de x$1 de vigor: consome $2 por rolagem agora, contra $3 de uma rolagem comum."

# Riding
gs_perk_gallop: "Galope"
gs_perk_steadyseat: "Assento Firme"
gs_ride_gallop_tip: "A montaria que você cavalga corre $1 mais rápido, acumulando sobre a velocidade de galope do jogo exibida acima. +$2 no nível 100."
gs_ride_steadyseat_tip: "A montaria recebe $1 a menos de dano enquanto você a cavalga, incluindo afogamento. $2 a menos no nível 100."

# Weapon Mastery: Catch Up and Weapon Switch lines on every skill's page
gs_mastery_catchup_term: "Recuperação"
gs_mastery_catchup_line: "$1: x$2 até o nível $3"
gs_mastery_catchup_tip: "Recuperação: esta habilidade está abaixo do nível $1 (o maior nível que ela já atingiu), logo, ela ganha x$2 de experiência até retornar a esse patamar. O maior nível de cada habilidade fica salvo com o personagem."
gs_mastery_switch_term: "Alternância de Arma"
gs_mastery_switch_line: "$1: +$2 de experiência"
gs_mastery_switch_tip: "Uma habilidade de arma que esteja abaixo da sua melhor habilidade de arma ganha $1 a mais de experiência, até alcançar o nível da sua melhor habilidade de arma (nível $2)."

# Weapon Mastery: melee milestones
gs_perk_edge: "Gume"
gs_perk_bleed: "Sangramento"
gs_perk_crush: "Esmagamento"
gs_perk_polearmsweep: "Varredura"
gs_perk_longthrow: "Arremesso Longo"
gs_perk_rend: "Dilacerar"
gs_perk_brawler: "Briguento"
gs_mastery_edge_tip: "Golpes de espada em um inimigo atordoado causam $1 a mais de dano, acumulando sobre o dobro de dano que o jogo base já concede contra criaturas atordoadas."
gs_mastery_bleed_tip: "Golpes de faca também envenenam o inimigo em $1 do dano do golpe, antes de aplicar resistências; inimigos imunes a veneno não sofrem o efeito. O veneno não se acumula: uma nova dose substitui a atual apenas se causar mais dano."
gs_mastery_crush_tip: "Golpes de clava acumulam $1 a mais de atordoamento, fazendo com que os inimigos percam o equilíbrio mais rápido."
gs_mastery_sweep_tip: "Golpes de Atgeir empurram os inimigos $1 mais forte para trás. Inimigos pesados ainda mal se movem."
gs_mastery_longthrow_tip: "Lanças arremessadas causam $1 a mais de dano. Estocadas com a lança empunhada continuam inalteradas."
gs_mastery_rend_tip: "Cada golpe de machado no mesmo inimigo dentro de $1 desde o último causa $2 a mais de dano que o anterior, limitando-se a até $3 assim que $4 golpes consecutivos acertarem."
gs_mastery_brawler_tip: "Golpes desarmados, sejam com os punhos limpos ou com garras, causam $1 a mais de dano."

# Weapon Mastery: ranged and magic milestones
gs_perk_recover: "Recuperar"
gs_perk_steadyreload: "Recarga Firme"
gs_perk_attunement: "Sintonia"
gs_perk_lifetap: "Sifão de Vida"
gs_perk_shieldtraining: "Treino de Escudo"
gs_mastery_recover_tip: "Cada disparo de arco tem uma chance de $1 de não consumir a flecha: ela permanece no seu inventário."
gs_mastery_steadyreload_tip: "Correr arrancada, saltar ou se esquivar pausa a recarga da besta em vez de reiniciá-la: ela continua de onde parou assim que você cessar a ação."
gs_mastery_attunement_tip: "+$1 de regeneração de eitr enquanto você empunhar um cajado de Magia Elemental. Acumula com os bônus de regeneração de hidroméis e equipamentos."
gs_mastery_lifetap_tip: "Feitiços de magia de sangue que consomem vida custam $1 a menos de vida, acumulando sobre a redução nativa da própria perícia."
gs_mastery_shieldtraining_tip: "Um escudo de magia de sangue conjurado por você, em si mesmo ou em qualquer outra pessoa, treina a sua perícia de Magia de Sangue conforme absorve golpes de criaturas: concede 1 de experiência a cada $1 de dano (um feitiço que acerta concede 1), limitando-se a no máximo $2 por golpe. Quedas, fogo e golpes de jogadores não geram experiência. A experiência padrão do jogo concedida quando um escudo quebra ainda vai para quem estiver usando o escudo."
