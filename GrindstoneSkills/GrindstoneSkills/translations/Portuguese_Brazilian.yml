gs_page_husbandry_herd_line: "$1 +$2"
gs_page_husbandry_herd_tip: "Mais animais de uma mesma espécie podem se aglomerar antes que a reprodução seja interrompida. O jogo permite de 4 a 10 dependendo da espécie."
gs_page_husbandry_offspring: "Filhote melhor"
gs_page_husbandry_offspring_line: "$1 $2"
gs_page_husbandry_offspring_tip_ecr: "Chance de um recém-nascido obter uma estrela a mais do que o sorteado pelo Elite Creatures Reborn, limitado a até uma estrela acima do progenitor mais forte."
gs_page_husbandry_offspring_tip_one: "Chance de um recém-nascido ou de um ovo botado ter uma estrela acima do progenitor, limitado a até $1 estrela."
gs_page_husbandry_offspring_tip_many: "Chance de um recém-nascido ou de um ovo botado ter uma estrela acima do progenitor, limitado a até $1 estrelas."
gs_page_husbandry_twins: "Gêmeos"
gs_page_husbandry_twins_line: "$1 $2"
gs_page_husbandry_twins_tip: "Chance de um nascimento ser acompanhado por um segundo (um segundo ovo para as galinhas) meio minuto depois. Um gêmeo nunca tem gêmeos."
gs_page_husbandry_growth: "Velocidade de crescimento"
gs_page_husbandry_growth_line: "$1 +$2"
gs_page_husbandry_growth_tip: "Filhotes domesticados crescem e ovos aquecidos chocam mais rápido em um raio de $1 m de você."
gs_page_husbandry_growth_tip_piglet: "Filhotes domesticados crescem e ovos aquecidos chocam mais rápido em um raio de $1 m de você: os $2 de um leitão tornam-se $3."
gs_page_husbandry_heading_yield: "Rendimento"
gs_page_husbandry_butcher: "Rendimento do abate"
gs_page_husbandry_butcher_line: "$1 +$2"
gs_page_husbandry_butcher_tip: "Mais carne, peles e penas de animais domesticados que você matar (nunca troféus). Valores fracionados representam a chance de obter uma unidade a mais."
gs_page_husbandry_produce: "Produção"
gs_page_husbandry_produce_line: "$1 $2 a cada $3"
gs_page_husbandry_produce_tip: "Chance de um animal domesticado alimentado em um raio de $1 m de você derrubar penas, restos, fragmentos ou peles sem precisar ser morto. O maior nível perto dele é o que conta."
gs_page_husbandry_honey: "Mel extra"
gs_page_husbandry_honey_line: "$1 $2 por mel"
gs_page_husbandry_honey_tip: "Chance de obter uma unidade a mais para cada mel retirado de uma colmeia."
gs_page_husbandry_petting_tip: "Acaricie um animal domesticado que você não possa comandar (exceto lobos): ele ficará contente por $1. Apenas fazer carinho em um que ainda não esteja contente treina a habilidade."
gs_page_husbandry_petting_tip_breeds: "Acaricie um animal domesticado que você não possa comandar (exceto lobos): ele ficará contente por $1 e se reproduzirá $2% mais rápido. Apenas fazer carinho em um que ainda não esteja contente treina a habilidade."
gs_page_husbandry_eggs_tip: "Os ovos mantêm as estrelas da galinha que os botou: eles as exibem, acumulam-se separadamente no inventário e chocam pintinhos com estrelas."
gs_page_husbandry_lore_tip: "Passar o cursor sobre um animal ou ovo mostra seus cronômetros: alimentação, domesticação, afeto ou gestação, espaço do rebanho, contentamento, crescimento e incubação."
gs_page_husbandry_feeder_build: "Martelo, Miscelânea, perto de uma bancada de trabalho."
gs_page_husbandry_feeder_build_cost: "Martelo, Miscelânea, perto de uma bancada de trabalho: $1."
gs_page_husbandry_feeder_cost_item: "$1 $2"
gs_page_husbandry_feeder_walk: "Animais domesticados famintos e criaturas em processo de domesticação em um raio de $1 m caminham até ele e comem sua comida."
gs_page_husbandry_calm_tip: "Uma criatura que você começou a domesticar não irá fugir de você nem te atacar, permitindo que a domesticação continue ao seu lado. Se feri-la, ela lutará contra você por $1."

