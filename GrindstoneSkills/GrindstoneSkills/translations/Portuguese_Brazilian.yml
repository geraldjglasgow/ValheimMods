gs_page_fishing_bite_line: "$1 +$2"
gs_page_fishing_bite_tip: "Mais peixes irão atrás da sua boia. As mordidas também aumentam $1% ao amanhecer e anoitecer e $2% sob a chuva."
gs_page_fishing_bite_tip_chum: "Mais peixes irão atrás da sua boia. As mordidas também aumentam $1% ao amanhecer e anoitecer, $2% sob a chuva e $3% em um raio de $4 m de engodo ($5) flutuando na água."
gs_page_fishing_heading_fight: "A luta"
gs_page_fishing_strike: "Janela de fisgada"
gs_page_fishing_strike_line: "$1 $2 s"
gs_page_fishing_strike_tip: "Tempo após um puxão na linha em que recolher confirma a fisgada. O padrão do jogo é de 0.5 s."
gs_page_fishing_tension: "Tensão da linha"
gs_page_fishing_tension_line: "$1 $2/s"
gs_page_fishing_tension_tip: "Recolher a linha enquanto o peixe se debate preenche a barra abaixo da mira nesta taxa; uma barra cheia arrebenta a linha. Soltar o botão alivia a tensão em $1/s."
gs_page_fishing_tension_tip_spent: "Após se debater por $1 vezes, o peixe fica exausto e vem vindo $2% mais rápido."
gs_page_fishing_heading_catch: "A captura"
gs_page_fishing_big_one: "Peixe grande"
gs_page_fishing_big_one_line: "$1 $2"
gs_page_fishing_big_one_tip: "Chance de um peixe fisgado subir um nível, sorteado novamente até o nível $1: +$2% à noite."
gs_page_fishing_bonus: "Item bônus"
gs_page_fishing_bonus_line: "$1 $2"
gs_page_fishing_bonus_range: "$1-$2"
gs_page_fishing_bonus_tip: "Chance de um peixe retirado da água trazer também um item bônus próprio. Um peixe lendário sempre traz."
gs_page_fishing_bait: "Economia de isca"
gs_page_fishing_bait_line: "$1 $2"
gs_page_fishing_bait_tip: "Chance de um peixe retirado da água devolver a sua isca."
gs_page_fishing_snag: "Fisgar detrito"
gs_page_fishing_snag_line: "$1 $2"
gs_page_fishing_snag_tip: "Uma vez por arremesso, após $1 na água sem nenhuma mordida, a linha pode fisgar um achado da lista de detritos do bioma. Ele é recolhido de forma lenta e pesada, e não concede experiência."
gs_page_fishing_line: "linha"
gs_page_fishing_cast_line: "Arremesso +$2, linha $1 +$3"
gs_page_fishing_line_tip: "Os arremessos voam mais longe, e a linha aguenta mais antes de arrebentar em relação à vara."
gs_page_fishing_line_tip_reach: "Os arremessos voam mais longe, e a linha só arrebenta quando a boia estiver a $1 m de distância da vara."
gs_page_fishing_perfect_tip: "Comece a recolher dentro de $1 s após um puxão, caso já não estivesse recolhendo antes, e o peixe pulará o seu primeiro debate."
gs_page_fishing_log_tip: "Cada espécie e tamanho que você retira da água é registrado com a sua maior captura. Digite $1 no chat ou leia a descrição de um peixe."
gs_page_fishing_log_tip_bonus: "Cada nova espécie ou tamanho descoberto concede experiência bônus."
gs_page_fishing_species_tip: "Um beliscão na linha revela o nome do peixe, e um arremesso bem-sucedido informa as condições de pesca: amanhecer, anoitecer, chuva, noite."
gs_page_fishing_size_tip: "Um beliscão na linha também revela o nível do peixe, assim como olhar diretamente para um peixe na água."
gs_page_fishing_double_tip: "O sorteio de bônus de um peixe retirado da água pode trazer dois itens em vez de apenas um."
gs_page_fishing_legendary_tip_tire: "$1% dos peixes gerados são lendários: nível $2, brilham e ficam exaustos após se debaterem por $3 vezes."
gs_page_fishing_legendary_tip_never: "$1% dos peixes gerados são lendários: nível $2, brilham e nunca ficam exaustos."
gs_page_fishing_legendary_tip_bait: "A partir deste nível eles mordem a sua isca e sempre trazem um item bônus."
gs_page_fishing_grace_tip: "Uma vez por peixe, ficar sem vigor não faz você perdê-lo imediatamente: por $1 ele leva a linha enquanto seu vigor se recupera. Se continuar vazio após isso, ele foge."
gs_page_fishing_water_tip: "Um arremesso bem-sucedido informa quais peixes ao alcance mordem a sua isca e se um lendário está à espreita."

# Husbandry page
gs_page_husbandry_about: "Domestique mais rápido e crie animais melhores. Treinada ao domesticar, alimentar e cruzar os animais."
gs_page_husbandry_off: "Desativada neste servidor."
