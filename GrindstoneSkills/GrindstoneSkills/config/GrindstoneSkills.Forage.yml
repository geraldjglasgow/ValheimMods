# GrindstoneSkills.Forage.yml - what counts as foraging.
#
# Picking a wild plant or a loose stone whose item is listed here trains the Foraging skill. Listed items with
# "stars: true" roll 0 to 3 stars from the picker's Foraging level, the same stars cooked dishes carry: starred
# forage makes better dishes and gives more when eaten raw. The odds are the table in section "3 - Odds" of the .cfg.
#
# Crops are never foraging: a pickable that any plant can grow (carrots, turnips, onions, barley, flax, Jotun puffs,
# magecap, seed carrots and the like, planted or wild) belongs to Farming, even when its item is listed here.
#
# The server's copy is sent to every player while the server's "Lock Configuration" is on; edits are picked up a few
# seconds after saving, no restart needed. Extra files named GrindstoneSkills.Forage<anything>.yml next to this one
# are read as well; an item in a later file replaces the same item in an earlier file.
#
# LAYOUT
#
#   forage:
#     <ItemPrefab>:      the picked item's prefab name as the game spells it: Raspberry, Thistle, Flint...
#                        Items added by other mods work too. "Raspberry:" with nothing after it counts the item as
#                        forage with every value below left at its default.
#       stars:           true or false. Whether picks of this item roll stars. Optional, false if left out.
#                        Turning stars off for an item that already has starred copies: they keep their stars, but
#                        after the next restart recipes no longer count them. Eat them first.
#       best:            when the plant is at its best: one or more of day, night, wet (raining) and dry. All that
#                        are listed must hold, so [day, dry] means a dry day. Picked then, it rolls its stars as if
#                        the picker were "Best Time Levels" (section 34) higher, and pointing at it says so.
#                        Optional; only matters with stars.
#       experience:      Foraging experience of one pick, as a factor of "Experience Per Pick" (section 33).
#                        Optional, 1 if left out; 0 gives none.

forage:
  # Berries, sweetest in the sun.
  Raspberry: { stars: true, best: [day, dry] }
  Blueberries: { stars: true, best: [day, dry] }
  Cloudberry: { stars: true, best: [day, dry] }
  Lingonberry: { stars: true, best: [day, dry] }

  # Mushrooms come up in the rain.
  Mushroom: { stars: true, best: wet }
  MushroomYellow: { stars: true, best: wet }
  MushroomBlue: { stars: true, best: night }
  MushroomSmokePuff: { stars: true, best: wet }

  # Herbs and greens.
  Thistle: { stars: true, best: night }
  Dandelion: { stars: true, best: day }
  Fiddleheadfern: { stars: true, best: day }
  RoyalJelly: { stars: true, best: day }

  # Gathered from the ground: experience, never stars.
  Flint: { experience: 0.5 }
  Stone: { experience: 0.5 }
  Grausten: { experience: 0.5 }
  Wood: { experience: 0.5 }
  Frostwood: { experience: 0.5 }

  # Wild grain and fibre (Pickable_Barley_Wild, Pickable_Flax_Wild): experience, no stars.
  Barley: { experience: 1 }
  Flax: { experience: 1 }
