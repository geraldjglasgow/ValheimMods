# EliteCrafting - economy
#
# Rarities, rolling rules, stones, sigils, item tiers, biome tiers and drop tables.
# Written once, on first run, as a full copy of the built-in defaults; the mod never
# rewrites it. The built-in defaults stay underneath this file (set
# `use_defaults: false` to make the files the whole configuration).
#
# Extra files named EliteCrafting_economy_<anything>.yml are read after this one, in
# file-name order, and change only what they name:
#   - rarities and stones merge by `id`, field by field;
#   - maps (cost, weights, item_tiers.*, biomes, drops.stones, drops.bosses, ...)
#     merge by key; a key set to null is removed;
#   - lists (applies_to, slots, outcomes, a stone's seven drop weights) are replaced whole.
#
# Chances are percent numbers (4 means 4%). Weights are relative. Lists indexed by
# tier have exactly seven entries: tier 1 (meadows) first, tier 7 (ashlands) last.

# The ladder, lowest first. The first entry is the base rarity (no affixes, never
# glows). `mythic_affixes` marks the rarity whose items draw that many affixes from
# the Mythic-only pool. `drop_weight` multiplies the rarity's weight in every drop
# table; 0 means it never drops.
rarities:
  - id: common
    color: "#FFFFFF"
    glow: false
    affixes: { min: 0, max: 0 }
    drop_weight: 0
  - id: uncommon
    color: "#1EFF00"
    affixes: { min: 1, max: 2 }
  - id: rare
    color: "#0070DD"
    affixes: { min: 2, max: 3 }
  - id: epic
    color: "#A335EE"
    affixes: { min: 3, max: 4 }
  - id: legendary
    color: "#FF8000"
    affixes: { min: 4, max: 5 }
  - id: mythic
    color: "#E6262E"
    affixes: { min: 6, max: 6 }
    mythic_affixes: 1
    drop_weight: 0            # craft-only: raise it AND give Mythic drop weights to open drops

# How affixes are drawn. An item rolls affix tiers from `ceiling - tier_window + 1`
# up to its tier ceiling. A promotion always adds at least `promote_adds_at_least`
# affixes. `count_weights` biases how many affixes a fresh roll gets.
rolling:
  tier_window: 3
  promote_adds_at_least: 1
  # count_weights:
  #   legendary: { 4: 3, 5: 1 }

# Every stone. Common fields: id, prefab (ECF_ + PascalCase id for the built-in
# stones; ECF_Custom01..16 for your own), verb, grade, applies_to (rarities),
# cost (per rarity, default 1), tier_floor, enabled, confirm (hold Shift / dialog),
# stack (default 50), item_weight (the item weight of one stone, default 0.2),
# name, description (loc key or text), tint.
# Verbs: promote, add, swap, reroll_affixes, reroll_values, remove, strip, corrupt,
# lock, duplicate, gamble, quality, sigil, imbue (essences: `family` names an
# essence_families entry; `tier_floor` binds the guaranteed affix only; 7 = the
# item's top tier). enabled: false keeps a stone from
# dropping and from being used; its prefab (and every stack of it) stays.
stones:
  # --- ascension ---
  - { id: awakening,     verb: promote, applies_to: [common] }
  - { id: ascension,     verb: promote, applies_to: [uncommon] }
  - { id: exaltation,    verb: promote, applies_to: [rare] }
  - { id: transcendence, verb: promote, applies_to: [epic] }
  - { id: apotheosis,    verb: promote, applies_to: [legendary] }

  # --- manipulation ---
  - { id: growth_lesser,      verb: add,            grade: lesser,  applies_to: [uncommon, rare] }
  - { id: growth_greater,     verb: add,            grade: greater, applies_to: [epic, legendary, mythic] }
  - { id: turmoil_lesser,     verb: swap,           grade: lesser,  applies_to: [uncommon, rare] }
  - { id: turmoil_greater,    verb: swap,           grade: greater, applies_to: [epic, legendary, mythic] }
  - { id: upheaval_lesser,    verb: reroll_affixes, grade: lesser,  applies_to: [uncommon, rare] }
  - { id: upheaval_greater,   verb: reroll_affixes, grade: greater, applies_to: [epic, legendary, mythic] }
  - { id: perfection_lesser,  verb: reroll_values,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: perfection_greater, verb: reroll_values,  grade: greater, applies_to: [epic, legendary, mythic] }
  - { id: severing_lesser,    verb: remove,         grade: lesser,  applies_to: [uncommon, rare] }
  - { id: severing_greater,   verb: remove,         grade: greater, applies_to: [epic, legendary, mythic] }
  - id: unmaking
    verb: strip
    applies_to: [uncommon, rare, epic, legendary, mythic]
    confirm: true

  # --- risk and endgame ---
  - id: serpent
    verb: corrupt
    applies_to: [uncommon, rare, epic, legendary, mythic]
    confirm: true
    overflow: 1
    outcomes:
      - { outcome: seal_only,      weight: 25 }
      - { outcome: add_affix,      weight: 25 }
      - { outcome: chaotic_reroll, weight: 20 }
      - { outcome: promote,        weight: 15 }
      - { outcome: demote,         weight: 15 }
  - id: binding
    verb: lock
    applies_to: [uncommon, rare, epic, legendary, mythic]
    max_bound: 1
  - id: chance
    verb: gamble
    applies_to: [common]
    weights: { common: 0, uncommon: 50, rare: 30, epic: 15, legendary: 5, mythic: 0 }
  - id: reflection
    verb: duplicate
    applies_to: [uncommon, rare, epic, legendary, mythic]
    seal_copy: true

  # --- quality ---
  - id: honing
    verb: quality
    applies_to: [common, uncommon, rare, epic, legendary, mythic]
    slots: [melee_weapon, ranged_weapon, magic_weapon]
    step: 1
    cap: 10
  - id: tempering
    verb: quality
    applies_to: [common, uncommon, rare, epic, legendary, mythic]
    slots: [head, chest, legs, cape, shield]
    step: 1
    cap: 10

  # --- sigils ---
  - { id: sigil_preservation, verb: sigil, steer: preserve, applies_to: [common, uncommon, rare, epic, legendary, mythic] }
  - { id: sigil_war,          verb: sigil, steer: category, category: offense, applies_to: [common, uncommon, rare, epic, legendary, mythic] }
  - { id: sigil_warding,      verb: sigil, steer: category, category: defense, applies_to: [common, uncommon, rare, epic, legendary, mythic] }
  - { id: sigil_fortune,      verb: sigil, steer: category, category: utility, applies_to: [common, uncommon, rare, epic, legendary, mythic] }
  - { id: sigil_culling,      verb: sigil, steer: cull,     applies_to: [common, uncommon, rare, epic, legendary, mythic] }

  # --- essences: reroll like Upheaval, one new affix always from the family ---
  - { id: essence_storm_lesser,   verb: imbue, family: storm,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_storm_greater,  verb: imbue, family: storm,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_grove_lesser,   verb: imbue, family: grove,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_grove_greater,  verb: imbue, family: grove,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_venom_lesser,   verb: imbue, family: venom,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_venom_greater,  verb: imbue, family: venom,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_frost_lesser,   verb: imbue, family: frost,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_frost_greater,  verb: imbue, family: frost,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_battle_lesser,  verb: imbue, family: battle, grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_battle_greater, verb: imbue, family: battle, grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_seidr_lesser,   verb: imbue, family: seidr,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_seidr_greater,  verb: imbue, family: seidr,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_ember_lesser,   verb: imbue, family: ember,  grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_ember_greater,  verb: imbue, family: ember,  grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }
  - { id: essence_tide_lesser,    verb: imbue, family: tide,   grade: lesser,  applies_to: [uncommon, rare] }
  - { id: essence_tide_greater,   verb: imbue, family: tide,   grade: greater, applies_to: [uncommon, rare, epic, legendary, mythic], tier_floor: 7 }

# A pending sigil is consumed only by a stone it steers, unless this is true.
sigils:
  consume_on_unsteered: false

# The affixes each essence family guarantees one of (family id -> { affixes, name }).
# Members are affix ids from EliteCrafting_affixes*.yml; one that is not defined
# there, disabled or Mythic-only is skipped with a warning. `affixes` is replaced whole.
essence_families:
  storm:  { affixes: [stormbrand, stormward, bulwark_lightning, fleetfoot, stride, spring_heeled, light_leap, nimble, perfect_guard, keen_guard] }
  grove:  { affixes: [bonebreaker, heartwood, woodcutting_mastery, troll_blood, mending, bramblehide, ironroot, repelling_guard, anchored_guard, harvester, farming_mastery] }
  venom:  { affixes: [venombrand, blood_drinker, blood_thrift, venomward, bulwark_poison, purity, marshstrider, oilskin] }
  frost:  { affixes: [rimebrand, frostward, bulwark_frost, coldblood, winterborn, mountain_goat, long_wind, endurance, soft_landing, ravens_glide] }
  battle: { affixes: [honed_might, keen_edge, needlepoint, berserkergang, padded, mailed, riveted, ironclad, arrowward, valhallas_edge, stalwart, tireless_guard, broad_back, trophy_taker] }
  seidr:  { affixes: [primal_fury, seidr_siphon, rune_edge, seidr_thrift, soul_reaper, elemental_mastery, wellspring, seidr_flow, restless_mind, runic_ward, mist_veil, mistbane, seidr_riposte] }
  ember:  { affixes: [emberbrand, flameward, bulwark_fire, ashen_skin, emberheart, hearthlight] }
  tide:   { affixes: [slayer_sea, sealegs, strong_swimmer, fair_winds, huginns_eye, fishing_mastery] }

# Grinding a magic item into shards (the Salvage key, default End, over an item
# in your own inventory) and fusing shards into stones (right-click the shards;
# Shift + right-click fuses every full set). The on/off switch is `Salvage` in
# com.EliteCrafting.cfg. `confirm` asks first in the player's confirm mode.
# `stations`: empty = anywhere, else one of these station prefabs must be in range.
# `yields`: rarity -> rows { fragment, amount, chance (percent) }; a rarity's list is
# replaced whole. `fragments` merge by `id` (the five built-in shards only):
# stone (what they fuse into), fuse (shards per stone), name, description, stack,
# item_weight, tint.
salvage:
  confirm: true
  stations: []
  yields:
    uncommon:  [ { fragment: shard_awakening,     amount: 2 } ]
    rare:      [ { fragment: shard_ascension,     amount: 2 } ]
    epic:      [ { fragment: shard_exaltation,    amount: 2 } ]
    legendary: [ { fragment: shard_transcendence, amount: 2 } ]
    mythic:    [ { fragment: shard_apotheosis,    amount: 2 } ]
  fragments:
    - { id: shard_awakening,     stone: awakening,     fuse: 5 }
    - { id: shard_ascension,     stone: ascension,     fuse: 5 }
    - { id: shard_exaltation,    stone: exaltation,    fuse: 5 }
    - { id: shard_transcendence, stone: transcendence, fuse: 5 }
    - { id: shard_apotheosis,    stone: apotheosis,    fuse: 10 }

# The tier ceiling of each item (1 meadows ... 7 ashlands): an explicit entry in
# `items` wins; otherwise the highest tier among its recipe's materials (crafted
# intermediates followed `material_depth` deep; the lowest of several recipes);
# otherwise its crafting station; otherwise `fallback_tier`. Names that match no
# prefab are ignored with a warning, so one map can serve several modpacks.
# `ecraft tiers` lists every item with its tier and why.
item_tiers:
  fallback_tier: 1
  material_depth: 3

  items:                       # no-recipe vanilla items (verify names in game)
    BeltStrength: 3
    HelmetDverger: 3
    FishingRod: 1
    Wishbone: 3

