    Tin: 2
    TinOre: 2
    Bronze: 2
    BronzeNails: 2
    TrollHide: 2
    GreydwarfEye: 2
    SurtlingCore: 2
    BoneFragments: 2
    AncientSeed: 2
    Thistle: 2
    Coal: 2
    CryptKey: 2                # verify
    # 3 swamp
    Iron: 3
    IronScrap: 3
    IronOre: 3                 # verify
    IronNails: 3
    Chain: 3
    ElderBark: 3
    Guck: 3
