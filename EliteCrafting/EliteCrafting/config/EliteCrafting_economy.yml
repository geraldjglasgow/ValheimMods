    Wood: 1
    Stone: 1
    Flint: 1
    Resin: 1
    LeatherScraps: 1
    DeerHide: 1
    Feathers: 1
    HardAntler: 1
    # 2 black_forest
    RoundLog: 2
    FineWood: 2
    Copper: 2
    CopperOre: 2
    CopperScrap: 2             # verify
    Tin: 2
    TinOre: 2
    Bronze: 2
