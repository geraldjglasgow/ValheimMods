    forge: 2
    piece_artisanstation: 5
    blackforge: 6
    piece_magetable: 6
  # station_levels:
  #   forge: { 1: 2, 3: 3, 5: 4, 7: 5 }

# Biome -> tier, for creatures and (later) chests that have no entry of their own.
biomes:
  meadows: 1
  black_forest: 2
  swamp: 3
  mountain: 4
  plains: 5
  mistlands: 6
  ashlands: 7
  ocean: 4                     # judgement call
  deep_north: 7                # reserved; clamped until tier 8 exists

# What creatures drop. The on/off switches are `Stone drops` and `Magic item drops`
# in com.EliteCrafting.cfg.
drops:
  tamed: false                 # tamed creatures drop our loot
  require_player: true         # a player (or a player's tamed creature) must have hit it
  max_stones_per_kill: 5
  max_gear_per_kill: 2
  star_multipliers: [1, 2, 3]  # by stars; index 0 = no stars
  star_step: 1                 # added per star beyond the list

  chances:                     # base chance per kill, by tier
    stone: [4, 5, 6, 7, 8, 9, 10]
    gear:  [1, 1.25, 1.5, 1.75, 2, 2.25, 2.5]

  stones:                      # which stone drops, by tier; a disabled stone never drops
    #                     T1   T2   T3   T4   T5   T6    T7
    awakening:          [400, 300, 220, 160, 120, 100,   80]
    ascension:          [  0, 120, 120, 110, 100,  90,   80]
    exaltation:         [  0,   0,   0,  60,  70,  70,   70]
    transcendence:      [  0,   0,   0,   0,   0,  30,   40]
    apotheosis:         [  0,   0,   0,   0,   0,   0,    1]
    growth_lesser:      [  0,  80,  90,  90,  80,  70,   60]
    growth_greater:     [  0,   0,   0,  20,  30,  40,   50]
    turmoil_lesser:     [150, 150, 140, 120, 100,  90,   80]
    turmoil_greater:    [  0,   0,   0,  30,  40,  50,   60]
    upheaval_lesser:    [  0,  40,  50,  50,  50,  45,   40]
    upheaval_greater:   [  0,   0,   0,  15,  20,  25,   30]
    perfection_lesser:  [  0,   0,  30,  40,  40,  40,   40]
    perfection_greater: [  0,   0,   0,   0,  10,  15,   20]
    severing_lesser:    [  0,  50,  60,  60,  55,  50,   45]
    severing_greater:   [  0,   0,   0,  15,  20,  25,   30]
    unmaking:           [ 30,  30,  30,  30,  30,  30,   30]
    serpent:            [  0,   0,  20,  25,  30,  35,   40]
    binding:            [  0,   0,   0,   0,   5,   8,   10]
    chance:             [ 80,  80,  70,  60,  50,  40,   30]
    reflection:         [  0,   0,   0,   0,   0, 0.02, 0.05]
    honing:             [ 60,  60,  60,  50,  50,  40,   40]
    tempering:          [ 60,  60,  60,  50,  50,  40,   40]
    sigil_preservation: [  0,   0,   0,  10,  12,  15,   18]
    sigil_war:          [  0,   0,  15,  20,  20,  20,   20]
    sigil_warding:      [  0,   0,  15,  20,  20,  20,   20]
    sigil_fortune:      [  0,   0,  15,  20,  20,  20,   20]
    sigil_culling:      [  0,   0,  10,  15,  18,  20,   22]
    # essences: home tier only (tide comes from serpents, see creatures)
    essence_storm_lesser:   [ 80,   0,   0,   0,   0,   0,    0]
    essence_storm_greater:  [ 20,   0,   0,   0,   0,   0,    0]
    essence_grove_lesser:   [  0,  80,   0,   0,   0,   0,    0]
    essence_grove_greater:  [  0,  20,   0,   0,   0,   0,    0]
    essence_venom_lesser:   [  0,   0,  80,   0,   0,   0,    0]
    essence_venom_greater:  [  0,   0,  20,   0,   0,   0,    0]
    essence_frost_lesser:   [  0,   0,   0,  80,   0,   0,    0]
    essence_frost_greater:  [  0,   0,   0,  20,   0,   0,    0]
    essence_battle_lesser:  [  0,   0,   0,   0,  80,   0,    0]
    essence_battle_greater: [  0,   0,   0,   0,  20,   0,    0]
    essence_seidr_lesser:   [  0,   0,   0,   0,   0,  80,    0]
    essence_seidr_greater:  [  0,   0,   0,   0,   0,  20,    0]
    essence_ember_lesser:   [  0,   0,   0,   0,   0,   0,   80]
    essence_ember_greater:  [  0,   0,   0,   0,   0,   0,   20]

  rarity_weights:              # the rarity of dropped gear, by tier
    #                    T1  T2  T3  T4  T5  T6  T7
    uncommon:           [ 80, 70, 60, 50, 45, 40, 35]
    rare:               [ 18, 24, 28, 32, 33, 34, 35]
    epic:               [  2,  5, 10, 14, 17, 20, 22]
    legendary:          [  0,  1,  2,  4,  5,  6,  8]
    mythic:             [  0,  0,  0,  0,  0,  0,  0]

  boss_rarity_weights:
    uncommon:           [ 40, 30, 20, 15, 10,  5,  0]
    rare:               [ 40, 42, 42, 40, 38, 35, 30]
    epic:               [ 17, 22, 30, 35, 40, 45, 50]
    legendary:          [  3,  6,  8, 10, 12, 15, 20]
    mythic:             [  0,  0,  0,  0,  0,  0,  0]

  gear:
    require_recipe: true       # only bases a player could craft
    tiers_below: 1             # bases this many tiers below the drop tier may drop too
    same_tier_weight: 3
    lower_tier_weight: 1
    slot_weights:
      melee_weapon: 1
      ranged_weapon: 1
      magic_weapon: 1
      shield: 1
      head: 1
      chest: 1
      legs: 1
      cape: 1
      utility_item: 1
      tool: 0.5
    exclude: []                # item prefabs that never drop
    include: {}                # item prefab -> tier, always in the pool at that tier

  bosses:
    Eikthyr:
      tier: 1
      stone_rolls: 2
      gear_rolls: 1
      bonus:
        - { stone: awakening, chance: 100, amount: 2 }
        - { stone: essence_storm_lesser, chance: 100, amount: 1 }
        - { stone: essence_storm_greater, chance: 15, amount: 1 }
    gd_king:
      tier: 2
      stone_rolls: 2
      gear_rolls: 1
      bonus:
        - { stone: ascension, chance: 100, amount: 1 }
        - { stone: essence_grove_lesser, chance: 100, amount: 1 }
        - { stone: essence_grove_greater, chance: 15, amount: 1 }
    Bonemass:
      tier: 3
      stone_rolls: 3
      gear_rolls: 1
      bonus:
        - { stone: serpent, chance: 50, amount: 1 }
        - { stone: essence_venom_lesser, chance: 100, amount: 1 }
        - { stone: essence_venom_greater, chance: 15, amount: 1 }
    Dragon:
      tier: 4
      stone_rolls: 3
      gear_rolls: 1
      bonus:
        - { stone: exaltation, chance: 100, amount: 1 }
        - { stone: essence_frost_lesser, chance: 100, amount: 1 }
        - { stone: essence_frost_greater, chance: 15, amount: 1 }
    GoblinKing:
      tier: 5
      stone_rolls: 4
      gear_rolls: 1
      bonus:
        - { stone: exaltation, chance: 100, amount: 1 }
        - { stone: binding, chance: 25, amount: 1 }
        - { stone: essence_battle_lesser, chance: 100, amount: 1 }
        - { stone: essence_battle_greater, chance: 15, amount: 1 }
    SeekerQueen:
      tier: 6
      stone_rolls: 4
      gear_rolls: 1
      bonus:
        - { stone: transcendence, chance: 100, amount: 1 }
        - { stone: essence_seidr_lesser, chance: 100, amount: 1 }
        - { stone: essence_seidr_greater, chance: 15, amount: 1 }
    Fader:                     # verify prefab name
      tier: 7
      stone_rolls: 5
      gear_rolls: 1
      bonus:
        - { stone: transcendence, chance: 100, amount: 1 }
        - { stone: apotheosis, chance: 10, amount: 1 }
        - { stone: essence_ember_lesser, chance: 100, amount: 1 }
        - { stone: essence_ember_greater, chance: 15, amount: 1 }

  creatures:
    # the Ocean has no tier of its own: tide essences come from serpents
    Serpent:        { bonus: [ { stone: essence_tide_lesser, chance: 25, amount: 1 }, { stone: essence_tide_greater, chance: 5, amount: 1 } ] }
    BonemawSerpent: { bonus: [ { stone: essence_tide_lesser, chance: 25, amount: 1 }, { stone: essence_tide_greater, chance: 5, amount: 1 } ] }   # verify name
  # more examples:
  #   Troll:   { stone_multiplier: 2 }                                  # trolls pay double stones
  #   Hen:     { multiplier: 0 }                                        # never drops our loot
  #   Wolf:    { tier: 4, bonus: [ { stone: serpent, chance: 20, amount: 1 } ] }

  # World containers the game fills with default loot (dungeon and ruin chests, buried treasure) roll once, when the
  # game fills them: chances in percent per container, the tier of the biome at the container (dungeons: the surface
  # biome), the same stone and rarity tables and per-kill caps as creatures. Player-built chests never roll; containers
  # generated before the mod was installed were filled then and do not roll.
  chests:
    stone_chance: 30
    gear_chance: 10

  # Elite Creatures Reborn (read only where ECR is installed; ecr-integration.md). With the .cfg switch
  # "9 - Elite Creatures Reborn / Synergy" on, ECR's elite stars replace the game level on their own table below.
  # The tier lists are indexed by ECR's world tier (0-7); ECR does not record one yet, so they do nothing until it does.
  # skip_worthless applies whenever ECR is installed, switch or not: its Cloven twin and Phantom husks drop nothing here.
  ecr:
    star_multipliers: [1, 1, 1.5, 2, 2.5, 3]   # by ECR stars; index 0 = no stars
    star_step: 0.5                             # added per star beyond the list
    star_rarity_bonus: 0                       # percent per ECR star on gear rarities above Uncommon
    tier_stone_multipliers: [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7]
    tier_rarity_bonus:      [0, 5, 10, 15, 20, 25, 30, 35]
    skip_worthless: true
