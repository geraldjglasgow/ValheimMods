    Eitr: 6
    Sap: 6
    Softtissue: 6
    BlackCore: 6
    Carapace: 6
    ScaleHide: 6
    Mandible: 6
    BlackMarble: 6
    YggdrasilWood: 6
    JuteBlue: 6
