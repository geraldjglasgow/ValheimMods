    DvergrNeedle: 6            # verify
    DvergrKeyFragment: 6       # verify
    # 7 ashlands
    FlametalNew: 7
    FlametalOreNew: 7
    Flametal: 7                # legacy name, verify
    FlametalOre: 7             # legacy name, verify
    CharredBone: 7
    AskHide: 7
