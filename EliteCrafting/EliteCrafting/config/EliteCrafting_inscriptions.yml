# EliteCrafting - inscriptions
#
# Every inscription the mod can roll. Written once, on first run, as a full copy of the
# built-in defaults; the mod never rewrites it. The built-in defaults stay underneath
# this file (set `use_defaults: false` to make the files the whole configuration), so
# an entry you delete here comes back from the defaults: turn an inscription off with
# `enabled: false` instead (existing copies go dormant), or stop it rolling with
# `weight: 0` (existing copies keep working).
#
# Extra files named EliteCrafting_inscriptions_<anything>.yml are read after this one, in
# file-name order. An entry there with an existing id changes only the fields it
# names; a new id adds an inscription. Lists (slots, tiers) are replaced whole.
#
# Fields: id, name, effect, param, value (percent | flat | flag), unit (ms | deg | m |
# min, flat only), slots, requires { skill, hands, traits }, category (offense |
# defense | utility), mythic_only, condition (none | health_critical),
# exclusion_group, weight (default 100), enabled, hook (easy | medium | hard),
# tiers [{ tier 1-7, min, max, weight (default 100) }]. A flag inscription lists only
# `tier` (and optionally `weight`) per row. Tiers count down, as in the tooltip:
# tier 1 is the strongest row, rolled on Ashlands items, and tier 7 the weakest,
# rolled on Meadows items. An item rolls the 3 tiers its own tier reaches
# (`rolling.tier_window` in the economy file): Ashlands 1-3 ... Meadows 7.
#
# Only inscriptions whose effect this build implements are listed; the rest of the catalog
# arrives with later releases. An inscription naming an unknown effect is an error.

# Health-critical: at or below this percent of maximum health the health_critical
# inscriptions apply. The threshold inscription raises it, never past max_threshold.
health_critical:
  threshold: 30
  max_threshold: 50

# Caps on the summed total of a channel across everything you wear. Keys: effect,
# effect:param, effect@health_critical, effect:param@health_critical. `null` removes a cap.
caps:
  health_recovery: 150
  stamina_recovery: 100
  eitr_recovery: 100
  move_speed: 25
  move_speed_sneak: 50
  jump_height: 50
  fall_damage_taken: 80
  run_stamina_cost: 60
  jump_stamina_cost: 60
  attack_stamina_cost: 60
  block_stamina_cost: 60
  dodge_stamina_cost: 60
  home_item_stamina_cost: 60
  skill_gain: 100
  attack_eitr_cost: 60
  draw_stamina_cost: 60
  reload_speed: 50
  pickup_radius: 100
  build_range: 100
  explore_radius: 100
  find_rarity: 200
  find_stones: 200
  find_trophy: 200
  find_coins: 200
  # Phase 2
  move_speed_sprint: 30
  move_speed_encumbered: 50
  move_speed_after_dodge: 40
  move_speed_paved: 30
  slope_penalty: 75
  terrain_slow: 75
  swimmer: 50
  noise_made: 75
  stealth: 75
  stagger_taken: 75
  hc_threshold: 20
  damage_taken: 60
  ranged_damage_taken: 60
  avoid_hit: 25
  knockback_taken: 75
  debuff_decay: 75
  frost_slow_taken: 100
  stagger_recovery: 75
  skill_loss: 75
  food_duration: 100
  rest_comfort: 3
  forsaken_cooldown: 50
  mead_cooldown: 50
  demist_radius: 100
  taming_speed: 100
  sail_speed: 50
  yield_pickable: 100
  attack_health_cost: 60
  draw_speed: 50
  ammo_save: 50
  perfect_block_window: 150

