# EliteCrafting - sockets, gems and catalysts (sockets.md): the stone names and descriptions, the messages of
# using them and the tooltip words. Key without the $ -> text. $1, $2, $3 are the game's placeholders.

ecf_stone_chisel: "Jeweller's Chisel"
ecf_stone_chisel_desc: "Cuts a socket into an item, up to two. Dropped gear can carry more."

ecf_stone_gem_storm: "Storm Gem"
ecf_stone_gem_storm_desc: "Set into a socket, it gives the item one Storm inscription, rolled for the item's own tier. Into a full item it breaks the oldest gem."
