# refusals: the stone is kept, the item unchanged
ecf_msg_sockets_full: "The $1 cannot cut another socket into this item."
ecf_msg_no_sockets: "This item has no socket. A Jeweller's Chisel cuts one."
ecf_msg_gem_no_fit: "The $1 has nothing to give this item."
ecf_msg_catalyst_no_match: "$1 has no $2 inscription for a catalyst to strengthen."
ecf_msg_catalyst_capped: "The $1 cannot strengthen this item further."

# feedback on success
ecf_msg_socket_added: "$1 gains a socket ($2 in all)."
ecf_msg_gem_set: "The $2 is set into $1."
ecf_msg_gem_replaced: "The $2 in $1 shatters; the $3 takes its place."
ecf_msg_catalysed: "$1's $2 inscriptions are strengthened to +$3%."
ecf_msg_catalyst_switched: "$1's old catalyst fades; its $2 inscriptions are now +$3%."

# tooltip and description words
ecf_ui_socket_gem: "$1: $2"
ecf_ui_socket_empty: "Empty socket"
ecf_ui_catalyst: "$1 catalyst +$2%"
ecf_ui_gem_header: "In a socket:"
