# EliteCrafting - sockets and gems (sockets.md): the Dvergr Chisel and the eleven gems, their refusals, feedback, the
# replace dialog and the tooltip lines. Key without the $ -> text. $1, $2, $3 are the game's placeholders, filled with
# already-localized words.

ecf_stone_dvergr_chisel: "Dvergr Chisel"
ecf_stone_dvergr_chisel_desc: "Cuts one socket into a weapon, staff, armour piece or shield that has none. Gems go into sockets."

ecf_stone_gem_surtr: "Surtr's Gem"
ecf_stone_gem_surtr_desc: "Set into a socket. Weapon: added fire damage. Staff: elemental damage. Armour or shield: less fire damage taken. Its tier is rolled for the item."
ecf_stone_gem_ymir: "Ymir's Gem"
ecf_stone_gem_ymir_desc: "Set into a socket. Weapon: added frost damage. Staff: lower eitr cost. Armour or shield: less frost damage taken. Its tier is rolled for the item."
ecf_stone_gem_thor: "Thor's Gem"
ecf_stone_gem_thor_desc: "Set into a socket. Weapon: added lightning damage. Staff: chain lightning. Armour or shield: less lightning damage taken. Its tier is rolled for the item."
ecf_stone_gem_nidhogg: "Nidhogg's Gem"
ecf_stone_gem_nidhogg_desc: "Set into a socket. Weapon: added poison damage. Staff: longer damage over time. Armour or shield: less poison damage taken. Its tier is rolled for the item."
ecf_stone_gem_hel: "Hel's Gem"
ecf_stone_gem_hel_desc: "Set into a socket. Weapon: added spirit damage. Staff: eitr on kill. Armour or shield: less spirit damage taken. Its tier is rolled for the item."
ecf_stone_gem_tyr: "Tyr's Gem"
ecf_stone_gem_tyr_desc: "Set into a socket. Weapon: more physical damage. Staff: stronger summons. Armour or shield: less stagger. Its tier is rolled for the item."
ecf_stone_gem_freyja: "Freyja's Gem"
ecf_stone_gem_freyja_desc: "Set into a socket. Weapon: life leech. Staff: lower health cost. Armour or shield: more health. Its tier is rolled for the item."
ecf_stone_gem_odin: "Odin's Gem"
ecf_stone_gem_odin_desc: "Set into a socket. Weapon: eitr leech. Staff: eitr regeneration. Armour or shield: more eitr. Its tier is rolled for the item."
ecf_stone_gem_skadi: "Skadi's Gem"
ecf_stone_gem_skadi_desc: "Set into a socket. Weapon: stamina leech. Staff: tougher summons. Armour or shield: more stamina. Its tier is rolled for the item."
ecf_stone_gem_heimdall: "Heimdall's Gem"
ecf_stone_gem_heimdall_desc: "Set into a socket. Weapon: critical hit chance. Staff: faster casting. Armour or shield: a chance to avoid hits. Its tier is rolled for the item."
ecf_stone_gem_sleipnir: "Sleipnir's Gem"
ecf_stone_gem_sleipnir_desc: "Set into a socket of armour or a shield: faster movement. It does not fit weapons or staves. Its tier is rolled for the item."

