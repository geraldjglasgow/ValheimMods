# EliteCrafting - the five runes' names and descriptions. Owned by the Stones area (the code's word for a rune); its
# refusal and feedback messages ($ecf_msg_...) are in English.stones_ui.yml.

ecf_stone_awakening: "Руна пробуждения"
ecf_stone_awakening_desc: "Пробуждает обычный предмет: он становится магическим и получает две случайные инскрипции."
ecf_stone_recasting: "Руна перековки"
ecf_stone_recasting_desc: "Перековывает магический предмет: обе старые инскрипции заменяются двумя новыми. Предмет остается магическим."
ecf_stone_ascension: "Руна возвышения"
ecf_stone_ascension_desc: "Делает магический предмет редким и добавляет ему третью инскрипцию."
ecf_stone_cleansing: "Руна очищения"
ecf_stone_cleansing_desc: "Полностью очищает магический или редкий предмет, возвращая его к обычному состоянию. Все инскрипции стираются. Это действие нельзя отменить."
ecf_stone_serpent: "Запечатанная руна"
ecf_stone_serpent_desc: "Искажает магический или редкий предмет, а затем навсегда запечатывает его: он либо сохраняет текущие свойства, либо получает еще одну инскрипцию (3-ю для магического, 4-ю для редкого), либо полностью перековывает все старые. После этого никакие руны больше на него не подействуют."

