# EliteCrafting - sockets and gems (sockets.md): the Dvergr Chisel and the eleven gems, their refusals, feedback, the
# replace dialog and the tooltip lines. Key without the $ -> text. $1, $2, $3 are the game's placeholders, filled with
# already-localized words.

ecf_stone_dvergr_chisel: "Долото двергов"
ecf_stone_dvergr_chisel_desc: "Прорубает от одного до трех гнезд в оружии, посохе, элементе брони, щите или рюкзаке, если их там еще нет. Два или три гнезда чаще появляются на редких предметах. В гнезда вставляются самоцветы."

ecf_stone_gem_surtr: "Самоцвет Сурта"
ecf_stone_gem_surtr_desc: "Вставляется в гнездо. Оружие: дополнительный урон огнем. Посох: стихийный урон. Броня, щит или рюкзак: меньше получаемого урона огнем. Ранг определяется при вставке в предмет."
ecf_stone_gem_ymir: "Самоцвет Имира"
ecf_stone_gem_ymir_desc: "Вставляется в гнездо. Оружие: дополнительный урон морозом. Посох: ниже стоимость эйтра. Броня, щит или рюкзак: меньше получаемого урона морозом. Ранг определяется при вставке в предмет."
ecf_stone_gem_thor: "Самоцвет Тора"
ecf_stone_gem_thor_desc: "Вставляется в гнездо. Оружие: дополнительный урон молнией. Посох: цепная молния. Броня, щит или рюкзак: меньше получаемого урона молнией. Ранг определяется при вставке в предмет."
ecf_stone_gem_nidhogg: "Самоцвет Нидхёгга"
ecf_stone_gem_nidhogg_desc: "Вставляется в гнездо. Оружие: дополнительный урон ядом. Посох: более длительный периодический урон. Броня, щит или рюкзак: меньше получаемого урона ядом. Ранг определяется при вставке в предмет."
ecf_stone_gem_hel: "Самоцвет Хель"
ecf_stone_gem_hel_desc: "Вставляется в гнездо. Оружие: дополнительный урон духом. Посох: эйтр за убийство. Броня, щит или рюкзак: меньше получаемого урона духом. Ранг определяется при вставке в предмет."
ecf_stone_gem_tyr: "Самоцвет Тюра"
ecf_stone_gem_tyr_desc: "Вставляется в гнездо. Оружие: больше физического урона. Посох: более сильные призываемые существа. Броня, щит или рюкзак: меньше получаемого ошеломления. Ранг определяется при вставке в предмет."
ecf_stone_gem_freyja: "Самоцвет Фрейи"
ecf_stone_gem_freyja_desc: "Вставляется в гнездо. Оружие: похищение здоровья. Посох: ниже стоимость здоровья. Броня, щит или рюкзак: больше здоровья. Ранг определяется при вставке в предмет."
ecf_stone_gem_odin: "Самоцвет Одина"
ecf_stone_gem_odin_desc: "Вставляется в гнездо. Оружие: похищение эйтра. Посох: регенерация эйтра. Броня, щит или рюкзак: больше эйтра. Ранг определяется при вставке в предмет."
ecf_stone_gem_skadi: "Самоцвет Скади"
ecf_stone_gem_skadi_desc: "Вставляется в гнездо. Оружие: похищение выносливости. Посох: более стойкие призываемые существа. Броня, щит или рюкзак: больше выносливости. Ранг определяется при вставке в предмет."
ecf_stone_gem_heimdall: "Самоцвет Хеймдалля"
ecf_stone_gem_heimdall_desc: "Вставляется в гнездо. Оружие: шанс критического удара. Посох: более быстрое сотворение заклинаний. Броня, щит или рюкзак: шанс уклониться от удара. Ранг определяется при вставке в предмет."
ecf_stone_gem_sleipnir: "Самоцвет Слейпнира"
ecf_stone_gem_sleipnir_desc: "Вставляется в гнездо брони, щита или рюкзака: повышает скорость перемещения. Не подходит для оружия или посохов. Ранг определяется при вставке в предмет."

