# EliteCrafting - words of using stones: refusals, feedback and the confirm dialog (stones.md sections 2-3,
# applying-stones.md, localization.md). Owned by the Stones area. Key without the $ -> text.
# $1, $2, $3 are the game's placeholders, filled with already-localized names.
# newer_format and unknown_rarity live in English.core.yml.

