# EliteCrafting - sockets and gems (sockets.md): the Dvergr Chisel and the eleven gems, their refusals, feedback, the
# replace dialog and the tooltip lines. Key without the $ -> text. $1, $2, $3 are the game's placeholders, filled with
# already-localized words.

ecf_stone_dvergr_chisel: "Formão Dvergr"
ecf_stone_dvergr_chisel_desc: "Abre de um a três soquetes em uma arma, cajado, peça de armadura, escudo ou mochila que não possua nenhum, ocorrendo dois ou três com mais frequência em itens Raros. As gemas entram nos soquetes."

ecf_stone_gem_surtr: "Gema de Surtr"
ecf_stone_gem_surtr_desc: "Colocada em um soquete. Arma: adiciona dano de fogo. Cajado: dano elemental. Armadura, escudo ou mochila: menos dano de fogo recebido. O tier dela é rolado para o item."
ecf_stone_gem_ymir: "Gema de Ymir"
ecf_stone_gem_ymir_desc: "Colocada em um soquete. Arma: adiciona dano de gelo. Cajado: menor custo de eitr. Armadura, escudo ou mochila: menos dano de gelo recebido. O tier dela é rolado para o item."
ecf_stone_gem_thor: "Gema de Thor"
ecf_stone_gem_thor_desc: "Colocada em um soquete. Arma: adiciona dano de raio. Cajado: raio em cadeia. Armadura, escudo ou mochila: menos dano de raio recebido. O tier dela é rolado para o item."
ecf_stone_gem_nidhogg: "Gema de Nidhogg"
ecf_stone_gem_nidhogg_desc: "Colocada em um soquete. Arma: adiciona dano de veneno. Cajado: maior duração de dano contínuo. Armadura, escudo ou mochila: menos dano de veneno recebido. O tier dela é rolado para o item."
ecf_stone_gem_hel: "Gema de Hel"
ecf_stone_gem_hel_desc: "Colocada em um soquete. Arma: adiciona dano espiritual. Cajado: eitr ao abater. Armadura, escudo ou mochila: menos dano espiritual recebido. O tier dela é rolado para o item."
ecf_stone_gem_tyr: "Gema de Tyr"
ecf_stone_gem_tyr_desc: "Colocada em um soquete. Arma: mais dano físico. Cajado: invocações mais fortes. Armadura, escudo ou mochila: menos atordoamento. O tier dela é rolado para o item."
ecf_stone_gem_freyja: "Gema de Freyja"
ecf_stone_gem_freyja_desc: "Colocada em um soquete. Arma: roubo de vida. Cajado: menor custo de vida. Armadura, escudo ou mochila: mais vida. O tier dela é rolado para o item."
ecf_stone_gem_odin: "Gema de Odin"
ecf_stone_gem_odin_desc: "Colocada em um soquete. Arma: roubo de eitr. Cajado: regeneração de eitr. Armadura, escudo ou mochila: mais eitr. O tier dela é rolado para o item."
ecf_stone_gem_skadi: "Gema de Skadi"
ecf_stone_gem_skadi_desc: "Colocada em um soquete. Arma: roubo de vigor. Cajado: invocações mais resistentes. Armadura, escudo ou mochila: mais vigor. O tier dela é rolado para o item."
ecf_stone_gem_heimdall: "Gema de Heimdall"
ecf_stone_gem_heimdall_desc: "Colocada em um soquete. Arma: chance de acerto crítico. Cajado: conjuração mais rápida. Armadura, escudo ou mochila: chance de evitar golpes. O tier dela é rolado para o item."
ecf_stone_gem_sleipnir: "Gema de Sleipnir"
ecf_stone_gem_sleipnir_desc: "Colocada em um soquete de armadura, escudo ou mochila: movimentação mais rápida. Não serve para armas ou cajados. O tier dela é rolado para o item."

