# EliteCrafting - the seven runes' names and descriptions. Owned by the Stones area (the code's word for a rune); its
# refusal and feedback messages ($ecf_msg_...) are in English.stones_ui.yml.

ecf_stone_awakening: "Awakening Rune"
ecf_stone_awakening_desc: "Awakens a Normal item: it becomes Magic and gains an inscription."
ecf_stone_shaping: "Shaping Rune"
ecf_stone_shaping_desc: "Adds a second inscription to a Magic item."
ecf_stone_recasting: "Recasting Rune"
ecf_stone_recasting_desc: "Recasts a Magic item: one or more of its inscriptions are rolled again. It never loses one and stays Magic."
ecf_stone_ascension: "Ascension Rune"
ecf_stone_ascension_desc: "Raises a Magic item to Rare, keeping its inscriptions and adding one more."
ecf_stone_consecrated: "Consecrated Rune"
ecf_stone_consecrated_desc: "Adds an inscription to a Rare item that has room for it (up to six)."
ecf_stone_cleansing: "Cleansing Rune"
ecf_stone_cleansing_desc: "Wipes a Magic or Rare item back to Normal. Every inscription is lost. Cannot be undone."
ecf_stone_serpent: "Serpent Rune"
ecf_stone_serpent_desc: "Corrupts a Magic or Rare item, then seals it for good: it stays as it is, gains an inscription past its limit, or has every inscription rerolled. No rune works on it again."
