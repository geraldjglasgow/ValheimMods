# EliteCrafting - the six runes' names and descriptions. Owned by the Stones area (the code's word for a rune); its
# refusal and feedback messages ($ecf_msg_...) are in English.stones_ui.yml.

ecf_stone_awakening: "Awakening Rune"
ecf_stone_awakening_desc: "Awakens a Normal item: it becomes Magic with two inscriptions."
ecf_stone_recasting: "Recasting Rune"
ecf_stone_recasting_desc: "Recasts a Magic item: both inscriptions are replaced by two new ones. It stays Magic."
ecf_stone_ascension: "Ascension Rune"
ecf_stone_ascension_desc: "Raises a Magic item to Rare, keeping its inscriptions and adding a third. At the Rune Table an essence chooses what the third one is."
ecf_stone_consecrated: "Consecrated Rune"
ecf_stone_consecrated_desc: "Consecrates a weapon, staff, armour piece or shield that has no sockets: it gains one to three. Three is very rare."
ecf_stone_cleansing: "Cleansing Rune"
ecf_stone_cleansing_desc: "Wipes a Magic or Rare item back to Normal. Every inscription is lost. Cannot be undone."
ecf_stone_serpent: "Serpent Rune"
ecf_stone_serpent_desc: "Corrupts a Magic or Rare item, then seals it for good: it stays as it is, gains one more inscription (a 3rd on Magic, a 4th on Rare), or has every inscription rerolled. No rune works on it again."
