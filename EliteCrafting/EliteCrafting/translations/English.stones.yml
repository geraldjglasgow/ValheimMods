# EliteCrafting - stone and sigil names and descriptions. Owned by the Stones area; its refusal and feedback
# messages ($ecf_msg_...) go in this file too.

ecf_stone_awakening: "Stone of Awakening"
ecf_stone_awakening_desc: "Awakens a Common item: it becomes Uncommon and gains an affix."
ecf_stone_ascension: "Stone of Ascension"
ecf_stone_ascension_desc: "Raises an Uncommon item to Rare, keeping its affixes and adding more."
ecf_stone_exaltation: "Stone of Exaltation"
ecf_stone_exaltation_desc: "Raises a Rare item to Epic, keeping its affixes and adding more."
ecf_stone_transcendence: "Stone of Transcendence"
ecf_stone_transcendence_desc: "Raises an Epic item to Legendary, keeping its affixes and adding more."
ecf_stone_apotheosis: "Stone of Apotheosis"
ecf_stone_apotheosis_desc: "Raises a Legendary item to Mythic, the highest rarity."

ecf_stone_growth_lesser: "Lesser Stone of Growth"
ecf_stone_growth_lesser_desc: "Adds one affix to an Uncommon or Rare item that has room for it."
ecf_stone_growth_greater: "Greater Stone of Growth"
ecf_stone_growth_greater_desc: "Adds one affix to an Epic, Legendary or Mythic item that has room for it."
ecf_stone_turmoil_lesser: "Lesser Stone of Turmoil"
ecf_stone_turmoil_lesser_desc: "Removes one random affix from an Uncommon or Rare item and rolls a new one."
ecf_stone_turmoil_greater: "Greater Stone of Turmoil"
ecf_stone_turmoil_greater_desc: "Removes one random affix from an Epic, Legendary or Mythic item and rolls a new one."
ecf_stone_upheaval_lesser: "Lesser Stone of Upheaval"
ecf_stone_upheaval_lesser_desc: "Rerolls every affix of an Uncommon or Rare item, keeping its rarity."
ecf_stone_upheaval_greater: "Greater Stone of Upheaval"
ecf_stone_upheaval_greater_desc: "Rerolls every affix of an Epic, Legendary or Mythic item, keeping its rarity."
ecf_stone_perfection_lesser: "Lesser Stone of Perfection"
ecf_stone_perfection_lesser_desc: "Rerolls the numbers of an Uncommon or Rare item's affixes, keeping the affixes."
ecf_stone_perfection_greater: "Greater Stone of Perfection"
ecf_stone_perfection_greater_desc: "Rerolls the numbers of an Epic, Legendary or Mythic item's affixes, keeping the affixes."
ecf_stone_severing_lesser: "Lesser Stone of Severing"
ecf_stone_severing_lesser_desc: "Removes one random affix from an Uncommon or Rare item."
ecf_stone_severing_greater: "Greater Stone of Severing"
ecf_stone_severing_greater_desc: "Removes one random affix from an Epic, Legendary or Mythic item."
ecf_stone_unmaking: "Stone of Unmaking"
ecf_stone_unmaking_desc: "Strips a magic item back to Common. Its honing or tempering stays. Cannot be undone."

ecf_stone_serpent: "Serpent Stone"
ecf_stone_serpent_desc: "Corrupts a magic item with an unpredictable outcome, then seals it: no stone works on it again."
ecf_stone_binding: "Stone of Binding"
ecf_stone_binding_desc: "Locks one random affix so that rerolls and removals pass it by."
ecf_stone_chance: "Stone of Chance"
ecf_stone_chance_desc: "Turns a Common item into a random rarity. The item is never destroyed."
ecf_stone_reflection: "Stone of Reflection"
ecf_stone_reflection_desc: "Makes a copy of a magic item, affixes and all. The copy is sealed."

ecf_stone_honing: "Honing Stone"
ecf_stone_honing_desc: "Hones a weapon: a little more damage with each use, up to a limit."
ecf_stone_tempering: "Tempering Stone"
ecf_stone_tempering_desc: "Tempers armor or a shield: a little more protection with each use, up to a limit."

ecf_stone_sigil_preservation: "Sigil of Preservation"
ecf_stone_sigil_preservation_desc: "The next reroll on this item leaves its strongest affix untouched."
ecf_stone_sigil_war: "Sigil of War"
ecf_stone_sigil_war_desc: "The next affix added to this item is an offense affix."
ecf_stone_sigil_warding: "Sigil of Warding"
ecf_stone_sigil_warding_desc: "The next affix added to this item is a defense affix."
ecf_stone_sigil_fortune: "Sigil of Fortune"
ecf_stone_sigil_fortune_desc: "The next affix added to this item is a utility affix."
ecf_stone_sigil_culling: "Sigil of Culling"
ecf_stone_sigil_culling_desc: "The next removal on this item takes its weakest affix instead of a random one."
