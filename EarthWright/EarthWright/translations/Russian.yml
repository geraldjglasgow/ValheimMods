# EarthWright - Официальные строки перевода
# Все переменные ($1, $2), кавычки и управляющие символы (\n, \") строго сохранены.

# Меню мотыги и культиватора: новые пункты EarthWright
ew_menu_lower: "Опустить землю"
ew_menu_lower_desc: "Опускает землю внутри области кисти на заданную величину. Повторные взмахи копают вниз вплоть до лимита раскопок."
ew_menu_smooth: "Сглаживание рельефа"
ew_menu_smooth_desc: "Выравнивает бугры и хребты внутри кисти, не сглаживая при этом общий склон. Сила определяет, насколько сильно сглаживает каждый взмах."
ew_menu_paint: "Покраска поверхности"
ew_menu_paint_desc: "Окрашивает землю внутри кисти без изменения её высоты. Клавиша покраски выбирает текстуру: грязь, мощение, вспаханная земля, трава, ландшафт или растительность текущего биома."
ew_menu_reset: "Сброс рельефа"
ew_menu_reset_desc: "Возвращает землю внутри кисти к её первоначальной мировой высоте и текстуре. Постройки, деревья и камни остаются нетронутыми."
ew_menu_ramp: "Пандус"
ew_menu_ramp_desc: "Строит пандус: кликните в начале, кликните в конце, а затем кликните в третий раз, чтобы срезать или насыпать землю. Ширина пандуса равна размеру кисти."
ew_menu_road: "Дорога"
ew_menu_road_desc: "Проектирует дорогу: каждый клик устанавливает путевую точку, а клавиша создания прокладывает плавную дорогу через них шириной с кисть. Линия окрашивается в зависимости от того, насколько она крутая для тележек."
ew_menu_groundbreaker: "Первопроходец"
ew_menu_groundbreaker_desc: "Один взмах делает всё: расчищает деревья, камни и кусты внутри кисти (пока включена расчистка), выравнивает землю до целевой высоты и вымащивает её."
ew_menu_clear: "Расчистка объектов"
ew_menu_clear_desc: "Удаляет деревья, пни, бревна, кусты, камни и подбираемые ресурсы внутри кисти. Земля под защитой оберегов не затрагивается."
ew_menu_terraform: "Терраформирование (админ)"
ew_menu_terraform_desc: "Только для администраторов: устанавливает все точки внутри кисти на целевую высоту за один взмах, игнорируя лимиты высоты, если это разрешено сервером."
ew_menu_till: "Вспашка"
ew_menu_till_desc: "Вспахивает землю внутри кисти под грядки без изменения её высоты."
ew_menu_uproot: "Прополка дикоросов"
ew_menu_uproot_desc: "Вырывает дикорастущие подбираемые ресурсы внутри кисти: ягодные кусты, грибы, цветы, чертополох и тому подобное."

# Меню мотыги и культиватора: ванильные пункты игры, измененные модом EarthWright
ew_menu_game_mud_road_v2_desc: "Выравнивает землю внутри кисти до целевой высоты: под вашими ногами, в точке прицеливания (при удержании Shift), либо на зафиксированную или точную высоту. Стиль выравнивания определяет силу каждого взмаха."
ew_menu_game_raise_v2_desc: "Поднимает землю внутри кисти на заданную величину. Повторные взмахи увеличивают высоту вплоть до лимита насыпи."
ew_menu_game_path_v2_desc: "Протаптывает грунтовую тропинку внутри кисти без изменения высоты рельефа."
ew_menu_game_paved_road_v2_desc: "Выравнивает землю внутри кисти до целевой высоты и вымащивает её камнем."
ew_menu_game_paved_road_v2_flat_desc: "Вымащивает землю камнем внутри кисти без изменения её текущей высоты."
ew_menu_game_cultivate_v2_desc: "Выравнивает землю внутри кисти и вспахивает её под грядки."
ew_menu_game_cultivate_v2_flat_desc: "Вспахивает землю внутри кисти под грядки без изменения её текущей высоты."
ew_menu_game_replant_v2_desc: "Возвращает зелёную траву в области кисти: удаляет грязь, мощение и вспаханную почву."

