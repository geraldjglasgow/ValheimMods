# EarthWright - English words
#
# To translate: copy this file as EarthWright.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the mod), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it).

# hoe and cultivator menu: EarthWright's entries
ew_menu_lower: "Lower ground"
ew_menu_lower_desc: "Lowers the ground inside the brush by the set amount. Repeated swings dig down to the dig limit."
ew_menu_smooth: "Smooth ground"
ew_menu_smooth_desc: "Evens out bumps and ridges inside the brush without flattening the slope. The strength sets how much each swing smooths."
ew_menu_paint: "Paint ground"
ew_menu_paint_desc: "Paints the ground inside the brush without changing its height. The paint key picks the paint: dirt, paved, tilled, grass, the biome's own ground or vegetation."
ew_menu_reset: "Reset ground"
ew_menu_reset_desc: "Returns the ground inside the brush to the world's original height and texture. Buildings, trees and rocks are left alone."
ew_menu_ramp: "Ramp"
ew_menu_ramp_desc: "Builds a ramp: click the start, click the end, then click a third time to cut or fill it. The ramp is as wide as the brush."
ew_menu_road: "Road"
ew_menu_road_desc: "Plans a road: each click places a waypoint, and the carve key cuts a smooth road through them, as wide as the brush. The line is coloured by how steep it is for carts."
ew_menu_groundbreaker: "Groundbreaker"
ew_menu_groundbreaker_desc: "One swing does it all: clears trees, rocks and shrubs inside the brush (while clearing is switched on), levels the ground toward the target height and paves it."
ew_menu_clear: "Clear objects"
ew_menu_clear_desc: "Removes trees, stumps, logs, shrubs, rocks and pickables inside the brush. Warded ground is left alone."
ew_menu_terraform: "Terraform (admin)"
ew_menu_terraform_desc: "Admins only: sets every point inside the brush to the target height in one swing, past the height limits when the server allows it."
ew_menu_till: "Till"
ew_menu_till_desc: "Tills the ground inside the brush for planting without changing its height."
ew_menu_uproot: "Uproot"
ew_menu_uproot_desc: "Pulls up natural pickables inside the brush: berry bushes, mushrooms, flowers, thistle and the like."

# hoe and cultivator menu: the game's own entries as EarthWright changes them
ew_menu_game_mud_road_v2_desc: "Levels the ground inside the brush toward the target height: your feet, the aimed point while Shift is held, or a locked or exact height. The level style decides how far each swing goes."
ew_menu_game_raise_v2_desc: "Raises the ground inside the brush by the set amount. Repeated swings add up to the raise limit."
ew_menu_game_path_v2_desc: "Paints a dirt path inside the brush without changing the height."
ew_menu_game_paved_road_v2_desc: "Levels the ground inside the brush toward the target height and paves it."
ew_menu_game_paved_road_v2_flat_desc: "Paves the ground inside the brush without changing its height."
ew_menu_game_cultivate_v2_desc: "Evens out the ground inside the brush and tills it for planting."
ew_menu_game_cultivate_v2_flat_desc: "Tills the ground inside the brush for planting without changing its height."
ew_menu_game_replant_v2_desc: "Brings the grass back inside the brush: removes dirt, paving and tilled soil."

