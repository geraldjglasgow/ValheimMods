# EliteBuildingPieces - English words
#
# To translate: copy this file as EliteBuildingPieces.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the mod), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it).

# Core wood walls (the hammer's Building tab: name, then description)
ebp_corewood_wall: "Core wood wall"
ebp_corewood_wall_desc: "Core wood logs laid between two posts. Snaps like the stakewall."
ebp_corewood_wall_large: "Large core wood wall"
ebp_corewood_wall_large_desc: "A core wood wall twice as wide, in one piece."

# Core wood doors (the hammer, and the door's hover text)
ebp_corewood_door: "Core wood door"
ebp_corewood_door_desc: "A core wood gate the width of a core wood wall. Opens away from you."
ebp_corewood_door_double: "Core wood double door"
ebp_corewood_door_double_desc: "Two core wood gates that open together, the width of a large core wood wall."
