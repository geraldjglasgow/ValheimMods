# Publish settings for tcli. No secrets here: the token comes from TCLI_AUTH_TOKEN or --token.
#   tcli publish --config-path HighSeatPlus/thunderstore/thunderstore.toml --file HighSeatPlus/thunderstore/HighSeatPlus-X.Y.Z.zip
[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MilkyTeam"
name = "HighSeatPlus"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "utility", "client-side"]
