# Publish settings for tcli. No secrets here: the token comes from TCLI_AUTH_TOKEN or --token.
#   tcli publish --config-path FeastMaster/thunderstore/thunderstore.toml --file FeastMaster/thunderstore/FeastMaster-X.Y.Z.zip
[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MilkyTeam"
name = "FeastMaster"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "utility", "client-side", "server-side"]
