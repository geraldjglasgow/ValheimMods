# Щиты (Shields)
ee_buckler_wood: "Деревянный баклер"
ee_buckler_wood_desc: "Небольшой деревянный баклер, обтянутый сыромятной кожей. Блокирует меньше круглого щита, но парирует куда эффективнее."
ee_shield_bronze: "Бронзовый щит"
ee_shield_bronze_desc: "Круглый щит из досок в бронзовой оправе с бронзовым умбоном в центре. Гораздо прочнее деревянного."
ee_buckler_silver: "Серебряный баклер"
ee_buckler_silver_desc: "Качественная древесина в серебряной оправе с серебряной головой волка в самом сердце. Блокирует меньше щита, но парирует куда эффективнее."
ee_tower_silver: "Серебряный ростовой щит"
ee_tower_silver_desc: "Высокий щит из качественного дерева в серебряном каркасе, увенчанный серебряной головой волка. Тяжелый, но останавливает практически любую атаку."
ee_buckler_blackmetal: "Баклер из черного металла"
ee_buckler_blackmetal_desc: "Баклер из черного металла на прочной цепи. Блокирует меньше обычного щита, но парирует куда эффективнее."
ee_tower_carapace: "Панцирный ростовой щит"
ee_tower_carapace_desc: "Высокий каплевидный щит из перекрывающих друг друга панцирных пластин жуков. Сильно замедляет, но останавливает абсолютно всё."
ee_buckler_flametal: "Баклер из горючего металла"
ee_buckler_flametal_desc: "Баклер из горючего металла поверх черного дерева, всё ещё хранящий тепло кузнечного горна. Блокирует меньше щита, но парирует куда эффективнее."

