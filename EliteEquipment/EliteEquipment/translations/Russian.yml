# Еда на Эйтр: Луга и Черный Лес (The eitr foods of the Meadows and Black Forest)
ee_food_dandelionmash: "Пюре из одуванчиков"
ee_food_dandelionmash_desc: "Листья и цветы одуванчика, перетертые с медом и грибами. Почти не насыщает желудок, но дает чистый эйтр для жезла."
ee_food_candiedthistle: "Засахаренный чертополох"
ee_food_candiedthistle_desc: "Бутоны чертополоха, глазированные в меду. Сладкое лакомство для дороги, дающее всего понемногу."
ee_food_glowcapbroth: "Отвар из светящихся грибов"
ee_food_glowcapbroth_desc: "Желтые грибы, томленные с чертополохом и морковью, пока отвар не начнет слабо светиться. Провидцы пьют его перед долгой ночью."
ee_food_seersporridge: "Каша провидца"
ee_food_seersporridge_desc: "Густая черничная каша с добавлением чертополоха и капли меда. Сохраняет разум ясным долгими часами."

# Еда на Эйтр: Болота (The eitr foods of the Swamp)
ee_food_turnipcrisps: "Репяные чипсы"
ee_food_turnipcrisps_desc: "Тонкие ломтики репы, обжаренные до хруста, украшенные веточкой чертополоха. Отличный перекус для топких болотных дорог."
ee_food_blooddraught: "Кровавое зелье"
ee_food_blooddraught_desc: "Густой багровый напиток из туши сыти, чертополоха и репы. На вкус отдает железом и заставляет эйтр бурлить в венах."
ee_food_mirestew: "Трясинное рагу"
ee_food_mirestew_desc: "Мутное варево из репы, туши сыти и желтых грибов. Выглядит в точности как болото, но работает как по волшебству."

# Еда на Эйтр: Горы (The eitr foods of the Mountains)
ee_food_glaciertea: "Ледниковый чай"
ee_food_glaciertea_desc: "Лук и мед, настоянные на морозной железе, со льдом по краям кружки. Освежает голову на крутых высокогорных склонах."
ee_food_wolfheartstew: "Рагу из волчьего сердца"
ee_food_wolfheartstew_desc: "Волчье мясо и лук, тушенные с добавлением морозных желез. Настоящая пища охотника, зажигающая ледяной огонь в глазах."

# Еда на Эйтр: Равнины (The eitr foods of the Plains)
ee_food_candiedcloudberries: "Засахаренная морошка"
ee_food_candiedcloudberries_desc: "Спелая морошка, глазированная в янтарном меду. Сладкая пригоршня всеобъемлющей силы."
ee_food_loxmarrowbroth: "Бульон из костного мозга локса"
ee_food_loxmarrowbroth_desc: "Наваристый нежный бульон, сваренный на кости локса с добавлением ячменя и ягод морошки."
ee_food_sunbarleyporridge: "Ячменная солнечная каша"
ee_food_sunbarleyporridge_desc: "Золотистая ячменная каша с морошкой и медом. Лучший завтрак для провидца под открытым небом Равнин."
