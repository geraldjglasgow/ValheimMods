# Одежда Провидца: Луга (The Seer's robes of the Meadows)
ee_seer_meadows_set: "Одеяния из оленьей кожи"
ee_seer_meadows_set_tip: "«Исцеление» расходует на 25% меньше эйтра."
ee_seer_meadows_hood: "Капюшон из оленьей кожи"
ee_seer_meadows_hood_desc: "Глубокий капюшон провидца из мягкой оленьей кожи, спадающий на плечи."
ee_seer_meadows_robe: "Роба из оленьей кожи"
ee_seer_meadows_robe_desc: "Длинное платье провидца из оленьей кожи с разрезами для удобства шага и вышитыми рунами по подолу."
ee_seer_meadows_trousers: "Штаны из оленьей кожи"
ee_seer_meadows_trousers_desc: "Штаны из оленьей кожи, переходящие в обмотки для ног."
ee_boots_seermeadows: "Обмотки из оленьей кожи"

# Одежда Провидца: Черный Лес (The Seer's robes of the Black Forest)
ee_seer_blackforest_set: "Мховое ткачество"
ee_seer_blackforest_set_tip: "Магические напевы длятся на 50% дольше."
ee_seer_blackforest_hood: "Мховый венец"
ee_seer_blackforest_hood_desc: "Узловатые ветви на ленте из коры, увешанные мхом, с глазом грейдворфа у лба."
ee_seer_blackforest_robe: "Мховая роба"
ee_seer_blackforest_robe_desc: "Роба из серой шкуры тролля под мантией из живого мха. На каждом листке подола вышиты руны чертополоха."
ee_seer_blackforest_trousers: "Мховые штаны"
ee_seer_blackforest_trousers_desc: "Штаны из шкуры тролля, переходящие в обмотки для ног."
ee_boots_seerblackforest: "Мховые обмотки для ног"

# Одежда Провидца: Болота (The Seer's robes of the Swamp)
ee_seer_swamp_set: "Ткачество из корней"
ee_seer_swamp_set_tip: "Сопротивление яду."
ee_seer_swamp_hood: "Шляпа из корней"
ee_seer_swamp_hood_desc: "Остроконечная ведьминская шляпа, сплетенная из древесной коры и болотных корней, с кроваво-красным шнуром на тулье."
ee_seer_swamp_robe: "Туника из корней"
ee_seer_swamp_robe_desc: "Древесная туника до колен, плечи которой защищены пластинами древней коры и подпоясаны переплетенными корнями."
ee_seer_swamp_trousers: "Штаны из корней"
ee_seer_swamp_trousers_desc: "Штаны, обвитые корнями и переходящие в обмотки для ног."
ee_boots_seerswamp: "Обмотки из корней"

# Одежда Провидца: Горы (The Seer's robes of the Mountains)
ee_seer_mountains_set: "Волчья шерсть"
ee_seer_mountains_set_tip: "Сопротивление морозу."
ee_seer_mountains_hood: "Шапка из волчьей шерсти"
ee_seer_mountains_hood_desc: "Высокая остроконечная шляпа волшебника из серого войлока, широкие поля оторочены волчьим мехом, на тулье серебряные руны."
ee_seer_mountains_robe: "Пальто из волчьей шерсти"
ee_seer_mountains_robe_desc: "Тяжелое шерстяное пальто с широким воротником из волчьей шкуры, серебряными застежками и амулетами из клыков."
ee_seer_mountains_trousers: "Штаны из волчьей шерсти"
ee_seer_mountains_trousers_desc: "Темные шерстяные штаны и сапоги с меховой оторочкой."
ee_boots_seermountains: "Сапоги из волчьей шерсти"

# Одежда Провидца: Равнины (The Seer's robes of the Plains)
ee_seer_plains_set: "Солнечное ткачество"
ee_seer_plains_set_tip: "Ваше исцеление также восстанавливает 10 единиц выносливости цели."
ee_seer_plains_hood: "Шляпа солнечного ткачества"
ee_seer_plains_hood_desc: "Широкополая льняная шляпа с солнечно-золотой лентой и диском солнца из черного металла."
ee_seer_plains_robe: "Роба солнечного ткачества"
ee_seer_plains_robe_desc: "Многослойные льняные одежды с солнечно-золотой каймой и шкурой локса на одном плече."
ee_seer_plains_trousers: "Штаны солнечного ткачества"
ee_seer_plains_trousers_desc: "Штаны из кожи локса и сапоги с меховой оторочкой."
ee_boots_seerplains: "Сапоги солнечного ткачества"

# Одежда Провидца: Туманные земли (The Seer's robes of the Mistlands)
ee_seer_mistlands_set: "Туманное ткачество"
ee_seer_mistlands_set_tip: "Магия крови +15."
ee_seer_mistlands_hood: "Обруч туманного ткачества"
ee_seer_mistlands_hood_desc: "Низкий обруч из хитиновых пластин со светящимся камнем эйтра в центре."
ee_seer_mistlands_robe: "Роба туманного ткачества"
ee_seer_mistlands_robe_desc: "Окрашенная туманом роба с воротником-веером, наплечниками из панциря жуков и латным поясом."
ee_seer_mistlands_trousers: "Штаны туманного ткачества"
ee_seer_mistlands_trousers_desc: "Штаны цвета индиго и сапоги с хитиновыми носками."
ee_boots_seermistlands: "Сапоги туманного ткачества"

# Одежда Провидца: Пепельные земли (The Seer's robes of the Ashlands)
ee_seer_ashlands_set: "Угольное ткачество"
ee_seer_ashlands_set_tip: "Сопротивление огню, Магия крови +20."
ee_seer_ashlands_hood: "Шляпа угольного ткачества"
ee_seer_ashlands_hood_desc: "Высокая шляпа волшебника из обугленной кожи асксвина, закрученная вверх, как язык пламени; поля вырезаны языками огня, на тулье лента из горючего металла с выжженными рунами."
ee_seer_ashlands_robe: "Роба угольного ткачества"
ee_seer_ashlands_robe_desc: "Роба в пол из чешуйчатой кожи асксвина, чёрная и кроваво-красная, под шипастым воротником."
ee_seer_ashlands_trousers: "Штаны угольного ткачества"
ee_seer_ashlands_trousers_desc: "Чешуйчатые поножи и кованые сапоги из горючего металла."
ee_boots_seerashlands: "Сапоги угольного ткачества"

# Одежда Провидца: Глубокий Север (The Seer's robes of the Deep North)
ee_seer_deepnorth_set: "Инеевая позолота"
ee_seer_deepnorth_set_tip: "Сопротивление морозу, Магия крови +25."
ee_seer_deepnorth_hood: "Шляпа инеевой позолоты"
ee_seer_deepnorth_hood_desc: "Высокая кобальтовая шляпа волшебника, загнутая назад кривым острием; широкие поля сверху белые как иней, снизу кобальтовые, перламутровая лента и ромб с самоцветом, по тулье серебряные руны."
ee_seer_deepnorth_robe: "Роба инеевой позолоты"
ee_seer_deepnorth_robe_desc: "Белая как иней роба до пят с кобальтовыми вставками по бокам, под перламутровым нагрудником и наплечниками, со сливовыми кожаными ремнями и поясом и табардом из серебряных звеньев."
ee_seer_deepnorth_trousers: "Штаны инеевой позолоты"
ee_seer_deepnorth_trousers_desc: "Светлые штаны с кобальтовыми лампасами и сливовые кожаные сапоги с перламутровыми отворотами и носками."
ee_boots_seerdeepnorth: "Сапоги инеевой позолоты"

# Еда на Эйтр: Луга и Черный Лес (The eitr foods of the Meadows and Black Forest)
ee_food_dandelionmash: "Пюре из одуванчиков"
ee_food_dandelionmash_desc: "Листья и цветы одуванчика, перетертые с медом и грибами. Почти не насыщает желудок, но дает чистый эйтр для жезла."
ee_food_candiedthistle: "Засахаренный чертополох"
ee_food_candiedthistle_desc: "Бутоны чертополоха, глазированные в меду. Сладкое лакомство для дороги, дающее всего понемногу."
ee_food_glowcapbroth: "Отвар из светящихся грибов"
ee_food_glowcapbroth_desc: "Желтые грибы, томленные с чертополохом и морковью, пока отвар не начнет слабо светиться. Провидцы пьют его перед долгой ночью."
ee_food_seersporridge: "Каша провидца"
ee_food_seersporridge_desc: "Густая черничная каша с добавлением чертополоха и капли меда. Сохраняет разум ясным долгими часами."

# Еда на Эйтр: Болота (The eitr foods of the Swamp)
ee_food_turnipcrisps: "Репяные чипсы"
ee_food_turnipcrisps_desc: "Тонкие ломтики репы, обжаренные до хруста, украшенные веточкой чертополоха. Отличный перекус для топких болотных дорог."
ee_food_blooddraught: "Кровавое зелье"
ee_food_blooddraught_desc: "Густой багровый напиток из туши сыти, чертополоха и репы. На вкус отдает железом и заставляет эйтр бурлить в венах."
ee_food_mirestew: "Трясинное рагу"
ee_food_mirestew_desc: "Мутное варево из репы, туши сыти и желтых грибов. Выглядит в точности как болото, но работает как по волшебству."

# Еда на Эйтр: Горы (The eitr foods of the Mountains)
ee_food_glaciertea: "Ледниковый чай"
ee_food_glaciertea_desc: "Лук и мед, настоянные на морозной железе, со льдом по краям кружки. Освежает голову на крутых высокогорных склонах."
ee_food_wolfheartstew: "Рагу из волчьего сердца"
ee_food_wolfheartstew_desc: "Волчье мясо и лук, тушенные с добавлением морозных желез. Настоящая пища охотника, зажигающая ледяной огонь в глазах."

# Еда на Эйтр: Равнины (The eitr foods of the Plains)
ee_food_candiedcloudberries: "Засахаренная морошка"
ee_food_candiedcloudberries_desc: "Спелая морошка, глазированная в янтарном меду. Сладкая пригоршня всеобъемлющей силы."
ee_food_loxmarrowbroth: "Бульон из костного мозга локса"
ee_food_loxmarrowbroth_desc: "Наваристый нежный бульон, сваренный на кости локса с добавлением ячменя и ягод морошки."
ee_food_sunbarleyporridge: "Ячменная солнечная каша"
ee_food_sunbarleyporridge_desc: "Золотистая ячменная каша с морошкой и медом. Лучший завтрак для провидца под открытым небом Равнин."