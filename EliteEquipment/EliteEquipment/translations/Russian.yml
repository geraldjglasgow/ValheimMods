# Заклинатели: жезлы и амулеты (Casters)
ee_wand_meadows: "Сучковатый жезл"
ee_wand_meadows_desc: "Изогнутая ветвь с каплей янтарной смолы. Нажатие ЛКМ выпускает малый сгусток духа за счет эйтра (удерживайте для зарядки, вплоть до +30% к урону на 3-й секунде); удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на кольце; коротко нажмите ПКМ, чтобы снова сотворить последнее. Заклинатель не умеет блокировать: удержание ПКМ вместе с прыжком совершает мгновенное мерцание (блинк)."
ee_wand_blackforest: "Жезл из серого дерева"
ee_wand_blackforest_desc: "Качественная древесина в бронзовой оправе, увенчанная запертым в клетке глазом грейдворфа. Нажатие ЛКМ швыряет камень за эйтр: короткое нажатие — один камень, удержание — камень крупнее, который летит прямо и в пяти метрах раскалывается на кучный град камней, летящих дальше, до пятнадцати при полном заряде; удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на кольце; коротко нажмите ПКМ, чтобы снова сотворить последнее."
ee_wand_swamp: "Жезл, оплетённый корнями"
ee_wand_swamp_desc: "Древняя кора, оплетённая корнями и окованная железом, с болотным камнем в корневой хватке. Нажатие ЛКМ поднимает из земли корни там, куда вы целитесь, как это делает Древний, за эйтр: короткое нажатие — один корень, удержание — больше, до пяти при полном заряде; удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на кольце; коротко нажмите ПКМ, чтобы снова сотворить последнее."
ee_wand_mountains: "Жезл морозного серебра"
ee_wand_mountains_desc: "Светлая качественная древесина в серебряной оправе, в серебряном венце — замёрзшая морозная железа. Нажатие ЛКМ выпускает ледяные осколки за эйтр, каждый замедляет цель: короткое нажатие — один осколок, удержание — больше, до пяти веером при полном заряде; удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на кольце; коротко нажмите ПКМ, чтобы снова сотворить последнее."
ee_wand_plains: "Жезл из чёрного металла"
ee_wand_plains_desc: "Тонкий стержень из чёрного металла с рукоятью из качественной древесины, на навершии — солнце из игл смертокомара вокруг золотого ядра. Нажатие ЛКМ выпускает сгусток духа за эйтр (удерживайте для зарядки); удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на круговом меню; короткое нажатие ПКМ повторяет последнее."
ee_wand_mistlands: "Жезл Иггдрасиля"
ee_wand_mistlands_desc: "Две пряди древесины Иггдрасиля, свитые вместе, на навершии — кристалл очищенного эйтра в чаше из коры, на рукояти — капля маточного молочка. Пока жезл в руке, эйтр восстанавливается быстрее. Нажатие ЛКМ выпускает сгусток духа за эйтр (удерживайте для зарядки); удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на круговом меню; короткое нажатие ПКМ повторяет последнее."
ee_wand_ashlands: "Пепельный жезл"
ee_wand_ashlands_desc: "Жезл из чёрного дерева Пепельных земель, окованный пламенным металлом, у навершия — небесные перья. Пока жезл в руке, эйтр восстанавливается быстрее. Нажатие ЛКМ выпускает огненную стрелу за эйтр, поджигающую цель: короткое нажатие — малую, удерживайте для зарядки — побольше, а при полном заряде она взрывается там, куда попала; удерживайте ПКМ, чтобы выбрать заклинание из книги заклинаний на круговом меню; короткое нажатие ПКМ повторяет последнее."
ee_book_meadows: "Книга заклинаний в кожаном переплёте"
ee_book_meadows_desc: "Оленья кожа, натянутая на дощечки, страницы подшиты жилами. В левой руке рядом с жезлом хранит страницы заклинаний, которые жезл может творить (2), ускоряет восполнение эйтра (+10%) и усиливает исцеляющую силу жезла (+3). Используйте страницу заклинания, держа книгу, чтобы вложить её."
ee_book_swamp: "Гримуар в переплёте из коры"
ee_book_swamp_desc: "Древняя кора на дощечках, стянутых железными застёжками, страницы прошиты волокнами корней. В левой руке рядом с жезлом хранит страницы заклинаний, которые жезл может творить (4), ускоряет восполнение эйтра (+15%) и усиливает исцеляющую силу жезла (+6). Используйте страницу заклинания, держа книгу, чтобы вложить её."
ee_book_ashlands: "Пепельный фолиант"
ee_book_ashlands_desc: "Шкура асксвина на корешке из пламенного металла, застёжки из обугленной кости ещё хранят тепло. В левой руке рядом с жезлом хранит страницы заклинаний, которые жезл может творить (8), ускоряет восполнение эйтра (+25%) и усиливает исцеляющую силу жезла (+12). Используйте страницу заклинания, держа книгу, чтобы вложить её."

