# Заклинания (Spells)
ee_spell_mend: "Исцеление"
ee_spell_mend_desc: "Исцеляет союзника, на которого вы навели прицел в радиусе 30 м (золотой маркер покажет цель). Если союзников рядом нет, исцеляет вас в соответствии с силой исцеления жезла."
ee_spell_hearthsong: "Песнь очага"
ee_spell_hearthsong_desc: "Магический напев: все союзники в радиусе 10 метров и вы сами восстанавливаете здоровье на 50% быстрее в течение 60 секунд."
ee_spell_swiftness: "Оленья резвость"
ee_spell_swiftness_desc: "Магический напев: все союзники в радиусе 10 метров и вы сами двигаетесь на 10% быстрее и тратите на 20% меньше выносливости на бег в течение 60 секунд."
ee_spell_volley: "Залп Древнего"
ee_spell_volley_desc: "Удар: шесть семян Древнего быстро вылетают из кончика жезла туда, куда вы целитесь, по одному каждую десятую долю секунды; каждое наносит 60% урона снаряда жезла тех же типов. Поражает только врагов."
ee_spell_breath: "Дыхание Модер"
ee_spell_breath_desc: "Удар: морозное дыхание Модер вырывается из кончика жезла туда, куда вы целитесь, примерно на 7 м, шестью порывами за полсекунды; каждый наносит половину урона снаряда жезла морозом и духом. Мороз замедляет. Поражает только врагов."
ee_spell_cleanse: "Очищение"
ee_spell_cleanse_desc: "Смывает все вредные эффекты с союзника, на которого вы навели прицел в радиусе 30 м (золотой маркер покажет цель), или с вас, если союзник не отмечен: горение, яд, мороз, молнию, дым, смолу, слизь, намокание, холод и подобные. Также немного исцеляет: на пятую часть силы исцеления жезла. Холод, намокание и дым возвращаются, пока действует их причина."
ee_spell_ward: "Оберег"
ee_spell_ward_desc: "Щит на союзнике, на которого вы навели прицел в радиусе 30 м (золотой маркер покажет цель), или на вас, если союзник не отмечен: он принимает весь урон каждого удара, пока не поглотит вдвое больше силы исцеления жезла, на 20 с. Наложенный снова, он восстанавливается целиком."
ee_spell_sanctuary: "Святилище"
ee_spell_sanctuary_desc: "Купол радиусом 6 м у ваших ног на 10 с: каждый союзник внутри получает на 30% меньше урона, пока остаётся в нём. Снова готово через 2 минуты после каждого применения."
ee_spell_warchant: "Боевая песнь"
ee_spell_warchant_desc: "Песнь: все в радиусе 10 м, и вы тоже, наносят на 10% больше урона в течение 60 с."
ee_spell_featherfall: "Лёгкое падение"
ee_spell_featherfall_desc: "Песнь: все в радиусе 10 м, и вы тоже, медленно падают и не получают урона от падения в течение 30 с, как с плащом из перьев."
ee_spell_spring: "Источник Эйр"
ee_spell_spring_desc: "Целебный источник радиусом 4 м на земле там, куда вы целитесь, в пределах 20 м (у ваших ног, если цель дальше): каждый союзник внутри, и вы тоже, каждую секунду в течение 8 с исцеляется на десятую часть силы исцеления жезла."
ee_spell_secondwind: "Второе дыхание"
ee_spell_secondwind_desc: "Все в радиусе 10 м, и вы тоже, сразу получают 50 выносливости."
ee_spell_chainmend: "Цепное исцеление"
ee_spell_chainmend_desc: "Исцеляет союзника, на которого вы навели прицел в радиусе 30 м (золотой маркер покажет цель), или вас, если союзник не отмечен, затем перескакивает на ближайшего раненого союзника в радиусе 8 м, ещё не исцелённого, всего до 4, и каждое исцеление на 20% слабее предыдущего."
ee_spell_revive: "Воскрешение"
ee_spell_revive_desc: "Наведите прицел на могилу союзника, павшего за последние 3 минуты и всё ещё находящегося в мире: он вернётся к ней с половиной здоровья. Раз в 5 минут."
ee_se_revive_cooldown: "Воскрешение восстанавливается"
ee_se_revive_cooldown_tip: "Воскрешение можно снова применить, когда этот эффект закончится"
ee_se_sanctuary_tip: "На 30% меньше получаемого урона внутри купола"
ee_se_sanctuary_cooldown: "Святилище восстанавливается"

