# Щиты (Shields)
ee_buckler_wood: "Деревянный баклер"
ee_buckler_wood_desc: "Небольшой деревянный баклер, обтянутый сыромятной кожей. Блокирует слабее круглого щита, но парирует куда эффективнее."
ee_shield_bronze: "Бронзовый щит"
ee_shield_bronze_desc: "Круглый щит из досок в бронзовой оправе с бронзовым умбоном в центре. Гораздо прочнее деревянного."
ee_buckler_silver: "Серебряный баклер"
ee_buckler_silver_desc: "Качественная древесина в серебряной оправе с серебряной головой волка в самом сердце. Блокирует слабее щита, но парирует куда эффективнее."
ee_tower_silver: "Серебряный башенный щит"
ee_tower_silver_desc: "Высокий щит из качественного дерева в серебряном каркасе, увенчанный серебряной головой волка. Тяжелый, но блокирует практически любую атаку."
ee_buckler_blackmetal: "Баклер из черного металла"
ee_buckler_blackmetal_desc: "Баклер из черного металла на прочной цепи. Блокирует слабее обычного щита, но парирует куда эффективнее."
ee_tower_carapace: "Панцирный башенный щит"
ee_tower_carapace_desc: "Перекрывающиеся пластины из панциря образуют высокий щит. Тяжелый, но блокирует практически любую атаку."
ee_buckler_flametal: "Огнеметаллический баклер"
ee_buckler_flametal_desc: "Огнеметаллический баклер на основе из пепельного дерева, все еще теплый из кузницы. Блокирует слабее щита, но парирует куда эффективнее."

