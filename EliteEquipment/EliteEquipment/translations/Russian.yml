# Заклинатели: жезлы и амулеты (Casters)
ee_wand_meadows: "Сучковатый жезл"
ee_wand_meadows_desc: "Изогнутая ветвь с каплей янтарной смолы, способная удерживать два заклинания. Нажатие ЛКМ выпускает малый сгусток духа за счет эйтра (удерживайте для зарядки, вплоть до +30% к урону на 3-й секунде); нажатие ПКМ творит первое заклинание, а удерживание ПКМ + клик ЛКМ — второе. Заклинатель не умеет блокировать: удержание ПКМ вместе с прыжком совершает мгновенное мерцание (блинк). Настроить заклинания можно кнопкой «Книга заклинаний» в инвентаре."
ee_wand_blackforest: "Жезл из серого дерева"
ee_wand_blackforest_desc: "Качественная древесина в бронзовой оправе, увенчанная запертым в клетке глазом грейдворфа. Способен удерживать два заклинания. Нажатие ЛКМ выпускает сгусток духа за эйтр (удерживайте для зарядки); нажатие ПКМ активирует первое заклинание, удержание ПКМ + клик ЛКМ — второе. Настроить заклинания можно кнопкой «Книга заклинаний» в инвентаре."
ee_focus_meadows: "Вороний фетиш"
ee_focus_meadows_desc: "Небольшой деревянный оберег с примотанным к нему амулетом из вороньих перьев и кремня. При ношении в левой руке ускоряет восполнение эйтра и увеличивает исцеляющую силу жезлов."

