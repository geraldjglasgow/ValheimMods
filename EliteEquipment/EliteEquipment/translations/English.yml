# Casters: the wands and the spellbook (name, then description)
ee_wand_meadows: "Gnarled Wand"
ee_wand_meadows_desc: "A crooked branch with a bead of amber resin. Left mouse fires a small spirit bolt for eitr (hold to charge it, up to +30% damage at 3 s); hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again. A caster does not block: right mouse held and jump blinks."
ee_wand_blackforest: "Greywood Wand"
ee_wand_blackforest_desc: "Fine wood bound in bronze, a greydwarf's eye caged at its head. Left mouse hurls a stone for eitr: a tap throws one, holding throws a bigger one straight ahead that breaks apart five metres out into a tight spray of stones flying on, up to fifteen at full charge; hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_wand_swamp: "Rootbound Wand"
ee_wand_swamp_desc: "Ancient bark wound with roots and banded in iron, a swamp stone in its root claw. Left mouse raises roots out of the ground where you aim, as the Elder does, for eitr: a tap raises one, holding raises more, up to five at full charge; hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_wand_mountains: "Frostsilver Wand"
ee_wand_mountains_desc: "Pale fine wood bound in silver, a frozen freeze gland in its silver crown. Left mouse fires ice shards for eitr, each chilling what it hits: a tap fires one, holding fires more, up to five in a fan at full charge; hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_wand_plains: "Blackmetal Wand"
ee_wand_plains_desc: "A slender black metal rod with a fine wood grip, a sun of deathsquito needles round a gold core at its head. Left mouse fires a spirit bolt for eitr (hold to charge it); hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_wand_mistlands: "Yggdrasil Wand"
ee_wand_mistlands_desc: "Two strands of Yggdrasil wood twisted together, a refined eitr crystal rising from a bark cup at its head, a drop of royal jelly for a pommel. It quickens your eitr while wielded. Left mouse fires a spirit bolt for eitr (hold to charge it); hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_wand_ashlands: "Ashwood Wand"
ee_wand_ashlands_desc: "A rod of Ashlands blackwood banded in flametal, celestial feathers bound at its head. It quickens your eitr while wielded. Left mouse hurls a firebolt for eitr that sets what it hits burning: a tap throws a small one, holding throws a bigger one, and at full charge it bursts in a small explosion where it lands; hold right mouse to pick a spell from your spellbook on a ring; tap right mouse to cast the last one again."
ee_book_meadows: "Leatherbound Spellbook"
ee_book_meadows_desc: "Deer hide stretched over boards, its pages sewn in with sinew. Held in the left hand beside a wand, it holds the spell pages the wand can cast (2), quickens eitr (+10%) and strengthens a wand's healing (+3). Use a spell page while holding it to put the page in."
ee_book_swamp: "Barkbound Grimoire"
ee_book_swamp_desc: "Ancient bark pressed over boards and clasped in iron, its pages bound in with root fibre. Held in the left hand beside a wand, it holds the spell pages the wand can cast (4), quickens eitr (+15%) and strengthens a wand's healing (+6). Use a spell page while holding it to put the page in."
ee_book_ashlands: "Cinderbound Tome"
ee_book_ashlands_desc: "Asksvin hide over a flametal spine, its clasps of charred bone still warm. Held in the left hand beside a wand, it holds the spell pages the wand can cast (8), quickens eitr (+25%) and strengthens a wand's healing (+12). Use a spell page while holding it to put the page in."

