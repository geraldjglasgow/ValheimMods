# Casters: the wands and the focus (name, then description)
ee_wand_meadows: "Gnarled Wand"
ee_wand_meadows_desc: "A crooked branch with a bead of amber resin, holding two spells. Left mouse fires a small spirit bolt for eitr (hold to charge it, up to +30% damage at 3 s); right mouse casts the first spell, right mouse held and left mouse the second. A caster does not block: right mouse held and jump blinks. Set the spells with the Spellbook button in the inventory."
ee_wand_blackforest: "Greywood Wand"
ee_wand_blackforest_desc: "Fine wood bound in bronze, a greydwarf's eye caged at its head, holding two spells. Left mouse fires a spirit bolt for eitr (hold to charge it); right mouse casts the first spell, right mouse held and left mouse the second. Set the spells with the Spellbook button in the inventory."
ee_focus_meadows: "Raven Fetish"
ee_focus_meadows_desc: "A small wooden ward with a raven fetish of feathers and flint lashed to its face. Held on the off hand, it quickens eitr and strengthens a wand's healing."

