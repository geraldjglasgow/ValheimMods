ee_food_turnipcrisps_desc: "Thin turnip slices fried crisp, a thistle sprig on top. A snack for the bog road."
ee_food_blooddraught: "Blood Draught"
ee_food_blooddraught_desc: "A thick red draught of bloodbag, thistle and turnip. It tastes of iron and keeps the eitr flowing."
ee_food_mirestew: "Mire Stew"
ee_food_mirestew_desc: "A murky stew of turnip, bloodbag and yellow mushroom. It looks like the swamp and works like a charm."

