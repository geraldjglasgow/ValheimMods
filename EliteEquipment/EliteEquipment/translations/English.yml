ee_spell_hearthsong_desc: "A chant: everyone within 10 m, you too, regains health 50% faster for 60 s."
ee_spell_swiftness: "Stag's Swiftness"
ee_spell_swiftness_desc: "A chant: everyone within 10 m, you too, moves 10% faster and runs on 20% less stamina for 60 s."

