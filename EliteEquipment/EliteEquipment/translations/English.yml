# Casters: the eitr foods of the Meadows and the Black Forest (name, then description)
ee_food_dandelionmash: "Dandelion Mash"
ee_food_dandelionmash_desc: "Dandelion greens and flowers mashed with honey and mushroom. Little to fill you, but eitr for the wand."
