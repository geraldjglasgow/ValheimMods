# Casters: the spells (name, then description; the chants' names are also their status effects')
ee_spell_mend: "Mend"
ee_spell_mend_desc: "Heals the friend you aim near within 30 m (the gold marker shows who), or yourself when no friend is marked, by the wand's heal power."
ee_spell_hearthsong: "Hearthsong"
ee_spell_hearthsong_desc: "A chant: everyone within 10 m, you too, regains health 50% faster for 60 s."
ee_spell_swiftness: "Stag's Swiftness"
ee_spell_swiftness_desc: "A chant: everyone within 10 m, you too, moves 10% faster and runs on 20% less stamina for 60 s."
ee_spell_volley: "Elder's Volley"
ee_spell_volley_desc: "A strike: six of the Elder's seeds shoot fast from the wand's tip to where you aim, one every tenth of a second, each with 60% of the wand's bolt damage and its damage types. Hits only enemies."
ee_spell_breath: "Moder's Breath"
ee_spell_breath_desc: "A strike: Moder's frost breathed from the wand's tip toward where you aim, about 7 m long, six bursts in half a second, each with half the wand's bolt damage as frost and spirit. Frost slows. Hits only enemies."
ee_spell_cleanse: "Cleanse"
ee_spell_cleanse_desc: "Washes every harmful effect off the friend you aim near within 30 m (the gold marker shows who), or yourself when no friend is marked: burning, poison, frost, lightning, smoke, tar, slime, wet, cold and the like. Heals a little too, a fifth of the wand's heal power. Cold, wet and smoke return while their cause lasts."
ee_spell_ward: "Ward"
ee_spell_ward_desc: "A shield on the friend you aim near within 30 m (the gold marker shows who), or on yourself when no friend is marked: it takes all of every hit until it has taken twice the wand's heal power, for 20 s. Cast again, it starts whole."
ee_spell_sanctuary: "Sanctuary"
ee_spell_sanctuary_desc: "A 6 m dome at your feet for 10 s: every friend inside takes 30% less damage while they stay in it. Ready again 2 minutes after each cast."
ee_spell_warchant: "War Chant"
ee_spell_warchant_desc: "A chant: everyone within 10 m, you too, deals 10% more damage for 60 s."
ee_spell_featherfall: "Feather Fall"
ee_spell_featherfall_desc: "A chant: everyone within 10 m, you too, falls slowly and takes no fall damage for 30 s, as the feather cape gives."
ee_spell_spring: "Eir's Spring"
ee_spell_spring_desc: "A 4 m healing spring on the ground where you aim within 20 m (at your feet when you aim farther): every friend inside, you too, heals a tenth of the wand's heal power every second for 8 s."
ee_spell_secondwind: "Second Wind"
ee_spell_secondwind_desc: "Everyone within 10 m, you too, gets 50 stamina back at once."
ee_spell_chainmend: "Chain Mend"
ee_spell_chainmend_desc: "Mends the friend you aim near within 30 m (the gold marker shows who), or yourself when no friend is marked, then jumps to the nearest hurt friend within 8 m not healed yet, up to 4 in all, each heal 20% less than the one before."
ee_spell_revive: "Revive"
ee_spell_revive_desc: "Aim at the grave of a friend who fell within the last 3 minutes and is still in the world: they are brought back to it with half their health. Once every 5 minutes."
ee_se_revive_cooldown: "Revive recovering"
ee_se_revive_cooldown_tip: "Revive can be cast again when this ends"
ee_se_sanctuary_tip: "30% less damage taken inside the dome"
ee_se_sanctuary_cooldown: "Sanctuary recovering"

