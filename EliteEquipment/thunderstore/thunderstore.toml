# Publish settings for tcli. No secrets here: the token comes from TCLI_AUTH_TOKEN or --token.
#   tcli publish --config-path EliteEquipment/thunderstore/thunderstore.toml --file EliteEquipment/thunderstore/EliteEquipment-X.Y.Z.zip
[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MilkyTeam"
name = "EliteEquipment"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "gear", "crafting", "client-side", "server-side"]
