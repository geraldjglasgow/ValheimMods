# Boss aspects: what each does. Lower case and no full stop: the altar shows it on the line under the aspect's name,
# the compendium and the altar window give it a capital and ecr_aspect_sentence.
ecr_aspect_does_none: "walczy tak jak w podstawowej wersji gry"
ecr_aspect_does_reflective: "$1% każdych zadanych mu obrażeń wraca do ciebie"
ecr_aspect_does_shielded: "otrzymuje o $1% mniej obrażeń od strzał i bełtów"
ecr_aspect_does_mending: "co sekundę regeneruje $1% aktualnego zdrowia"
ecr_aspect_does_summoner: "przywołuje $1 stworzeń za każdym razem, gdy straci $2% zdrowia"
ecr_aspect_does_elementalist: "zadaje o $1% więcej obrażeń od żywiołów"
ecr_aspect_does_enraged: "zadaje o $1% więcej obrażeń fizycznych"
ecr_aspect_does_twin: "występuje w parze ze wspólnym paskiem zdrowia; każde stworzenie ma o $1% mniej zdrowia i zadaje o $2% mniej obrażeń"
ecr_aspect_does_phantom: "przy $1 punktach zdrowia tworzy widmowe kopie — $2 na każdego gracza online; kopie mają $3 punktów zdrowia i zadają o $4% mniej obrażeń"
ecr_aspect_does_adaptive: "otrzymuje o $1% mniej obrażeń tego typu, który zadawał mu najwięcej obrażeń w ciągu ostatnich $2 sekund"
ecr_aspect_does_fixated: "oznacza jednego gracza i zadaje mu o $1% więcej obrażeń, a pozostałym o $2% mniej; co $3 sekundy oznaczenie przechodzi na osobę, która zadała mu najwięcej obrażeń"
ecr_aspect_does_stormbound: "co $1 sekund przywołuje piorun w okręgu pod każdym graczem; uderzenie następuje $2 sekundy po pojawieniu się okręgu"
ecr_aspect_does_gravitic: "co $1 sekund przyciąga graczy w promieniu $2 m, a następnie uderza; zadaje obrażenia równe $3% maksymalnego zdrowia graczom w promieniu $4 m"
ecr_aspect_does_colossal: "jest większy o $1%, ma o $2% więcej zdrowia i porusza się o $3% wolniej; ciężkie ataki wywołują falę uderzeniową o zasięgu $4 m, która przewraca graczy (przetocz się przez nią lub przeskocz ją)"
ecr_aspect_does_tethered: "występuje w parze połączonej więzią; każde stworzenie ma o $1% mniej zdrowia. Im większa różnica zdrowia między nimi, tym szybciej atakują (maks. o $2%) i tym mniej obrażeń otrzymuje słabsze z nich (maks. o $3%)"
ecr_aspect_does_bountiful: "ma jednocześnie o $1 więcej aspektów"
ecr_aspect_does_portalbound: "atakuje przez portale (Starszy używa pnączy, a Masa Kości — szlamu): jeden portal otwiera się przy jego dłoni, a drugi gdzieś nad tobą"
ecr_aspect_does_nightfall: "w promieniu $1 m sprowadza burzową północ; co $2–$3 sekundy obok każdego gracza pojawia się tornado i ściga go przez $4 sekundy. Wewnątrz zadaje $5 obrażeń na sekundę"
ecr_aspect_does_brutal: "ciężkie ciosy odrzucają trafionych graczy na $1 m; udany blok lub parowanie pozwala utrzymać się na nogach, a upadek nie zadaje obrażeń"
ecr_aspect_does_echoing: "po $1 sekundach walki pojawia się jego biały duch, który powtarza wszystkie jego działania sprzed $1 sekund, włącznie z ciosami i odrzucaniem, aż do śmierci"
