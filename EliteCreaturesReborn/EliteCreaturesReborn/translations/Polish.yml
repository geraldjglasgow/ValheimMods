# Compendium: what each mutation does (a $n that names a mutation is that mutation's own name)
ecr_book_mut_mad: "Porusza się o $1 szybciej i atakuje o $2 szybciej, ale ma o $3 mniej zdrowia. Ta mutacja nie występuje u nietoperzy."
ecr_book_mut_bloated: "Ma $1-krotność zwykłego zdrowia. Po śmierci eksploduje po $2, zadając $3 obrażeń w promieniu $4 m; każda gwiazdka zwiększa obrażenia."
ecr_book_mut_cloaked: "Pozostaje niewidzialne, dopóki nie zbliżysz się na odległość $1 m. Ta mutacja ($2) nie występuje u draków, nietoperzy, gjalli ani komarów śmierci."
ecr_book_mut_splintering: "Po śmierci rozpada się na słabsze kopie, z których każda zadaje $1% jego obrażeń; kopie również mogą się rozdzielać. Ta mutacja ($2) nie występuje u glutów."
ecr_book_mut_leeching: "Regeneruje $1% zdrowia na sekundę (maksymalnie $2 na sekundę), jeśli przez $3 nie otrzyma obrażeń, a ponadto leczy się o $4% zadanych przez siebie obrażeń."
ecr_book_mut_warding: "Odbija w twoją stronę $1% każdego otrzymanego ciosu i odrzuca cię, ale w ciągu sekundy nie może zadać w ten sposób więcej niż $2% twojego maksymalnego zdrowia."
ecr_book_mut_plated: "Przy pełnym zdrowiu ignoruje $1% otrzymywanych obrażeń; efekt słabnie wraz z utratą zdrowia. Jednocześnie zadaje do $2% większe obrażenia, gdy jego pancerz jest nienaruszony."
ecr_book_mut_miasmic: "Pozostawia za sobą chmury trucizny o szerokości $1 m, z których każda utrzymuje się przez $2. Zatruwają graczy, ale nie inne stworzenia."
ecr_book_mut_devouring: "Pożera mniejsze stworzenia jednym kęsem, przejmując $1% ich zdrowia i $2% ich obrażeń, ale z czasem zwalnia. W ciągu życia zjada jedno stworzenie na każdą gwiazdkę (co najmniej $3), raz na $4; nie pożera bossów ani dużych stworzeń. Gdy urośnie wystarczająco, zaczyna polować również na graczy. Tabliczka z nazwą pokazuje, co zjadło."
ecr_book_mut_thieving: "Każdy udany atak wręcz kradnie przedmiot — maksymalnie jeden na gwiazdkę (co najmniej $1). Skradzione przedmioty są widoczne na tabliczce stworzenia. Zabij je, aby odzyskać wszystko."
ecr_book_mut_gilded: "Mieni się złotem, nie atakuje graczy i ucieka od każdego, kto zbliży się na $1 m. Upuszcza łup o wartości $2 razy większej oraz dodatkowo $3 $4; każda gwiazdka zwiększa nagrodę. Nie występuje u dużych stworzeń."
ecr_book_mut_blinking: "Co $1 podczas walki pojawia się ponownie $2 m za swoim celem, czemu towarzyszą błysk i dźwięk w miejscu teleportacji. Ma o $3 mniej zdrowia."
ecr_book_mut_blinking_never: "Ma o $1 mniej zdrowia. Na tym serwerze nie teleportuje się."
ecr_book_mut_relentless: "Gdy raz cię wybierze, nie przestaje cię ścigać — nawet jeśli znikniesz mu z pola widzenia — dopóki nie oddalisz się na $1 m. Skradanie się nie ukryje cię przed nim. Nie porusza się szybciej niż zwykle i nie występuje u dużych stworzeń."
ecr_book_mut_juggernaut: "Nie traci równowagi ani nie daje się odrzucić: ciosy, parowanie, eksplozje i pułapki go nie powstrzymują. Nad stworzeniem wyświetla się napis „Niepowstrzymany”."
ecr_book_mut_screecher: "Gdy pojedynczy cios odbierze mu $1% zdrowia, wydaje przeraźliwy pisk. Gracze w promieniu $2 m zostają ogłuszeni słuchowo na $3, a broń magii żywiołów i krwi nie może rzucać zaklęć. Efekt występuje najwyżej raz na $4; śmiertelny cios nie wywołuje pisku."
ecr_book_mut_frostbound: "Gracze w promieniu $1 m odzyskują wytrzymałość o $2% wolniej („Wychłodzenie”). Mróz ($3) leczy to stworzenie zamiast zadawać mu obrażenia."
ecr_book_mut_frostbound_ice: "Pozostawia śliski lód na swojej drodze. Na lodzie ślizgasz się i poruszasz o $1% wolniej; każda plama utrzymuje się przez $2."
ecr_book_mut_frostbound_no_ice: "Na tym serwerze nie pozostawia lodu."
ecr_book_mut_mudbound: "Pozostawia na swojej drodze gęste błoto. W błocie poruszasz się o $1% wolniej, a efekt utrzymuje się jeszcze przez $2 po wyjściu. Każda plama pozostaje przez $3."
ecr_book_mut_mudbound_none: "Na tym serwerze nie pozostawia błota."
ecr_book_mut_corrodent: "Jego ataki sprawiają, że twój pancerz traci wytrzymałość $1 razy szybciej, a każdy cios, który się przebije, zabiera dodatkowo $2% maksymalnej wytrzymałości elementu. Tarcze zużywają się w normalnym tempie."
ecr_book_mut_cloning: "Gdy zbliży się do ciebie na $1 m i szykuje do walki, zostawia na miejscu nieszkodliwą kopię i walczy dalej niewidzialne. Ujawnia się, gdy trafi cię pierwszy raz albo gdy zabijesz kopię. $2"
ecr_book_mut_cloning_late: "Gdy zbliży się do ciebie na $1 m i szykuje do walki, zostawia na miejscu nieszkodliwą kopię i walczy dalej niewidzialne. Ujawnia się po pierwszym trafieniu lub zabiciu kopii, a po $2 pokazuje się również samo. $3"
ecr_book_mut_cloning_once: "Raz w ciągu życia."
ecr_book_mut_cloning_times: "$1 razy w ciągu życia."
ecr_book_mut_piercing: "Jego ataki ignorują $1% twojego pancerza."
ecr_book_mut_howling: "Gdy zaczyna cię atakować, wyje, przywołując $1 najbliższych sprzymierzonych stworzeń w promieniu $2 m. Powtarza to co $3 podczas walki. Nie przywołuje bossów."
ecr_book_mut_binding: "Pozostawia splątane korzenie co $1 m; każda plama utrzymuje się przez $2. Wejdź w nie, a unieruchomią cię na $3 („Unieruchomienie” — nadal możesz się obracać, blokować i atakować), po czym uwolnią cię na $4."
ecr_book_mut_flamebound: "Pozostawia płonące podłoże; każda plama utrzymuje się przez $1. Stanie w ogniu podpala cię i zadaje $2 obrażeń od ognia na sekundę; gwiazdki zwiększają obrażenia. Odporność na ogień i mokry stan pomagają, pancerz nie."

