ecr_book_meaning: "Co to oznacza"
ecr_book_meaning_custom: "$1: serwer sam ustala szanse na gwiazdki i mutacje w każdym biomie. Każdy poziom świata je zwiększa; obecnie: gwiazdki x$2, mutacje x$3."
ecr_book_meaning_preset: "Poziom trudności określa liczbę gwiazdek i mutacji stworzeń w miarę pokonywania bossów. Biom, do którego właśnie wchodzisz, jest najłatwiejszy. Każdy biom, który już oczyściłeś, staje się trudniejszy po pokonaniu kolejnego bossa, więc pod koniec gry Łąki będą najtrudniejszym miejscem. Biomy, do których jeszcze nie dotarłeś, mają trudność taką jak biom, do którego właśnie wchodzisz.\nPrzy maksymalnej dozwolonej liczbie gwiazdek większość stworzeń nie ma mutacji, a każda kolejna gwiazdka jest rzadsza od poprzedniej. Każda gwiazdka zwiększa szansę na mutację o jedną czwartą."
ecr_book_biomes: "Każdy biom na poziomie świata $1"
ecr_book_col_biome: "Biom"
ecr_book_col_most_stars: "Maks. gwiazdek"
ecr_book_col_with_stars: "Z gwiazdkami"
ecr_book_col_mutated: "Zmutowane"
ecr_book_biomes_note: "Twój biom oznaczono na pomarańczowo. „Zmutowane” oznacza stworzenia bez gwiazdek, które mają mutację."
ecr_book_ladder: "Poziomy trudności"
ecr_book_ladder_line: "$1: $2"
ecr_book_ladder_easy: "1 gwiazdka w nowym biomie, a za każdego pokonanego później bossa kolejna, maksymalnie 4; 10% stworzeń z mutacją, wzrastające do 35% po pokonaniu bossów"
ecr_book_ladder_medium: "2 gwiazdki, maksymalnie 5; 25% stworzeń z mutacją, wzrastające do 55%"
ecr_book_ladder_hard: "3 gwiazdki, maksymalnie 5; 30% stworzeń z mutacją, wzrastające do 65%"
ecr_book_ladder_veryhard: "4 gwiazdki, maksymalnie 5; szansa na mutacje znajduje się w połowie między $1 a $2"
ecr_book_ladder_extreme: "5 gwiazdek w każdym odkrytym biomie, od 6 do 8 po pokonaniu kolejnych bossów; 45% stworzeń z mutacją, wzrastające do 98%"
ecr_book_ladder_custom: "$1: własne szanse serwera dla każdego biomu, zwiększane na każdym poziomie świata."
ecr_book_ladder_note: "Gwiazdki: maksymalna liczba gwiazdek stworzenia. Zmutowane: stworzenia bez gwiazdek, które mają mutację."
ecr_book_game: "Podstawowy poziom trudności świata w grze"
ecr_book_game_rates: "To ustawienie działa niezależnie od powyższych i kumuluje się z nimi: w tym świecie przeciwnicy zadają $1% normalnych obrażeń, a ty zadajesz $2% swoich normalnych obrażeń."
