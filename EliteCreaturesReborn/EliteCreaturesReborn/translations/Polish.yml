ecr_book_aspects_intro: "Boss przywołany przy ołtarzu może otrzymać aspekt, który zmienia przebieg walki. Nazwa aspektu pojawia się przed nazwą bossa. Ołtarz pokazuje aspekt przed przywołaniem, a jego wybór co jakiś czas się zmienia. Aspekt utrudnia walkę, ale zwiększa zdobywane łupy."
