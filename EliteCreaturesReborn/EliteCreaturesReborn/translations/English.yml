# The Rendering Table: renders trophies into ores, ingredients or a Forge idol of the trophy's biome
# Rendering Table: the piece's name in the hammer's Crafting tab and the first line of its hover. Noun (a narrow bench where trophies are rendered down).
piece_ecr_renderingtable: "Rendering Table"
# Rendering Table: the piece's description in the hammer's build menu. 'Hotbar' = the game's quick slots 1-8; a Forge idol is an ECR item.
piece_ecr_renderingtable_description: "A narrow bench for rendering trophies down. Each trophy gives ores or ingredients of its own biome. A boss trophy, used from the hotbar, gives five times as much or a Forge idol of its tier. The compendium lists what each biome gives."
# Rendering Table: one of its three modes, after 'Makes:' in its hover. Plural noun, alone (ores of the trophy's biome).
ecr_render_ores: "Ores"
# Rendering Table: one of its three modes, after 'Makes:' in its hover. Plural noun, alone (ingredients of the trophy's biome).
ecr_render_ingredients: "Ingredients"
# Rendering Table: one of its three modes, after 'Makes:' in its hover. Plural noun, alone (Forge idols, from boss trophies).
ecr_render_idols: "Idols"

# The Rendering Table's hover ($1 of the first line is Ores, Ingredients or Idols)
# Rendering Table hover, second line. $1 = the current mode: Ores, Ingredients or Idols.
ecr_render_makes: "Makes: $1"
# Rendering Table hover: action after the [E] key label (Ores and Ingredients modes). Holding E keeps rendering trophies one by one.
ecr_render_one: "Render a trophy (hold for more)"
# Rendering Table hover in Idols mode, in place of the [E] action line: a boss trophy must be used on it from the hotbar.
ecr_render_idol_hint: "Use a boss trophy on it from the hotbar to make an idol"
# Rendering Table hover: action after the [Shift + E] key label; switches the mode (Ores, Ingredients, Idols) for everyone.
ecr_render_change: "Change what it makes"

# Why the Rendering Table renders nothing
# Rendering Table: hover line and centre message on a table already built after the admin switched the table off in the .cfg. Rare.
ecr_render_off: "The Rendering Table is switched off."
# Rendering Table: centre message on pressing E with no ordinary trophy in the inventory (E never takes boss trophies).
ecr_render_none: "No trophies to render. Boss trophies render only from the hotbar."
# Rendering Table, Idols mode: centre message on pressing E, or on using an ordinary (non-boss) trophy on it from the hotbar.
ecr_render_need_boss: "Only a boss trophy makes an idol: use one on the table from the hotbar."
# Rendering Table: centre message when a trophy that is in none of its biome lists (e.g. another mod's) is used on it from the hotbar. Rare.
ecr_render_unknown: "The Rendering Table cannot render this trophy."
# Rendering Table: centre message when none of the items that trophy's biome should give exist in this game. Rare.
ecr_render_nothing_made: "This game has nothing of that biome to make."
