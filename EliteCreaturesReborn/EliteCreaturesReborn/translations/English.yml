# The Rendering Table: renders trophies into ores, ingredients or a Forge idol of the trophy's biome
piece_ecr_renderingtable: "Rendering Table"
piece_ecr_renderingtable_description: "A narrow bench for rendering trophies down. Each trophy gives ores or ingredients of its own biome. A boss trophy, used from the hotbar, gives five times as much or a Forge idol of its tier. The compendium lists what each biome gives."
ecr_render_ores: "Ores"
ecr_render_ingredients: "Ingredients"
ecr_render_idols: "Idols"

# The Rendering Table's hover ($1 of the first line is Ores, Ingredients or Idols)
