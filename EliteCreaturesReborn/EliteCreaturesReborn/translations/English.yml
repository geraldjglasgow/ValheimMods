# Compendium, Mutations page: opening paragraph. $1 = the Gilded mutation's name (Gilded). A mutation's name goes before the creature's: 'Mad Boar'.
ecr_book_mutations_intro: "A mutated creature wears its mutation's name before its own, and its stars take the mutation's colour, the colour of the star before each name below. $1 is the rarest and the only one in your favour."
# Compendium, Mutations page: grey line under the intro. $1 = the biome the player stands in, by the game's name (Meadows).
ecr_book_mutations_numbers: "Numbers for a creature with no stars in the $1, where you are."
# Compendium, Mutations page: sentence added to that grey line only when the server's large star power isn't 1. $1 = a multiplier (2).
