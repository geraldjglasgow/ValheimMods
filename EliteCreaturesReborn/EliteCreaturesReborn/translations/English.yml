# Compendium, Rendering Table page: a line under each biome's heading. $1 = that biome's trophies by the game's names, comma separated.
ecr_book_render_trophies: "Trophies: $1"
# Compendium, Rendering Table page: a line under each biome's heading. $1 = its ores by the game's names, comma separated (Copper ore, Tin ore).
ecr_book_render_ores: "Ores: $1"
# Compendium, Rendering Table page: a line under each biome's heading. $1 = its creature parts and plants by the game's names, comma separated.
ecr_book_render_ingredients: "Ingredients: $1"
# Compendium, Rendering Table page: a line under a biome with a boss. $1 = its two Forge idols by the game's names, comma separated.
ecr_book_render_idol: "Idols: $1"

# Hel's hall
# Hel's hall: the name on the hover of Hel, the goddess seated on her throne in the arena. Proper name, alone on the line.
ecr_arena_hel: "Hel"
# Hel's hall: action on Hel's hover after the key, "[E] Begin the trial: Swamp", when no trial runs. Imperative, like a button label. $1 = the trial chosen at Helgrind: a biome name (Swamp) or ecr_arena_mode_infinite.
hud_ecr_arena_begin_trial: "Begin the trial: $1"
# Hel's hall: centre message to a player who falls past the arena into the black river below, just as it kills them.
msg_ecr_arena_river: "Hel's river takes you."

# Helgrind, Hel's gate
# Helgrind: the gate piece's name in the hammer's build menu and on its hover. Proper name of Hel's gate.
piece_ecr_helgrind: "Helgrind"
# Helgrind: the gate piece's description in the hammer's build menu.
piece_ecr_helgrind_description: "Hel's gate, which leads to her hall and her trial. Walk through it to go in; the swirl at the end of the hall's gate passage brings you back out here."
# Helgrind: the gate's hover line after the key, "[E] Trial: Swamp": the trial the gate is set to; E picks the next one. $1 = a biome name (Meadows) or ecr_arena_mode_infinite.
hud_ecr_helgrind_trial: "Trial: $1"
# Hel's Trial: the name of the endless trial, chosen at Helgrind after the biomes: the highest biome again and again, harder each round.
ecr_arena_mode_infinite: "Infinite"
# Helgrind: last line of the gate's hover, while the arena is on. An instruction to the player.
ecr_helgrind_open: "Walk through into Hel's hall"
# Helgrind: hover line while the arena is off on the server, and centre message when a player walks into the gate then.
ecr_helgrind_closed: "Hel's gate is closed."

# Hel's Trial: the line under the minimap ($1 the biome, $2 the wave, then creatures left or seconds, then souls)
# Hel's Trial: the trial's name, coloured, put before the end and reward messages in the chat window (as $1 of ecr_arena_chat_line).
ecr_arena_name: "Hel's Trial"
# Hel's Trial: event bar under the minimap during a wave. $1 = biome (Ashlands), $2 = wave number, $3 = creatures left, $4 = the player's souls (342).
ecr_arena_line: "Hel's Trial - $1, wave $2 - $3 left - $4 souls"
# Hel's Trial: the biome part ($1 of the event bar lines) in the Infinite trial, with its level. $1 = biome (Meadows), $2 = level, 1 to 5.
ecr_arena_level_line: "$1, level $2"
# Hel's Trial: event bar under the minimap before wave 1. $1 = biome name (Meadows), $2 = time left as m:ss (0:07).
ecr_arena_countdown: "Hel's Trial - $1 - the first wave in $2"
# Hel's Trial: event bar during a break. $1 = biome, $2 = wave just cleared, $3 = seconds to the next wave (14), $4 = the player's souls.
ecr_arena_break_line: "Hel's Trial - $1, wave $2 cleared - next wave in $3 - $4 souls"
# Hel's Trial: event bar while Hel's recall runs. $1 = biome, $2 = wave, $3 = creatures left, $4 = time to recall as m:ss (0:45), $5 = souls.
ecr_arena_recall_line: "Hel's Trial - $1, wave $2 - $3 left, recalled in $4 - $5 souls"
# A rest's line ($1) with who is ready after it ($2: ecr_arena_ready_hint or ecr_arena_ready_mine)
# Hel's Trial: event bar in the countdown or a break. $1 = the countdown or break line, $2 = ecr_arena_ready_hint or ecr_arena_ready_mine.
ecr_arena_line_ready: "$1 - $2"
# Hel's Trial: end of the event bar in the countdown or a break; F is the fixed key to vote ready. $1 = players ready (1), $2 = players alive in the arena (3).
ecr_arena_ready_hint: "F: ready ($1/$2)"
# Hel's Trial: end of the event bar once this player pressed F to vote ready. $1 = players ready (1), $2 = players alive in the arena (3).
ecr_arena_ready_mine: "(ready) $1/$2"

# Hel's Trial: centre messages
# Hel's Trial: centre message to every player of the trial when a player starts it at Hel. $1 = the trial: a biome name (Swamp) or ecr_arena_mode_infinite.
ecr_arena_started: "Hel wakes. Her trial begins: $1!"
# Hel's Trial: centre message to the trial's players as a boss wave begins. $1 = the boss's name (Moder).
ecr_arena_boss: "Hel sends $1!"
# Hel's Trial: centre message and chat line to each player when the trial ends. $1 = wave reached (12), $2 = kills (340), $3 = their souls (18,420).
ecr_arena_ended: "Hel's Trial ends at wave $1: $2 kills, $3 souls."
# Hel's Trial: centre message and chat line to each player when they beat the boss that ends a biome's trial. $1 = the biome (Swamp), $2 = kills (40), $3 = their souls (1,250).
ecr_arena_won: "You won Hel's trial of the $1: $2 kills, $3 souls."
# Hel's Trial: centre message when the wave(s) fighting are over and a break begins. $1 = wave number, $2 = break in seconds (20).
ecr_arena_cleared: "Wave $1 cleared. The next comes in $2 seconds."
# Hel's Trial: as ecr_arena_cleared, but for the trial's first cleared wave, adding the reward note. $1 = wave number, $2 = break seconds (20).
ecr_arena_cleared_first: "Wave $1 cleared. The next comes in $2 seconds. Hel pays your reward when her trial ends."
# Hel's Trial: centre message when one wave is cleared while a wave called early still fights. $1 = wave number (6).
ecr_arena_wave_done: "Wave $1 cleared."
# Hel's Trial: centre message when only the last quarter of a wave is left; they are marked on the map. $1 = seconds until they vanish (60).
ecr_arena_recall: "Hel marks the last of the dead on your map. She recalls them in $1 seconds."
# Hel's Trial: centre message after respawning from a death in Hel's hall (no skill loss, no tombstone).
ecr_arena_spared: "Hel spares your skills and your gear."
# Hel's Trial: centre message to the trial's players each time someone votes ready with F. $1 = players ready (2), $2 = players alive in the arena (3).
ecr_arena_ready_vote: "Ready: $1 of $2"
# Hel's Trial: centre message when every player alive in the arena has voted ready: the break ends and the next wave comes at once.
ecr_arena_all_ready: "All ready - the dead come!"
# Hel's Trial: action on Hel's hover after the key, "[E] Call the next wave", during a wave whose creatures are all out. Imperative, button label.
ecr_arena_call_hint: "Call the next wave"
# Hel's Trial: centre message to the trial's players when someone calls the next wave early at Hel. $1 = that player's name.
ecr_arena_called: "$1 calls the next wave!"
# Hel's Trial: centre message to a player who tried to call the next wave while a boss still lives. $1 = the boss's name (Moder).
ecr_arena_boss_waits: "Hel waits until $1 falls."
# The end and the reward again in the chat window: $1 the trial's name (coloured), $2 the message
# Hel's Trial: a line in the chat window repeating the end and reward messages. $1 = ecr_arena_name (coloured), $2 = the message.
ecr_arena_chat_line: "$1: $2"

# Hel's Trial: the reward (the end message and Hel's hover while a trial runs)
# Hel's Trial: centre message and chat line a few seconds after the end. $1 = the reward list (Bronze Battle Idol, 412 coins, +18% skill XP).
ecr_arena_reward: "Hel rewards you: $1."
# Hel's Trial: line on Hel's hover while a trial runs: what it would pay now. $1 = the reward list, or ecr_arena_reward_none.
ecr_arena_reward_now: "Current rewards: $1"
# Hel's Trial: fills $1 of ecr_arena_reward_now on Hel's hover when nothing is earned yet. Lowercase, after "Current rewards:".
ecr_arena_reward_none: "none yet"
# A named item given more than once: $1 the item, $2 how many
# Hel's Trial: one item in the reward list when there is more than one of it. $1 = item's game name (Bronze Battle Idol), $2 = how many (2).
ecr_arena_reward_item: "$1 x$2"
# The reward's parts one after another: $1 the parts so far, $2 the next
# Hel's Trial: joins reward list parts one by one. $1 = the parts so far, $2 = the next part. Only the separator matters (", " in English).
ecr_arena_reward_list: "$1, $2"
# Hel's Trial: a part of the reward list. $1 = number of coins (412), always this one form, even for 1.
ecr_arena_reward_coins: "$1 coins"
# Hel's Trial: a part of the reward list, only with the EliteCrafting mod. $1 = number of runes (6), always this one form.
ecr_arena_reward_runes: "$1 runes"
# Hel's Trial: a part of the reward list, only with the EliteCrafting mod. $1 = amount of essence (3); essence is a mass noun.
ecr_arena_reward_essence: "$1 essence"
# Hel's Trial: the last part of the reward list: bonus on the skill experience earned in the trial. $1 = a percentage (18).
ecr_arena_reward_xp: "+$1% skill XP"

# Hel's Anvil
# Hel's Anvil: the name on the hover of the two anvils beside Hel's throne in the arena. Proper name, alone on the line.
ecr_arena_anvil: "Hel's Anvil"
# Hel's Anvil: hover action after "[E]" in the countdown or a break. $1 = cost in souls (30). Imperative, button label.
ecr_arena_anvil_repair: "Repair your gear ($1 souls)"
# Hel's Anvil: hover line, and centre message on E, when the player's souls do not cover the repair. $1 = the cost in souls (30).
ecr_arena_anvil_poor: "Not enough souls ($1)"
# Hel's Anvil: hover line during a wave, when the anvil cannot be used (only in the countdown and breaks).
ecr_arena_anvil_cold: "The anvil is cold while the dead come"
# Hel's Anvil: centre message after the anvil repairs all the player's damaged gear. $1 = souls spent (30).
ecr_arena_anvil_done: "Hel's Anvil mends your gear for $1 souls."
# Hel's Anvil: centre message on E when no item the player carries is damaged.
ecr_arena_anvil_nothing: "Nothing you carry needs mending."

# Raids: the Raiders Chest, the messages as a raid starts and ends, the line under the minimap, and the death recap.
# $1, $2 ... are values the mod fills in (names, numbers, key hints). "$1 raid" names a raid after its creature.

# The Raiders Chest
# Raids: the Raiders Chest's name in the hammer's build menu, on its hover and as the chest window's title. A noun (a chest).
piece_ecr_raiderschest: "Raiders Chest"
# Raids: the Raiders Chest's description in the hammer's build menu.
piece_ecr_raiderschest_description: "An iron-bound chest with a war horn on its lid. Fill it with gold or trophies and sound the horn: raiders come for them, and beating them brings them back with more. The bigger the stake for your gear, the harder the raid and the richer the loot. Only in a base, once a day."
# Raids: action on the Raiders Chest's hover after "[Shift + E]", next to the game's "[E] Open". Imperative, button label.
hud_ecr_raid_sound: "Sound the raid"
# Raids: the on-screen caption (the game's closed captions option) of the war horn sound as a raid starts. A noun, alone.
ecr_raid_horn: "War horn"

# The Raiders Chest's hover ($1 of the stake line is the coins, $2 the difficulty)
# Raids: the coin count on the Raiders Chest's hover when it holds exactly one coin. $1 = 1. Also $1 of ecr_raid_stake_line.
ecr_raid_coins_one: "$1 coin"
# Raids: the coin count on the Raiders Chest's hover for any other number. $1 = number of coins (1,000). Also $1 of ecr_raid_stake_line.
ecr_raid_coins_many: "$1 coins"
# Raids: the trophy count on the Raiders Chest's hover when it holds exactly one trophy. $1 = 1.
ecr_raid_trophies_one: "$1 trophy"
# Raids: the trophy count on the Raiders Chest's hover for any other number. $1 = number of trophies (12).
ecr_raid_trophies_many: "$1 trophies"
# Raids: coins and trophies together on the Raiders Chest's hover. $1 = ecr_raid_coins_many (1,000 coins), $2 = ecr_raid_trophies_many (12 trophies).
ecr_raid_coins_and_trophies: "$1 and $2"
# Raids: chest hover line. $1 = the stake (1,000 coins, 12 trophies, or ecr_raid_coins_and_trophies), $2 = difficulty before "raid" (Deadly), $3 = how many times the stake comes back (2), $4 = loot multiplier (5).
ecr_raid_stake_line: "$1 - $2 raid (stake back x$3, drops x$4)"
# Raids: line on the Raiders Chest's hover when it holds no coins.
ecr_raid_empty: "Put gold coins or trophies in to sound a raid."
# Raids: line on the Raiders Chest's hover during a raid. $1 = the use key in brackets ([E]).
ecr_raid_hold_to_stop: "Hold $1 to stop the raid (the raiders' gold is lost)"
# Raids: line on the Raiders Chest's hover while the player holds E to stop the raid. $1 = progress as a percentage (0-100, by tens).
ecr_raid_stopping: "Stopping the raid... $1%"
# Raids: centre message when a player presses E on the Raiders Chest during its raid.
ecr_raid_locked: "The Raiders Chest is locked while the raid is on. Hold to stop the raid."

# Why no raid is sounded
# Raids: centre message refusing a raid when the Raiders Chest setting is off on the server. Rare.
ecr_raid_off: "Raids from the Raiders Chest are off on this server."
# Raids: Raiders Chest hover line, and centre message on Shift+E, when the chest has no base around it (workbench, fire, bed within 20 m).
ecr_raid_not_in_base: "Not in a base: a raid needs a base to attack."
# Raids: Raiders Chest hover line, and centre message on Shift+E, while the horn's once-a-day wait runs. $1 = time left as m:ss (18:05).
ecr_raid_resting: "The horn must rest: ready in $1"
# Raids: Raiders Chest hover line, and centre message on Shift+E, when one of the game's own raids is on within 200 m.
ecr_raid_game_raid_near: "Another raid is already on nearby."
# Raids: Raiders Chest hover line, and centre message on Shift+E, when another Raiders Chest's raid is on within 200 m.
ecr_raid_chest_raid_near: "Another raid is already on within 200 m."
# Raids: centre message refusing Shift+E on the Raiders Chest while another player has it open.
ecr_raid_in_use: "Someone has the Raiders Chest open."
# Raids: centre message refusing a raid when the chest turns out to hold no coins as it is sounded; also an admin console reply. Rare.
ecr_raid_no_gold: "No gold or trophies, no raid."
# Raids: centre message refusing Shift+E when the Raiders Chest's owning machine changed during the request. Rare.
ecr_raid_moved: "The Raiders Chest changed hands just then: try again."
# Raids: refusal when the object cannot host a raid, an internal check; seen in the admin console's elite raid start reply. Rare.
ecr_raid_no_host: "This cannot hold a raid."
# Raids: refusal when this machine does not own the raid's object; seen in the admin console's elite raid start reply. Rare.
ecr_raid_not_owner: "Only the machine that owns it can sound a raid here."
# Raids: refusal when a raid already runs at this chest or marker; centre message or admin console reply. Rare.
ecr_raid_already_on: "A raid is already on here."
# Raids: centre message refusing Shift+E (also a console reply) when the world has no raid unlocked yet (e.g. no boss beaten).
ecr_raid_none_unlocked: "No raid has been unlocked in this world yet."

# A raid starts and ends ($1 the raid's creature, $2 the difficulty)
# Raids: centre message, two lines, to players within 100 m when a raid is sounded. $1 = raid's creature (Fuling), $2 = difficulty (Brutal).
ecr_raid_started: "Raiders are coming for your gold!\n$1 raid ($2)"
# Raids: centre message to players near when the raid's last wave is dead. $1 = the raid's creature (Fuling), as in "Fuling raid".
ecr_raid_won: "$1 raid beaten! Your gold is yours again."
# Raids: centre message to the players near when a raid staked with trophies is won, in place of ecr_raid_won. $1 = the raid's name before "raid" (Fuling), $2 = how many trophies were put back (24).
ecr_raid_won_trophies: "$1 raid beaten! Your gold is yours again, and $2 trophies are back in the Raiders Chest."
# Raids: centre message to players near when the Raiders Chest is broken during its raid.
ecr_raid_robbed: "The Raiders Chest is broken: the raiders make off with your gold."
# Raids: centre message when a raid is stopped (E held on the chest, or a console command). $1 = the raid's creature (Fuling).
ecr_raid_stopped: "$1 raid called off. The raiders fall, and your gold with them."
# Raids: centre message to players within 100 m when a raid is abandoned (nobody within 96 m for 60 s, last player logged out, or server restart).
ecr_raid_abandoned: "The raid is abandoned: the raiders leave with your gold."
# Raids: centre message to players within 100 m when the raid's 15 minutes run out before the last wave is beaten.
ecr_raid_timed_out: "Time is up: the raiders leave with your gold."

# The raid's line under the minimap ($1 the raid's creature, $2 the difficulty; times as m:ss)
# Raids: the event line under the minimap (also in the Raiders Chest hover) before wave 1. $1 = raid's creature (Fuling), $2 = difficulty (Brutal), $3 = m:ss (0:20).
ecr_raid_line_countdown: "$1 raid ($2) - first wave in $3"
# Raids: line under the minimap between waves. $1 = creature (Fuling), $2 = difficulty, $3 = next wave (2), $4 = waves (3), $5 = time to it (0:20), $6 = raid time left (12:40).
ecr_raid_line_break: "$1 raid ($2) - wave $3 of $4 in $5 - $6"
# Raids: line under the minimap during a wave. $1 = creature (Fuling), $2 = difficulty, $3 = wave (2), $4 = waves (3), $5 = raiders still alive in it (5), $6 = time left (8:40).
ecr_raid_line_wave: "$1 raid ($2) - wave $3 of $4 - $5 left - $6"

# Raid difficulty
# Raids: difficulty name (lowest of five). In brackets after the raid name ('Fuling raid (Trivial)') and before 'raid' in the Raiders Chest hover ('Trivial raid').
ecr_raid_band_trivial: "Trivial"
# Raids: difficulty name (2nd of five). In brackets after the raid name ('Fuling raid (Fair)') and before 'raid' in the Raiders Chest hover ('Fair raid').
ecr_raid_band_fair: "Fair"
# Raids: difficulty name (3rd of five). In brackets after the raid name ('Fuling raid (Hard)') and before 'raid' in the Raiders Chest hover ('Hard raid').
ecr_raid_band_hard: "Hard"
# Raids: difficulty name (4th of five). In brackets after the raid name ('Fuling raid (Brutal)') and before 'raid' in the Raiders Chest hover ('Brutal raid').
ecr_raid_band_brutal: "Brutal"
# Raids: difficulty name (highest). In brackets after the raid name ('Fuling raid (Deadly)') and before 'raid' in the Raiders Chest hover ('Deadly raid').
ecr_raid_band_deadly: "Deadly"

# Death recap: the window
# Death recap: the window's title (window opened with F10 or /deaths). Heading.
ecr_recap_topic: "Death Recap"
# Death recap window: button label (narrow, about 130 px) that plays the death video; it turns into Pause while playing. Imperative verb.
ecr_recap_play: "Play"
# Death recap window: the Play button's label while the video plays; pressing it pauses. Imperative verb.
ecr_recap_pause: "Pause"
# Death recap window: big title in the right pane when no death has been recorded since the game started.
ecr_recap_none: "No deaths yet"
# Death recap window: line under 'No deaths yet'. $1 = the recap key (F10), or the chat command /deaths when no key is set.
ecr_recap_none_help: "Deaths are kept here until the game closes. $1 opens and closes this window."
# Death recap window: text in the empty video box for a death without video. $1 = the .cfg setting's name, left in English ('Record deaths').
ecr_recap_no_video: "No video of this death: recording was off ($1 in the .cfg) or not possible."

# Death recap: the killer, the summary and the hit rows
# Death recap: window title of a death no creature or player dealt. $1 = the cause, capitalised (Fall, Drowning, Edge of the world).
ecr_recap_died: "Died: $1"
# Death recap: window title of the selected death. $1 = the killer's name, a creature with its stars (Mad Greydwarf 2★).
ecr_recap_killed_by: "Killed by $1"
# Death recap: window title. $1 = the killer's name (Greydwarf 2★), $2 = how, in grey brackets: '(ranged)', '(burning)', '(poison)'.
ecr_recap_killed_by_how: "Killed by $1 $2"
# Death recap: a death's date in the summary line and the death list. $1 = in-game day (96), $2 = real clock time HH:mm (14:32).
ecr_recap_when: "Day $1, $2"
# Death recap summary, after 'Day 96, 14:32 · ': no hits were logged before the death. Lower-case phrase.
ecr_recap_no_hits: "no hits recorded"
# Death recap summary, after the date and ' · '. $1 = total damage taken (312), $2 = seconds from first to last hit (8.4); 's' = seconds.
ecr_recap_damage: "$1 damage in $2 s"
# Death recap summary, as above. $1 = total damage (312), $2 = seconds (8.4), $3 = up to four shares joined by ', ' ('slash 62%, frost 30%').
ecr_recap_damage_shares: "$1 damage in $2 s: $3"
# Death recap summary: one damage share in the list. $1 = damage type word (slash), $2 = whole percent (62); '%' follows $2.
ecr_recap_share: "$1 $2%"
# Death recap hit row: one part of a hit's damage, parts joined by ' · '. $1 = damage type word (slash), $2 = damage amount (34).
ecr_recap_part: "$1 $2"
# Death recap hit row, right column: the player's health after that hit. $1 = health left (51), $2 = max health (158).
ecr_recap_hp: "HP $1/$2"

# Death recap: the line at the top left after a death ($2 the recap key)
# Death recap: the game's top-left message after dying. $1 = killer's name (Greydwarf 2★), $2 = recap key (F10) or /deaths, then how to open the recap.
ecr_recap_notice_killed: "Killed by $1. $2: death recap"
# Death recap: top-left message after a death nobody dealt. $1 = the cause, capitalised (Fall, Drowning), $2 = recap key (F10) or /deaths.
ecr_recap_notice_died: "Died: $1. $2: death recap"

# Death recap: how a hit came
# Death recap: a plain melee hit. Shown only capitalised, alone, as a hit row's dealer or 'Died: Hit' when the attacker is unknown. Rare.
ecr_recap_type_hit: "hit"
# Death recap: a ranged hit (arrow, thrown). In grey brackets after 'Killed by X (ranged)'; capitalised alone when the attacker is unknown.
ecr_recap_type_ranged: "ranged"
# Death recap cause: burning (fire over time). In brackets after 'Killed by X (burning)'; capitalised alone ('Died: Burning') as a hit row's source.
ecr_recap_type_burning: "burning"
# Death recap: poison, as a cause ('Killed by X (poison)', 'Died: Poison') and as a damage-type label before a number or % ('poison 34', 'poison 20%').
ecr_recap_type_poison: "poison"
# Death recap cause: freezing (cold over time). In brackets after 'Killed by X (freezing)'; capitalised alone ('Died: Freezing') as a hit row's source.
ecr_recap_type_freezing: "freezing"
# Death recap cause: falling. Capitalised alone ('Died: Fall') and as a hit row's source; lower case as a damage label ('fall 34', 'fall 100%').
ecr_recap_type_fall: "fall"
# Death recap cause: drowning. Capitalised alone ('Died: Drowning') and as a hit row's source; lower case as a damage label ('drowning 10').
ecr_recap_type_drowning: "drowning"
# Death recap cause: the world's edge. Capitalised, first letter only ('Died: Edge of the world'); lower case as a damage label.
ecr_recap_type_edge_of_world: "edge of the world"
# Death recap cause: hit by a falling tree. Capitalised alone ('Died: Falling tree') and as a hit row's source; lower case as a damage label.
ecr_recap_type_falling_tree: "falling tree"
# Death recap cause: hit by a collapsing building piece. Capitalised alone ('Died: Falling building'); lower case as a damage label.
ecr_recap_type_falling_building: "falling building"
# Death recap cause: hurt by a ship (the game's Boat hit type). Capitalised alone ('Died: Ship'); lower case as a damage label. Rare.
ecr_recap_type_ship: "ship"
# Death recap cause: the Ashlands' boiling sea. Capitalised alone ('Died: Boiling sea'); lower case as a damage label ('boiling sea 20').
ecr_recap_type_boiling_sea: "boiling sea"
# Death recap cause: Ashlands lava. Capitalised alone ('Died: Lava') and as a hit row's source; lower case as a damage label ('lava 30').
ecr_recap_type_lava: "lava"
# Death recap cause: the Ashlands' cinder fire on the ground. Capitalised alone ('Died: Cinder fire'); lower case as a damage label.
ecr_recap_type_cinder_fire: "cinder fire"
# Death recap cause: the game's 'Water' hit type. Capitalised alone ('Died: Water'); lower case as a damage label. Rare.
ecr_recap_type_water: "water"
# Death recap cause: smoke (the game's Smoke hit type). Capitalised alone ('Died: Smoke'); lower case as a damage label. Rare.
ecr_recap_type_smoke: "smoke"
# Death recap cause: an impact (the game's Impact hit type, struck by a heavy object). Capitalised alone ('Died: Impact'); also a damage label. Rare.
ecr_recap_type_impact: "impact"
# Death recap cause: hit by a cart. Capitalised alone ('Died: Cart') and as a hit row's source; lower case as a damage label. Rare.
ecr_recap_type_cart: "cart"
# Death recap cause: damage the player did to themselves (the game's Self hit type). Capitalised alone ('Died: Self'). Rare.
ecr_recap_type_self: "self"
