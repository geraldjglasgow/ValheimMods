# Elite Creatures Reborn - English words
#
# To translate: copy this file as EliteCreaturesReborn.translations.<Language>.yml and translate the text in quotes.
# <Language> is the game's name for the language set in its settings (English, German, Portuguese_Brazilian ...);
# the log names it on start: "<Language>: no translation, English shown (a translation is ...)".
# Put the file in BepInEx/config, or ship it in your own mod under BepInEx/plugins; it is read on start and whenever the
# language changes. A key you leave out stays English.
# Keep each key as it is, keep $1, $2 ... (filled in by the game), keep \n (a line break), and keep each text on one line
# between double quotes (write \" for a quote inside it). Patterns such as "$1 $2" set the word order: a creature's
# name is ecr_name_decorated, so a language that puts its words after the name writes "$2 $1".
# The "# " line above each key says where the text shows, what its $1, $2 ... hold, and "Rare." for text few
# players ever see; leave those out first if time is short.

# Mutation names: the word before a creature's name ("Mad Greydwarf"), also used by the compendium and eggs
# Mutation name: adjective before a creature's name ("Mad Greydwarf"), one form for every creature, also alone in compendium and egg tooltips. Far faster.
ecr_mut_mad: "Mad"
# Mutation name: adjective before a creature's name ("Bloated Boar"); also alone in compendium, egg tooltips. Double health, explodes after death.
ecr_mut_bloated: "Bloated"
# Mutation name: adjective before a creature's name ("Cloaked Wolf"); also alone in compendium, egg tooltips. Invisible beyond 10 m.
ecr_mut_cloaked: "Cloaked"
# Mutation name: adjective before a creature's name ("Splintering Troll"); also alone in compendium, egg tooltips. Splits into weaker copies when killed.
ecr_mut_splintering: "Splintering"
# Mutation name: adjective before a creature's name ("Leeching Draugr"); also alone in compendium, egg tooltips. Heals from the damage it deals.
ecr_mut_leeching: "Leeching"
# Mutation name: adjective before a creature's name ("Warding Troll"); also alone in compendium, egg tooltips. Reflects part of each hit back.
ecr_mut_warding: "Warding"
# Mutation name: adjective before a creature's name ("Plated Boar"); also alone in compendium, egg tooltips. Armoured while healthy.
ecr_mut_plated: "Plated"
# Mutation name: adjective before a creature's name ("Miasmic Draugr"); also alone in compendium, egg tooltips. Trails poison clouds.
ecr_mut_miasmic: "Miasmic"
# Mutation name: adjective before a creature's name ("Devouring Wolf"); also alone in compendium, egg tooltips. Eats other creatures and grows stronger.
ecr_mut_devouring: "Devouring"
# Mutation name: adjective before a creature's name ("Thieving Greydwarf"); also alone in compendium, egg tooltips. Steals items from you with its hits.
ecr_mut_thieving: "Thieving"
# Mutation name: adjective before a creature's name ("Gilded Boar"); also alone in compendium, egg tooltips. Glitters gold, flees, drops rich loot.
ecr_mut_gilded: "Gilded"
# Mutation name: adjective before a creature's name ("Blinking Wolf"); also alone in compendium, egg tooltips. Teleports behind its target.
ecr_mut_blinking: "Blinking"
# Mutation name: adjective before a creature's name ("Relentless Draugr"); also alone in compendium, egg tooltips. Never stops chasing you.
ecr_mut_relentless: "Relentless"
# Mutation name: a noun put before a creature's name ("Juggernaut Troll"); also alone in compendium, egg tooltips. Never staggers or is knocked back.
ecr_mut_juggernaut: "Juggernaut"
# Mutation name: a noun put before a creature's name ("Screecher Greydwarf"); also alone in compendium, egg tooltips. One who screeches; deafens.
ecr_mut_screecher: "Screecher"
# Mutation name: adjective before a creature's name ("Frostbound Wolf"); also alone in compendium, egg tooltips. Freezing aura, ice trail, frost heals it.
ecr_mut_frostbound: "Frostbound"
# Mutation name: adjective before a creature's name ("Mudbound Troll"); also alone in compendium, egg tooltips. Leaves deep mud where it walks.
ecr_mut_mudbound: "Mudbound"
# Mutation name: adjective before a creature's name ("Corrodent Draugr"); also alone in compendium, egg tooltips. Its hits corrode your armour.
ecr_mut_corrodent: "Corrodent"
# Mutation name: adjective before a creature's name ("Cloning Greydwarf"); also alone in compendium, egg tooltips. Leaves a decoy copy and fights unseen.
ecr_mut_cloning: "Cloning"
# Mutation name: adjective before a creature's name ("Piercing Draugr"); also alone in compendium, egg tooltips. Ignores part of your armour. Off by default.
ecr_mut_piercing: "Piercing"
# Mutation name: adjective before a creature's name ("Howling Wolf"); also alone in compendium, egg tooltips. Howls to call creatures on you. Off by default.
ecr_mut_howling: "Howling"
# Mutation name: adjective before a creature's name ("Binding Greydwarf"); also alone in compendium, egg tooltips. Roots that hold your feet. Off by default.
ecr_mut_binding: "Binding"
# Mutation name: adjective before a creature's name ("Flamebound Surtling"); also alone in compendium, egg tooltips. Leaves burning ground where it walks.
ecr_mut_flamebound: "Flamebound"

# Creature names: $1 its mutation and aspect words, $2 its own name ("Mad Greydwarf")
# Full creature/boss name on nameplate, hover, boss bar, messages, death recap. $1 = its mutation/aspect words ("Bloated Warding"), $2 = its name ("Troll").
ecr_name_decorated: "$1 $2"
# Two words of a creature's name side by side, joined left to right ("Bloated Warding", then "Bloated Warding Miasmic")
# Creature names: joins two mutation/aspect words, repeated for 3+. $1 = words so far ("Bloated"), $2 = next word ("Warding"). Usually just a space.
ecr_name_words: "$1 $2"

# Mutations, told to the player they happen to
# $1 the creature, $2 the item, $3 how many
# Thieving mutation: top-left message to the robbed player. $1 = the creature's full name ("Thieving Greydwarf"), $2 = item name ("Wood"), $3 = count (20).
ecr_mut_msg_stole: "$1 stole $2 x$3"
# $1 the item, $2 how many
# Thieving: top-left message when a steal does not go through and the item is given back. $1 = item name ("Wood"), $2 = count (20). Rare.
ecr_mut_msg_not_stolen: "$1 x$2 was not stolen"
# Thieving: top-left message when a steal confirmed late takes back an item already given back. $1 = item name ("Wood"), $2 = count (20). Rare.
ecr_mut_msg_stolen_late: "$1 x$2 was stolen after all"
# $1 the armour piece, $2 the percent of it left
# Corrodent mutation: top-left message, with the item's icon, when its hit wears your armour. $1 = armour piece ("Bronze helmet"), $2 = percent left (63).
ecr_mut_msg_corrodes: "Your $1 corrodes ($2% left)"

# Over a creature, where damage numbers show
# Juggernaut mutation: grey floating word over the creature, like a damage number, where it would have staggered. Alone; describes the creature.
ecr_display_unstoppable: "Unstoppable"
# A Frostbound creature healed by frost: $1 the health it healed (the game puts + before it)
# Frostbound: green floating heal number over the creature when frost heals it; game adds + before. $1 = health healed (12.5) -> "+12.5 frost".
ecr_display_frost_heal: "$1 frost"

# Status effects
# Status effect name on the HUD beside its icon, while near a Frostbound creature's freezing aura. A state of the player (adjective).
ecr_se_chilled: "Chilled"
# Tooltip (description) of the Chilled status effect, from a Frostbound creature's aura.
ecr_se_chilled_tooltip: "A Frostbound creature's freezing aura: your stamina recovers slowly while you stay near it."
# Status effect name on the HUD beside its icon and countdown, after a Screecher's (or Bat-fiend's) shriek deafens you. Noun phrase.
ecr_se_ringing_ears: "Ringing ears"
# Tooltip (description) of the Ringing ears status effect.
ecr_se_ringing_ears_tooltip: "A shriek left your ears ringing: the world is muffled and spells will not cast."
# Ringing ears: the status effect's start message, top-left, the moment a shriek deafens you.
ecr_se_ringing_ears_start: "Your ears ring - the world goes quiet"
# Ringing ears: centre-of-screen message when you try to cast with an Elemental or Blood Magic weapon while deafened.
ecr_se_ringing_ears_no_cast: "Your ears ring - you cannot cast"
# Status effect name on the HUD while you stand on a Frostbound creature's ice trail. Noun phrase (the ground).
ecr_se_slick_ice: "Slick ice"
# Tooltip (description) of the Slick ice status effect.
ecr_se_slick_ice_tooltip: "Frostbound ice underfoot: your feet slide, so starting, turning and stopping all take longer."
# Status effect name on the HUD while you are in a Mudbound creature's mud trail (and a moment after). Noun phrase (the ground).
ecr_se_deep_mud: "Deep mud"
# Tooltip (description) of the Deep mud status effect.
ecr_se_deep_mud_tooltip: "Mudbound mud underfoot: thick and deep, it drags at every step and clings a moment after."
# Status effect name on the HUD while a Binding creature's roots hold you (about 1 s). A state of the player (adjective).
ecr_se_rooted: "Rooted"
# Tooltip (description) of the Rooted status effect.
ecr_se_rooted_tooltip: "Binding roots hold your feet: you cannot walk, run, jump or roll until they let go."

# Eggs: what an egg will hatch. $1 the number of stars, $2 its mutations (each in its star colour)
# Eggs: last line of an egg's hover text (on the ground) and inventory tooltip, when it will hatch a creature with no stars and no mutations.
ecr_egg_plain: "Hatches plain"
# Eggs: egg hover/tooltip line, it will hatch a 1-star creature with no mutations. $1 = the number of stars (1).
ecr_egg_stars_one: "Hatches with $1 star"
# Eggs: egg hover/tooltip line, hatches with 2+ stars and no mutations. $1 = number of stars (2).
ecr_egg_stars_many: "Hatches with $1 stars"
# Eggs: hover/tooltip line, 1 star plus mutations. $1 = 1, $2 = the mutation names, coloured, joined by ecr_egg_list ("Leeching, Mad").
ecr_egg_stars_one_mutations: "Hatches with $1 star, $2"
# Eggs: hover/tooltip line, 2+ stars (or 0) plus mutations. $1 = stars (2), $2 = the coloured mutation names ("Leeching, Mad").
ecr_egg_stars_many_mutations: "Hatches with $1 stars, $2"
# Two mutations in an egg's list, joined left to right ("Leeching, Mad", then "Leeching, Mad, Gilded")
# Eggs: joins two mutation names in an egg's line, repeated for 3+. $1 = list so far ("Leeching"), $2 = next name ("Mad").
ecr_egg_list: "$1, $2"

# World tier: the inventory plate's tooltip ($1 the number of tiers) and the message when it rises
# World tier: heading of the tooltip on the world tier plate in the inventory (only with PackPanel installed). Alone, as a title.
ecr_tier_topic: "World tier"
# World tier: body of the inventory plate's tooltip. $1 = total number of tiers (7).
ecr_tier_tip: "There are $1 world tiers in total. The tier rises the first time each boss is defeated, and each tier makes stars and mutations more common in every biome."
# $1 the new tier, $2 the number of tiers
# World tier: centre-of-screen message to every player when the tier rises (a boss's first defeat). $1 = new tier (3), $2 = number of tiers (7).
ecr_tier_risen: "The world hardens: tier $1 of $2"

# Boss hints: a defeated boss points toward a place. $1 one of the directions below
# Boss hints: centre-of-screen message to players near a defeated Elder, Bonemass, Moder or Yagluth. $1 = a direction word below ("north").
ecr_hint_pull: "You feel a presence pulling you... $1"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... north"); lower case, the last word of the message.
ecr_hint_north: "north"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... northeast"); lower case, the last word of the message.
ecr_hint_northeast: "northeast"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... east"); lower case, the last word of the message.
ecr_hint_east: "east"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... southeast"); lower case, the last word of the message.
ecr_hint_southeast: "southeast"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... south"); lower case, the last word of the message.
ecr_hint_south: "south"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... southwest"); lower case, the last word of the message.
ecr_hint_southwest: "southwest"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... west"); lower case, the last word of the message.
ecr_hint_west: "west"
# Boss hints: compass direction filled into ecr_hint_pull ("pulling you... northwest"); lower case, the last word of the message.
ecr_hint_northwest: "northwest"

# Boss rewards, on a boss altar's hover: $1-$2 the amount, $3 the item
# Boss altar hover text: the extra reward the fight pays. $1-$2 = amount range (10-20), $3 = item name ("Iron scrap"), each player.
ecr_loot_altar_reward: "Reward: $1-$2 $3 per player"

# The Bat-fiend: its name and its attacks' names
# Bat-fiend creature's name: nameplate, hover, death recap killer, sound captions; mutation words may go before it. Hel's Arena guardian or console.
enemy_ecr_batfiend: "Bat-fiend"
# Name of a Bat-fiend attack (a leap with claws), set as its attack item's name. Not shown in ECR's own windows; other mods may. Rare.
item_ecr_batfiend_pounce: "Raking Pounce"
# Name of a Bat-fiend attack (a lunging bite that heals it), set as its attack item's name. Not shown in ECR's own windows. Rare.
item_ecr_batfiend_bite: "Bloodletting Bite"
# Name of a Bat-fiend attack (a sideways wing slash), set as its attack item's name. Not shown in ECR's own windows. Rare.
item_ecr_batfiend_wing: "Wing Guillotine"
# Name of a Bat-fiend attack (a freezing gust), set as its attack item's name. Not shown in ECR's own windows. Rare.
item_ecr_batfiend_gravewind: "Gravewind Blast"
# Name of a Bat-fiend attack (a shriek that deafens and staggers), set as its attack item's name. Not shown in ECR's own windows. Rare.
item_ecr_batfiend_screech: "Shattering Screech"

# Elite Creatures Reborn: the compendium pages, boss aspects, boss altars and the boss damage board.
# $1, $2 ... are values the mod fills in (numbers, names). Colours and layout stay in the code.

# Boss aspects: each aspect's name, put before a boss's own name ("none" is the fight as the game ships it)
# Boss aspects: the plain fight, no aspect. Altar hover "Aspect: none" (lower case after a colon); altar window list item, capitalised ("None").
ecr_aspect_none: "none"
# Boss aspect: adjective before a boss's name ("Reflective Eikthyr"); also alone on its altar, altar window, compendium. Reflects your hits back.
ecr_aspect_reflective: "Reflective"
# Boss aspect: adjective before a boss's name ("Shielded Bonemass"); also alone on its altar, altar window, compendium. Less damage from arrows.
ecr_aspect_shielded: "Shielded"
# Boss aspect: adjective before a boss's name ("Mending Moder"); also alone on its altar, altar window, compendium. Regenerates health.
ecr_aspect_mending: "Mending"
# Boss aspect: a noun before a boss's name ("Summoner Bonemass"); also alone on its altar, altar window, compendium. Calls creatures.
ecr_aspect_summoner: "Summoner"
# Boss aspect: a noun before a boss's name ("Elementalist Yagluth"); also alone on its altar, altar window, compendium. More elemental damage.
ecr_aspect_elementalist: "Elementalist"
# Boss aspect: adjective before a boss's name ("Enraged Eikthyr"); also alone on its altar, altar window, compendium. More physical damage.
ecr_aspect_enraged: "Enraged"
# Boss aspect: a noun before a boss's name ("Twin Bonemass"); also alone on its altar, altar window, compendium. Comes as two sharing health.
ecr_aspect_twin: "Twin"
# Boss aspect: a noun before a boss's name ("Phantom Moder"); also alone on its altar, altar window, compendium. Splits off phantom copies.
ecr_aspect_phantom: "Phantom"
# Boss aspect: adjective before a boss's name ("Adaptive Yagluth"); also alone on its altar, altar window, compendium. Resists the damage type hitting it most.
ecr_aspect_adaptive: "Adaptive"
# Boss aspect name: adjective before a boss's name ("Fixated Bonemass"), also alone as a label on the altar/compendium. The boss fixes on one player.
ecr_aspect_fixated: "Fixated"
# Boss aspect name: adjective before a boss's name ("Stormbound Moder"), also alone as a label on the altar/compendium. Calls lightning on players.
ecr_aspect_stormbound: "Stormbound"
# Boss aspect name: adjective before a boss's name ("Gravitic Yagluth"), also alone as a label on the altar/compendium. Pulls players in (gravity).
ecr_aspect_gravitic: "Gravitic"
# Boss aspect name: adjective before a boss's name ("Colossal Eikthyr"), also alone as a label on the altar/compendium. The boss is bigger.
ecr_aspect_colossal: "Colossal"
# Boss aspect name: adjective before a boss's name ("Tethered Bonemass"), also alone as a label. Two bosses joined by a tether (a link).
ecr_aspect_tethered: "Tethered"
# Boss aspect name: adjective before a boss's name, first of several ("Bountiful Enraged Mending Eikthyr"), also alone as a label. Extra aspects, more loot.
ecr_aspect_bountiful: "Bountiful"
# Boss aspect name: adjective before a boss's name ("Portalbound Bonemass"), also alone as a label on the altar/compendium. Throws through portals.
ecr_aspect_portalbound: "Portalbound"
# Boss aspect name: adjective before a boss's name ("Nightfall Moder"), also alone as a label. Brings a stormy night; an English noun used as an adjective.
ecr_aspect_nightfall: "Nightfall"
# Boss aspect name: adjective before a boss's name ("Brutal Eikthyr"), also alone as a label on the altar/compendium. Throws players far away.
ecr_aspect_brutal: "Brutal"
# Boss aspect name: adjective before a boss's name ("Echoing Eikthyr"), also alone as a label. A ghost of the boss repeats its moves later.
ecr_aspect_echoing: "Echoing"

# Boss aspects: what each does. Lower case and no full stop: the altar shows it on the line under the aspect's name,
# the compendium and the altar window give it a capital and ecr_aspect_sentence.
# Boss altar hover: line under "Aspect: none" for a plain fight; capitalised + full stop in the altar window. Also in the elite inspect console reply.
ecr_aspect_does_none: "the fight as the game ships it"
# Boss aspect effect ('it' = the boss): altar hover line under its name; capitalised as a sentence in compendium and altar window. $1 = percent (15).
ecr_aspect_does_reflective: "$1% of each hit you land on it comes back to you"
# Boss aspect effect ('it'/subject = the boss): altar hover line under its name; capitalised as a sentence in compendium/altar window. $1 = percent (30).
ecr_aspect_does_shielded: "takes $1% less damage from arrows and bolts"
# Boss aspect effect (subject = the boss): altar hover line under its name; capitalised as a sentence in compendium/altar window. $1 = percent (0.2).
ecr_aspect_does_mending: "regenerates $1% of its current health every second"
# Boss aspect effect (subject = the boss): altar hover line; sentence in compendium/altar window. $1 = creatures per wave (2), $2 = percent of health (33).
ecr_aspect_does_summoner: "calls $1 creatures each time it loses $2% of its health"
# Boss aspect effect (subject = the boss): altar hover line under its name; capitalised as a sentence in compendium/altar window. $1 = percent (20).
ecr_aspect_does_elementalist: "deals $1% more elemental damage"
# Boss aspect effect (subject = the boss): altar hover line under its name; capitalised as a sentence in compendium/altar window. $1 = percent (20).
ecr_aspect_does_enraged: "deals $1% more physical damage"
# Boss aspect effect (boss comes as two): altar hover line; sentence in compendium/altar window. $1 = percent less health (25), $2 = percent less damage (25).
ecr_aspect_does_twin: "comes as two sharing one health pool, each with $1% less health and $2% less damage"
# Boss aspect effect: altar line; compendium sentence. $1 = health marks ("66% and 33%" or "no"), $2 = copies per player (1), $3 = copy health (50), $4 = % (50).
ecr_aspect_does_phantom: "at $1 health splits off phantom copies, $2 per player online, with $3 health and $4% less damage"
# Boss aspect effect (subject = the boss): altar hover line; sentence in compendium/altar window. $1 = percent (50), $2 = seconds (15).
ecr_aspect_does_adaptive: "takes $1% less of whichever damage type hit it most in the last $2 seconds"
# Boss aspect effect (subject = the boss): altar line; compendium sentence. $1 = percent harder (50), $2 = percent softer (30), $3 = seconds (30).
ecr_aspect_does_fixated: "marks one player and hits them $1% harder, everyone else $2% softer; the mark moves every $3 seconds to whoever hurt it most"
# Boss aspect effect (subject = the boss): altar hover line; sentence in compendium/altar window. $1 = seconds between strikes (20), $2 = seconds (2).
ecr_aspect_does_stormbound: "every $1 seconds calls lightning down on a circle under each player, $2 seconds after it appears"
# Boss aspect effect: altar line; compendium sentence. $1 = seconds (20), $2 = metres pull range (30), $3 = percent of max health (10), $4 = metres (6).
ecr_aspect_does_gravitic: "every $1 seconds pulls every player within $2 m toward it, then slams: $3% of max health to players within $4 m of it"
# Boss aspect effect: altar line; compendium sentence. $1 = percent bigger (40), $2 = percent more health (15), $3 = percent slower (15), $4 = metres (8).
ecr_aspect_does_colossal: "$1% bigger, $2% more health, $3% slower; its heavy attacks send a $4 m shockwave that knocks players down (roll through it or jump it)"
# Boss aspect effect (two bosses): altar line; compendium sentence. $1 = percent less health (25), $2 = percent faster (50), $3 = percent less damage (50).
ecr_aspect_does_tethered: "comes as two bound by a tether, each with $1% less health; the further apart their health, the faster both attack (up to $2%) and the less damage the weaker one takes (up to $3%)"
# Boss aspect effect (subject = the boss): altar hover line; sentence in compendium/altar window. $1 = number of extra aspects (2).
ecr_aspect_does_bountiful: "carries $1 more aspects at once"
# Boss aspect effect (subject = the boss, the Elder or Bonemass only): altar hover line; sentence in compendium/altar window. No values.
ecr_aspect_does_portalbound: "throws through portals (the Elder its vines, Bonemass its slime): one opens at its hand, the other somewhere above you"
# Boss aspect effect: altar line; compendium sentence. $1 = metres (60), $2-$3 = seconds range (18-28), $4 = seconds (10), $5 = damage per second (25).
ecr_aspect_does_nightfall: "turns the sky to a storming midnight within $1 m of it; every $2-$3 seconds a tornado rises by each player there and hunts them for $4 seconds: $5 damage a second inside it"
# Boss aspect effect (subject = the boss's heavy blows): altar hover line; sentence in compendium/altar window. $1 = metres thrown (20).
ecr_aspect_does_brutal: "its heavy blows throw the players they hit $1 m away; a block that holds or a parry keeps you on your feet, and the landing never hurts"
# Boss aspect effect: altar hover line; sentence in compendium/altar window. $1 = seconds (15), used twice; 'it' = the boss.
ecr_aspect_does_echoing: "$1 seconds into the fight a white ghost of it rises and does everything it did $1 seconds before, blows and throws included, until it dies"
# What an aspect does as a sentence of its own ($1 already starts with a capital)
# Wraps a boss aspect's effect line as a full sentence (compendium Boss aspects page, altar window). $1 = the effect text, already capitalised.
ecr_aspect_sentence: "$1."
# Phantom splits at no health marks at all ("at no health splits off ...")
# Phantom aspect: fills $1 of its effect line when it never splits ("at no health splits off ..."). Only when the rule file sets no split marks. Rare.
ecr_aspect_marks_none: "no"

# Fixated: the chat line when its mark lands ($1 the boss, $2 a player)
# Fixated boss: red chat line to nearby players when the mark lands on another player. $1 = the boss's name (Bonemass), $2 = a player's name.
ecr_aspect_fixates_on: "$1 fixes on $2!"
# Fixated boss: red chat line to the marked player when the mark lands on them. $1 = the boss's name (Bonemass).
ecr_aspect_fixates_you: "$1 fixes on you!"
# Fixated boss: stands in for the player's name ($2 of ecr_aspect_fixates_on) when the marked player has left the game. Rare.
ecr_aspect_fixated_gone: "a player who has left"

# Boss altar: the bowl's hover lines
# Boss altar hover: action after the key prompt, "[E] Choose the fight"; opens the altar window. Imperative, like a button label.
ecr_altar_choose: "Choose the fight"
# Boss altar hover: the boss's stars. $1 = star symbols (★★) or "none".
ecr_altar_stars_line: "Stars: $1"
# Boss altar hover: $1 of "Stars: $1" when the boss has no stars; also the 0-star row in the compendium boss stars table. Means no stars.
ecr_altar_stars_none: "none"
# Boss altar hover and altar window heading: the current or chosen aspect. $1 = an aspect name (Enraged, none) or "Random" in the window.
ecr_altar_aspect_line: "Aspect: $1"
# Boss altar hover: grey mark after the Stars or Aspect line when a player picked it in the altar window (not rolled). Past participle, in brackets.
ecr_altar_chosen: "(chosen)"
# Boss altar hover: grey note after the Aspect line, what the aspects multiply the loot by. $1 = multiplier (1.4).
ecr_altar_loot_paren: "(loot x$1)"
# Boss altar hover, Bountiful only: one line per extra aspect. $1 = "+ " and the aspect name (+ Enraged), $2 = its lower-case effect line.
ecr_altar_extra_line: "$1: $2"
# Boss altar hover: grey line at the moment the altar re-rolls its stars and aspect (countdown at zero).
ecr_altar_shifting: "Shifting..."
# Boss altar hover: grey countdown until the altar re-rolls its stars and aspect. $1 = minutes:seconds (0:15).
ecr_altar_shifts_in: "Shifts in $1"
