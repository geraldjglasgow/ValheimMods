# Compendium, Mutations page: heading above a comma list of the mutation names switched off on this server. Heading alone.
ecr_book_mutations_off: "Off on this server"

# Compendium: what each mutation does (a $n that names a mutation is that mutation's own name)
# Compendium, Mutations page: Mad's description under its name. $1 = move speed gain (60%), $2 = attack speed gain (50%), $3 = health lost (50%); % included.
ecr_book_mut_mad: "Moves $1 faster and attacks $2 faster, with $3 less health. Never on bats."
# Compendium, Mutations page: Bloated's description. $1 = health multiplier (2), $2 = a duration with its unit (1.5 seconds), $3 = damage (40), $4 = metres (4).
ecr_book_mut_bloated: "$1 times its usual health. $2 after it dies it explodes: $3 damage within $4 m, more for each star."
# Compendium, Mutations page: Cloaked's description. $1 = metres (10), $2 = this mutation's own name (Cloaked), used as an adjective after 'are never'.
ecr_book_mut_cloaked: "Invisible until you are within $1 m. Drakes, bats, gjall and deathsquitos are never $2."
# Compendium, Mutations page: Splintering's description. $1 = a percent number (60), $2 = this mutation's own name (Splintering), as an adjective.
ecr_book_mut_splintering: "Splits into weaker copies when killed, each dealing $1% of its damage, and they can split again. Oozers are never $2."
# Compendium, Mutations page: Leeching's description. $1 = percent (0.5), $2 = health points (20), $3 = a duration with unit (5 seconds), $4 = percent (10).
ecr_book_mut_leeching: "Regenerates $1% of its health a second (at most $2 a second) once $3 pass without a hit, and heals $4% of the damage it deals."
# Compendium, Mutations page: Warding's description. $1 = percent of each hit reflected (30), $2 = percent of max health (7.5).
ecr_book_mut_warding: "Reflects $1% of each hit back at you and knocks you back, never more than $2% of your maximum health in any second."
# Compendium, Mutations page: Plated's description. $1 = percent of damage shrugged off (40), $2 = percent harder hits (60).
ecr_book_mut_plated: "Shrugs off $1% of the damage it takes at full health, less as it is hurt, and hits up to $2% harder as that armour goes."
# Compendium, Mutations page: Miasmic's description. $1 = metres (4), $2 = a duration with its unit (6 seconds).
ecr_book_mut_miasmic: "Leaves poison clouds behind it, $1 m wide, each lasting $2. They poison players, never creatures."
# Compendium, Mutations page: Devouring's description. $1 = percent (50), $2 = percent (25), $3 = number of meals (1), $4 = a duration with unit (60 seconds).
ecr_book_mut_devouring: "Kills smaller creatures in one bite and keeps $1% of their health and $2% of their damage, slowing as it grows: one meal per star in its life (at least $3), one every $4, never a boss or a large creature. Once it is big enough it hunts players too. Its nameplate shows what it ate."
# Compendium, Mutations page: Thieving's description. $1 = number of items (1).
ecr_book_mut_thieving: "Steals an item with each melee hit that lands, up to one per star (at least $1), and carries them on its nameplate. Kill it to get everything back."
# Compendium, Mutations page: Gilded's description. $1 = metres (30), $2 = loot multiplier (3), $3 = a count (20), $4 = an item's name in lower case (coins).
ecr_book_mut_gilded: "Glitters gold, never attacks a player and runs from any within $1 m. Drops $2 times its loot plus $3 $4, more for each star. Never on large creatures."
# Compendium, Mutations page: Blinking's description. $1 = a duration with unit (30 seconds), $2 = metres (4), $3 = health lost (25%, % included).
ecr_book_mut_blinking: "Every $1 of a fight it reappears $2 m behind its target, after a flash and a chime at the spot. $3 less health."
# Compendium, Mutations page: Blinking's description instead, when the server turns its blinks off. $1 = health lost (25%, % included). Rare.
ecr_book_mut_blinking_never: "$1 less health. It never blinks on this server."
# Compendium, Mutations page: Relentless's description. $1 = metres (150).
ecr_book_mut_relentless: "Once it picks you it keeps coming, seen or not, until you are $1 m away; sneaking does not hide you. Never faster than its usual speed, never on large creatures."
# Compendium, Mutations page: Juggernaut's description, no $n. 'Unstoppable' is the word shown over the creature (ecr_display_unstoppable): same word.
ecr_book_mut_juggernaut: "Never staggers or is knocked back: hits, parries, blasts and traps don't stop it. \"Unstoppable\" shows over it instead."
# Compendium, Mutations page: Screecher's description. $1 = percent (15), $2 = metres (20), $3 = a duration (4 seconds), $4 = a duration (15 seconds).
ecr_book_mut_screecher: "When one hit takes $1% of its health it shrieks: players within $2 m are deafened for $3, and Elemental and Blood Magic weapons will not cast. At most once every $4; a killing blow makes no shriek."
# Compendium, Mutations page: Frostbound's description. $1 = metres (6), $2 = percent (50), $3 = a whole sentence (ecr_book_mut_frostbound_ice or _no_ice).
ecr_book_mut_frostbound: "Players within $1 m recover stamina $2% slower (\"Chilled\"). $3 Frost heals it instead of hurting it."
# Compendium, Mutations page: the sentence put in $3 of Frostbound's description when it lays ice. $1 = percent (15), $2 = a duration with unit (10 seconds).
ecr_book_mut_frostbound_ice: "Leaves slick ice where it walks: on it you slide and move $1% slower; each patch lasts $2."
# Compendium, Mutations page: the sentence put in $3 of Frostbound's description when the server turns its ice trail off. Rare.
ecr_book_mut_frostbound_no_ice: "It lays no ice on this server."
# Compendium, Mutations page: Mudbound's description. $1 = percent (40), $2 = a duration with unit (1 second), $3 = a duration (10 seconds).
ecr_book_mut_mudbound: "Leaves thick mud where it walks: in it you move $1% slower, and for $2 after stepping out. Each patch lasts $3."
# Compendium, Mutations page: Mudbound's whole description instead, when the server turns its mud trail off. Rare.
ecr_book_mut_mudbound_none: "It lays no mud on this server."
# Compendium, Mutations page: Corrodent's description. $1 = a multiplier, how many times as fast (3), $2 = percent of the piece's maximum durability each hit takes on top (4).
ecr_book_mut_corrodent: "Your armour loses durability $1 times as fast under its hits, and each hit that gets through takes another $2% of the piece's maximum. Shields wear as usual."
# Compendium, Mutations page: Cloning's description when the server gives the decoy no time limit. $1 = metres (12), $2 = a sentence (cloning_once/_times). Rare.
ecr_book_mut_cloning: "When it squares up to you within $1 m it leaves a harmless decoy in its place and fights on unseen. Its first blow that lands shows it, so does killing the decoy. $2"
# Compendium, Mutations page: Cloning's usual description. $1 = metres (12), $2 = a duration with unit (20 seconds), $3 = a sentence (cloning_once/_times).
ecr_book_mut_cloning_late: "When it squares up to you within $1 m it leaves a harmless decoy in its place and fights on unseen. Its first blow that lands shows it, so does killing the decoy, and after $2 it shows itself anyway. $3"
# Compendium, Mutations page: sentence that ends Cloning's description when it does it once in its life (the default).
ecr_book_mut_cloning_once: "Once in its life."
# Compendium, Mutations page: sentence that ends Cloning's description when it does it more than once. $1 = number of times (2).
ecr_book_mut_cloning_times: "$1 times in its life."
# Compendium, Mutations page: Piercing's description, only if the server switches it on (off by default). $1 = percent of armour ignored (15).
ecr_book_mut_piercing: "Its hits ignore $1% of your armour."
# Compendium, Mutations page: Howling's description, if switched on (off by default). $1 = creatures (4), $2 = metres (30), $3 = a duration (45 seconds).
ecr_book_mut_howling: "When it turns on you it howls, and the $1 nearest creatures on its side within $2 m come for you; again every $3 while it fights you. Never calls a boss."
# Compendium, Mutations page: Binding's description, if on (off by default). $1 = metres (3), $2-$4 = durations (10 seconds, 1 second, 3 seconds).
ecr_book_mut_binding: "Leaves patches of tangled roots where it walks, one every $1 m, each lasting $2. Step into one and the roots hold you for $3 (\"Rooted\": you can still turn, block and strike), then let you go for $4."
# Compendium, Mutations page: Flamebound's description. $1 = a duration with its unit (7 seconds), $2 = fire damage a second (6).
ecr_book_mut_flamebound: "Leaves burning ground where it walks, each patch lasting $1. Standing in it sets you on fire: $2 fire damage a second, more with stars. Fire resistance and being wet help; armour does not."

