# Compendium, World difficulty page: paragraph under the 'What it means' heading when the server uses a preset difficulty (not Custom). \n = line break.
ecr_book_meaning_preset: "The difficulty decides how many stars and mutations creatures get as the world's bosses fall. The biome you're entering is the gentlest. A biome you've cleared gets harder with every boss killed after it, so by the end of the game the Meadows is the hardest place. Biomes you haven't reached match the one you're entering.\nUnder the most stars allowed, most creatures are plain and each extra star is rarer than the one before. Each star a creature has adds a quarter to its chance of a mutation."
# Compendium, World difficulty page: heading above the table of biomes. $1 = the current world tier number (2).
ecr_book_biomes: "Each biome at world tier $1"
# Compendium, World difficulty page: column heading of the biome table; the cells below are biome names. A noun alone, short.
ecr_book_col_biome: "Biome"
# Compendium, World difficulty page: column heading; cells are a number, the most stars a creature can have in that biome (4). Short label, narrow column.
ecr_book_col_most_stars: "Most stars"
# Compendium, World difficulty page: column heading; cells are the percent of creatures that have any star (27%). Short label, narrow column.
ecr_book_col_with_stars: "With stars"
# Compendium, World difficulty page: column heading; cells are the percent of creatures with no stars that carry a mutation (10%). Adjective, short.
ecr_book_col_mutated: "Mutated"
# Compendium, World difficulty page: grey note under the biome table. 'Mutated' is the column heading ecr_book_col_mutated: use the same word.
ecr_book_biomes_note: "Your biome is in orange. Mutated: creatures with no stars that carry a mutation."
# Compendium, World difficulty page: heading above the list of the five difficulties (Easy to Extreme), one line each. Heading alone.
ecr_book_ladder: "The difficulties"
# Compendium, World difficulty page: one line of the difficulty list. $1 = the difficulty's name (Easy), $2 = its description (ecr_book_ladder_easy etc.).
ecr_book_ladder_line: "$1: $2"
# Compendium, difficulty list: Easy's description, after 'Easy: ' (lower-case phrase): stars per biome and how they climb; share of creatures mutated.
ecr_book_ladder_easy: "1 star where you're entering, one more for every boss killed after a biome, up to 4; 10% mutated, rising to 35% as bosses fall after a biome"
# Compendium, difficulty list: Medium's description after 'Medium: ', shortened from Easy's pattern (stars where you enter, up to 5; mutated share rising).
ecr_book_ladder_medium: "2 stars, up to 5; 25% mutated, rising to 55%"
# Compendium, difficulty list: Hard's description after 'Hard: ', shortened from Easy's pattern (stars where you enter, up to 5; mutated share rising).
ecr_book_ladder_hard: "3 stars, up to 5; 30% mutated, rising to 65%"
# Compendium, difficulty list: Very Hard's description after 'Very Hard: '. $1 = the Hard difficulty's name (Hard), $2 = the Extreme difficulty's name (Extreme).
ecr_book_ladder_veryhard: "4 stars, up to 5; mutations halfway between $1 and $2"
# Compendium, difficulty list: Extreme's description after 'Extreme: ' (lower-case phrase, same pattern as Easy's).
ecr_book_ladder_extreme: "5 stars in every biome you've reached, 6 to 8 as more bosses fall; 45% mutated, rising to 98%"
# Compendium, World difficulty page: line under the difficulty list, only when the server uses Custom. $1 = the Custom difficulty's name (Custom).
ecr_book_ladder_custom: "$1: the server's own chances for each biome, raised by each world tier."
# Compendium, World difficulty page: grey note under the difficulty list (preset difficulties), explaining 'stars' and 'mutated' in those lines.
ecr_book_ladder_note: "Stars: the most a creature can have. Mutated: creatures with no stars that carry one."
# Compendium, World difficulty page: heading for the game's own world difficulty setting (the world modifiers' damage rates). Heading alone.
ecr_book_game: "The game's own World Difficulty"
# Compendium, World difficulty page: text under that heading. $1 = percent of normal damage enemies deal (100), $2 = percent the player deals (100).
ecr_book_game_rates: "Separate from all this, and it stacks: on this world enemies deal $1% of their normal damage and you deal $2% of yours."
# Compendium, World difficulty page: sentence right after ecr_book_game_rates when Elite Creatures gives the stars. 'Its' = the game's World Difficulty.
