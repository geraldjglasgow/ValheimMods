# Compendium, Boss aspects page: opening paragraph, above the list of aspects (each one's name, then what it does).
ecr_book_aspects_intro: "Boss được triệu hồi ở bệ thờ có thể mang một đặc tính: một biến tấu cho trận đấu, ghi sau tên của boss. Bệ thờ hiển thị nó trước khi bạn triệu hồi, và thỉnh thoảng nó lại thay đổi. Đặc tính khiến trận đấu khó hơn và đồ rơi giàu hơn."
# Compendium, Boss aspects page: grey tag after an aspect's name ('Enraged loot x1.2') when its loot is not x1. $1 = the multiplier (1.2). Lower-case noun.
