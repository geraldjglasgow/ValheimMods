# Boss aspects: what each does. Lower case and no full stop: the altar shows it on the line under the aspect's name,
# the compendium and the altar window give it a capital and ecr_aspect_sentence.
ecr_aspect_does_none: "trận chiến như mặc định của trò chơi"
ecr_aspect_does_reflective: "$1% mỗi đòn đánh bạn gây ra cho nó sẽ phản lại bạn"
