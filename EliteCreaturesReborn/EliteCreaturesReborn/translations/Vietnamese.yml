ecr_aspect_does_elementalist: "gây thêm $1% sát thương nguyên tố"
ecr_aspect_does_enraged: "gây thêm $1% sát thương vật lý"
ecr_aspect_does_twin: "xuất hiện thành hai thể chia sẻ chung một bể máu, mỗi thể chịu giảm $1% máu và $2% sát thương"
ecr_aspect_does_phantom: "khi còn $1 máu sẽ tách ra các bản sao ảo ảnh, $2 bản sao cho mỗi người chơi trực tuyến, với $3 máu và giảm $4% sát thương"
ecr_aspect_does_adaptive: "chịu ít hơn $1% loại sát thương gây ra cho nó nhiều nhất trong $2 giây qua"
ecr_aspect_does_fixated: "đánh dấu một người chơi và đánh họ mạnh hơn $1%, những người khác nhẹ hơn $2%; dấu ấn chuyển sang người gây sát thương nhiều nhất mỗi $3 giây"
ecr_aspect_does_stormbound: "mỗi $1 giây gọi sét xuống một vòng tròn dưới chân mỗi người chơi, $2 giây sau khi vòng tròn xuất hiện"
ecr_aspect_does_gravitic: "mỗi $1 giây kéo mọi người chơi trong bán kính $2 m về phía nó, sau đó nện xuống: $3% máu tối đa cho người chơi trong bán kính $4 m"
ecr_aspect_does_colossal: "to hơn $1%, thêm $2% máu, chậm hơn $3%; các đòn đánh nặng tạo ra sóng xung kích $4 m làm ngã người chơi (lăn né hoặc nhảy qua)"
ecr_aspect_does_tethered: "xuất hiện thành hai thể liên kết với nhau, mỗi thể giảm $1% máu; mức chênh lệch máu giữa hai thể càng lớn, cả hai tấn công càng nhanh (lên đến $2%) và thể yếu hơn chịu ít sát thương hơn (lên đến $3%)"
ecr_aspect_does_bountiful: "mang thêm $1 thuộc tính cùng lúc"
ecr_aspect_does_portalbound: "ném đòn qua các cổng dịch chuyển (Elder dùng rễ cây, Bonemass dùng chất nhầy): một cổng mở ra ở tay nó, cổng còn lại mở ra đâu đó phía trên bạn"
ecr_aspect_does_nightfall: "biến bầu trời thành đêm bão bùng trong bán kính $1 m xung quanh nó; mỗi $2-$3 giây một lốc xoáy nổi lên cạnh mỗi người chơi ở đó và đuổi theo họ trong $4 giây: gây $5 sát thương mỗi giây bên trong lốc"
ecr_aspect_does_brutal: "các đòn đánh nặng văng người chơi bị trúng ra xa $1 m; đỡ đòn thành công hoặc đỡ đòn chuẩn xác (parry) sẽ giúp bạn đứng vững, và khi rơi xuống không bao giờ bị thương"
ecr_aspect_does_echoing: "$1 giây sau khi bắt đầu trận chiến, một bóng ma màu trắng của nó nổi lên và làm lại mọi thứ nó đã làm $1 giây trước, bao gồm cả các đòn đánh và ném, cho đến khi nó chết"
