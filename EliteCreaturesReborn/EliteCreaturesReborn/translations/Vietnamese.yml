ecr_book_mut_cloaked: "Vô hình cho đến khi bạn ở trong phạm vi $1 m. Drake, dơi, gjall và muỗi tử thần không bao giờ bị $2."
# Compendium, Mutations page: Splintering's description. $1 = a percent number (60), $2 = this mutation's own name (Splintering), as an adjective.
ecr_book_mut_splintering: "Khi bị giết sẽ tách thành các bản sao yếu hơn, mỗi bản gây $1% sát thương của nó, và các bản sao có thể tách tiếp. Oozer không bao giờ bị $2."
# Compendium, Mutations page: Leeching's description. $1 = percent (0.5), $2 = health points (20), $3 = a duration with unit (5 seconds), $4 = percent (10).
ecr_book_mut_leeching: "Hồi $1% máu mỗi giây (tối đa $2 mỗi giây) khi $3 trôi qua mà không trúng đòn, và hồi $4% sát thương nó gây ra."
# Compendium, Mutations page: Warding's description. $1 = percent of each hit reflected (30), $2 = percent of max health (7.5).
ecr_book_mut_warding: "Dội lại $1% mỗi đòn đánh vào bạn và đẩy lùi bạn, không bao giờ quá $2% máu tối đa của bạn trong mỗi giây."
# Compendium, Mutations page: Plated's description. $1 = percent of damage shrugged off (40), $2 = percent harder hits (60).
ecr_book_mut_plated: "Bỏ qua $1% sát thương nhận vào khi đầy máu, giảm dần khi bị thương, và đánh mạnh hơn tối đa $2% khi lớp giáp đó mất dần."
# Compendium, Mutations page: Miasmic's description. $1 = metres (4), $2 = a duration with its unit (6 seconds).
ecr_book_mut_miasmic: "Để lại những đám khí độc phía sau, rộng $1 m, mỗi đám kéo dài $2. Chúng gây độc cho người chơi, không bao giờ cho sinh vật."
# Compendium, Mutations page: Devouring's description. $1 = percent (50), $2 = percent (25), $3 = number of meals (1), $4 = a duration with unit (60 seconds).
ecr_book_mut_devouring: "Giết sinh vật nhỏ hơn chỉ bằng một miếng cắn và giữ lại $1% máu cùng $2% sát thương của chúng, chậm dần khi lớn lên: mỗi sao một bữa trong đời (ít nhất $3), mỗi bữa cách nhau $4, không bao giờ ăn boss hay sinh vật lớn. Khi đủ lớn nó săn cả người chơi. Bảng tên của nó hiện những gì nó đã ăn."
# Compendium, Mutations page: Thieving's description. $1 = number of items (1).
ecr_book_mut_thieving: "Trộm một vật phẩm với mỗi đòn cận chiến đánh trúng, tối đa một món mỗi sao (ít nhất $1), và mang chúng trên bảng tên. Giết nó để lấy lại tất cả."
# Compendium, Mutations page: Gilded's description. $1 = metres (30), $2 = loot multiplier (3), $3 = a count (20), $4 = an item's name in lower case (coins).
ecr_book_mut_gilded: "Lấp lánh ánh vàng, không bao giờ tấn công người chơi và bỏ chạy khỏi bất kỳ ai trong phạm vi $1 m. Rơi đồ gấp $2 lần cộng thêm $3 $4, nhiều hơn theo mỗi sao. Không bao giờ có ở sinh vật lớn."
# Compendium, Mutations page: Blinking's description. $1 = a duration with unit (30 seconds), $2 = metres (4), $3 = health lost (25%, % included).
ecr_book_mut_blinking: "Cứ mỗi $1 trong trận đấu nó lại hiện ra cách $2 m phía sau mục tiêu, sau một tia sáng và tiếng chuông ở chỗ đó. Ít hơn $3 máu."
# Compendium, Mutations page: Blinking's description instead, when the server turns its blinks off. $1 = health lost (25%, % included). Rare.
ecr_book_mut_blinking_never: "Ít hơn $1 máu. Nó không bao giờ dịch chuyển trên máy chủ này."
# Compendium, Mutations page: Relentless's description. $1 = metres (150).
ecr_book_mut_relentless: "Một khi đã chọn bạn, nó cứ đuổi theo, dù thấy bạn hay không, cho đến khi bạn cách xa $1 m; lén lút không giúp bạn ẩn nấp. Không bao giờ nhanh hơn tốc độ bình thường của nó, không bao giờ có ở sinh vật lớn."
# Compendium, Mutations page: Juggernaut's description, no $n. 'Unstoppable' is the word shown over the creature (ecr_display_unstoppable): same word.
ecr_book_mut_juggernaut: "Không bao giờ bị choáng hay bị đẩy lùi: đòn đánh, đỡ phản, vụ nổ và bẫy đều không cản được nó. Thay vào đó chữ \"Không thể cản\" hiện trên đầu nó."
# Compendium, Mutations page: Screecher's description. $1 = percent (15), $2 = metres (20), $3 = a duration (4 seconds), $4 = a duration (15 seconds).
ecr_book_mut_screecher: "Khi một đòn lấy đi $1% máu của nó, nó sẽ rít lên: người chơi trong phạm vi $2 m bị ù tai trong $3, và vũ khí Nguyên tố và Huyết thuật không thể thi triển phép. Tối đa một lần mỗi $4; đòn kết liễu không gây tiếng rít."
# Compendium, Mutations page: Frostbound's description. $1 = metres (6), $2 = percent (50), $3 = a whole sentence (ecr_book_mut_frostbound_ice or _no_ice).
ecr_book_mut_frostbound: "Người chơi trong phạm vi $1 m hồi thể lực chậm hơn $2% (\"Lạnh cóng\"). $3 Sát thương băng hồi máu cho nó thay vì gây hại."
# Compendium, Mutations page: the sentence put in $3 of Frostbound's description when it lays ice. $1 = percent (15), $2 = a duration with unit (10 seconds).
ecr_book_mut_frostbound_ice: "Để lại băng trơn nơi nó đi qua: trên đó bạn bị trượt và di chuyển chậm hơn $1%; mỗi mảng kéo dài $2."
# Compendium, Mutations page: the sentence put in $3 of Frostbound's description when the server turns its ice trail off. Rare.
ecr_book_mut_frostbound_no_ice: "Nó không tạo băng trên máy chủ này."
# Compendium, Mutations page: Mudbound's description. $1 = percent (40), $2 = a duration with unit (1 second), $3 = a duration (10 seconds).
ecr_book_mut_mudbound: "Để lại bùn dày nơi nó đi qua: trong bùn bạn di chuyển chậm hơn $1%, và thêm $2 sau khi bước ra. Mỗi mảng kéo dài $3."
# Compendium, Mutations page: Mudbound's whole description instead, when the server turns its mud trail off. Rare.
ecr_book_mut_mudbound_none: "Nó không tạo bùn trên máy chủ này."
# Compendium, Mutations page: Corrodent's description. $1 = a multiplier, how many times as fast (3), $2 = percent of the piece's maximum durability each hit takes on top (4).
ecr_book_mut_corrodent: "Giáp của bạn mất độ bền nhanh gấp $1 lần khi trúng đòn của nó, và mỗi đòn xuyên qua lấy thêm $2% độ bền tối đa của món đó. Khiên mòn như bình thường."
# Compendium, Mutations page: Cloning's description when the server gives the decoy no time limit. $1 = metres (12), $2 = a sentence (cloning_once/_times). Rare.
ecr_book_mut_cloning: "Khi đối mặt với bạn trong phạm vi $1 m, nó để lại một hình nhân vô hại tại chỗ và tiếp tục chiến đấu trong vô hình. Đòn đầu tiên nó đánh trúng sẽ làm lộ nó, giết hình nhân cũng vậy. $2"
# Compendium, Mutations page: Cloning's usual description. $1 = metres (12), $2 = a duration with unit (20 seconds), $3 = a sentence (cloning_once/_times).
ecr_book_mut_cloning_late: "Khi đối mặt với bạn trong phạm vi $1 m, nó để lại một hình nhân vô hại tại chỗ và tiếp tục chiến đấu trong vô hình. Đòn đầu tiên nó đánh trúng sẽ làm lộ nó, giết hình nhân cũng vậy, và sau $2 nó cũng tự lộ diện. $3"
# Compendium, Mutations page: sentence that ends Cloning's description when it does it once in its life (the default).
ecr_book_mut_cloning_once: "Một lần trong đời."
# Compendium, Mutations page: sentence that ends Cloning's description when it does it more than once. $1 = number of times (2).
ecr_book_mut_cloning_times: "$1 lần trong đời."
# Compendium, Mutations page: Piercing's description, only if the server switches it on (off by default). $1 = percent of armour ignored (15).
ecr_book_mut_piercing: "Đòn đánh của nó bỏ qua $1% giáp của bạn."
# Compendium, Mutations page: Howling's description, if switched on (off by default). $1 = creatures (4), $2 = metres (30), $3 = a duration (45 seconds).
ecr_book_mut_howling: "Khi nhắm vào bạn, nó hú lên, và $1 sinh vật cùng phe gần nhất trong phạm vi $2 m sẽ lao đến bạn; lặp lại mỗi $3 khi nó còn đánh bạn. Không bao giờ gọi boss."
# Compendium, Mutations page: Binding's description, if on (off by default). $1 = metres (3), $2-$4 = durations (10 seconds, 1 second, 3 seconds).
ecr_book_mut_binding: "Để lại những mảng rễ cây chằng chịt nơi nó đi qua, mỗi $1 m một mảng, mỗi mảng kéo dài $2. Bước vào một mảng thì rễ giữ bạn trong $3 (\"Bị trói chân\": bạn vẫn có thể xoay người, đỡ đòn và tấn công), rồi thả bạn ra trong $4."
# Compendium, Mutations page: Flamebound's description. $1 = a duration with its unit (7 seconds), $2 = fire damage a second (6).
ecr_book_mut_flamebound: "Để lại mặt đất bốc cháy nơi nó đi qua, mỗi mảng kéo dài $1. Đứng trong đó sẽ bị bắt lửa: $2 sát thương lửa mỗi giây, nhiều hơn theo sao. Kháng lửa và bị ướt giúp ích; giáp thì không."

# Compendium: Boss aspects page
# Compendium: title of the mod's Boss aspects page in the compendium's list of topics, like the other 'Elite:' pages.
