ecr_book_boss_stars_again: "Mỗi lần trùm bị tiêu diệt, trận chiến tiếp theo của nó sẽ nghiêng về nhiều sao hơn."

# Compendium: Mutations page ($1 in the intro is the Gilded mutation's name)
ecr_book_mutations_topic: "Elite: Các đột biến"
ecr_book_mutations_intro: "Một sinh vật đột biến mang tên của đột biến trước tên của nó, và các sao của nó có màu của đột biến, màu của sao trước mỗi tên bên dưới. $1 là hiếm nhất và là đột biến duy nhất có lợi cho bạn."
ecr_book_mutations_numbers: "Chỉ số cho một sinh vật không có sao ở $1, nơi bạn đang ở."
ecr_book_mutations_large: "Đột biến trên một sao lớn sẽ mạnh hơn: những gì nó nhận được là x$1."
ecr_book_mutations_off: "Đã tắt trên máy chủ này"

# Compendium: what each mutation does (a $n that names a mutation is that mutation's own name)
ecr_book_mut_mad: "Di chuyển nhanh hơn $1 và tấn công nhanh hơn $2, nhưng chịu ít hơn $3 máu. Không bao giờ xuất hiện trên dơi."
ecr_book_mut_bloated: "Máu gấp $1 lần bình thường. $2 sau khi chết nó sẽ phát nổ: gây $3 sát thương trong bán kính $4 m, nhiều hơn theo từng sao."
ecr_book_mut_cloaked: "Tàng hình cho đến khi bạn ở trong bán kính $1 m. Drake, dơi, gjall và muỗi sát thủ không bao giờ bị $2."
ecr_book_mut_splintering: "Tách thành các bản sao yếu hơn khi bị tiêu diệt, mỗi bản sao gây $1% sát thương của nó, và chúng có thể tiếp tục phân tách. Oozer không bao giờ bị $2."
ecr_book_mut_leeching: "Hồi phục $1% máu mỗi giây (tối đa $2 mỗi giây) sau khi trôi qua $3 không bị trúng đòn, và hồi máu bằng $4% sát thương nó gây ra."
ecr_book_mut_warding: "Phản lại $1% mỗi đòn đánh về phía bạn và đẩy lùi bạn, không bao giờ vượt quá $2% máu tối đa của bạn trong bất kỳ giây nào."
ecr_book_mut_plated: "Bỏ qua $1% sát thương nhận vào khi đầy máu, giảm dần khi bị thương, và đánh mạnh hơn lên đến $2% khi lớp giáp đó mất đi."
ecr_book_mut_miasmic: "Để lại các đám mây độc đằng sau, rộng $1 m, mỗi đám tồn tại $2. Chúng làm độc người chơi, không bao giờ tác động đến sinh vật."
ecr_book_mut_devouring: "Tiêu diệt các sinh vật nhỏ hơn trong một vết cắn và giữ lại $1% máu cùng $2% sát thương của chúng, chậm dần khi lớn lên: một bữa ăn cho mỗi sao trong đời nó (ít nhất $3), một bữa ăn mỗi $4, không bao giờ nuốt trùm hoặc sinh vật lớn. Bảng tên của nó hiển thị những gì nó đã ăn."
ecr_book_mut_thieving: "Trộm một vật phẩm với mỗi đòn cận chiến trúng đích, tối đa một vật phẩm mỗi sao (ít nhất $1), và mang chúng trên bảng tên. Tiêu diệt nó để lấy lại mọi thứ."
ecr_book_mut_gilded: "Lấp lánh ánh vàng, không bao giờ tấn công người chơi và bỏ chạy khỏi bất kỳ ai trong bán kính $1 m. Rơi ra $2 lần vật phẩm cùng $3 $4, nhiều hơn theo từng sao. Không bao giờ xuất hiện trên sinh vật khổng lồ."
ecr_book_mut_blinking: "Mỗi $1 trong trận chiến, nó xuất hiện lại $2 m phía sau mục tiêu, sau một luồng sáng và tiếng chuông tại điểm đó. Chịu ít hơn $3 máu."
ecr_book_mut_blinking_never: "Chịu ít hơn $1 máu. Nó không bao giờ tốc biến trên máy chủ này."
ecr_book_mut_relentless: "Một khi đã nhắm vào bạn, nó sẽ tiếp tục lao tới, dù nhìn thấy hay không, cho đến khi bạn ở cách xa $1 m; lén lút không thể giấu bạn. Không bao giờ di chuyển nhanh hơn tốc độ bình thường, không bao giờ xuất hiện trên sinh vật khổng lồ."
ecr_book_mut_juggernaut: "Không bao giờ bị choáng hoặc bị đẩy lùi: đòn đánh, đỡ đòn chuẩn xác, vụ nổ và bẫy không thể cản nó. Chữ \"Không Thể Cản Phá\" sẽ hiển thị trên đầu nó."
ecr_book_mut_screecher: "Khi một đòn đánh lấy đi $1% máu của nó, nó sẽ rú lên: người chơi trong bán kính $2 m bị điếc trong $3, và vũ khí Phép Thuật Nguyên Tố và Phép Thuật Máu sẽ không thể thi triển. Tối đa một lần mỗi $4; đòn kết liễu không tạo ra tiếng rú."
ecr_book_mut_frostbound: "Người chơi trong bán kính $1 m hồi phục thể lực chậm hơn $2% (\"Lạnh Giá\"). Sát thương Băng $3 sẽ hồi máu cho nó thay vì làm nó bị thương."
ecr_book_mut_frostbound_ice: "Để lại băng trơn nơi nó đi qua: đứng trên đó bạn bị trượt và di chuyển chậm hơn $1%; mỗi mảng tồn tại $2."
ecr_book_mut_frostbound_no_ice: "Nó không tạo băng trên máy chủ này."
ecr_book_mut_mudbound: "Để lại bùn dày nơi nó đi qua: đứng trong đó bạn di chuyển chậm hơn $1%, và duy trì $2 sau khi bước ra ngoài. Mỗi mảng tồn tại $3."
ecr_book_mut_mudbound_none: "Nó không tạo bùn trên máy chủ này."
ecr_book_mut_corrodent: "Trang bị giáp của bạn giảm độ bền nhanh gấp $1 lần dưới các đòn đánh của nó. Khiên giảm độ bền như bình thường."
ecr_book_mut_cloning: "Khi nó đối đầu với bạn trong bán kính $1 m, nó để lại một hình nhân thế thân vô hại tại chỗ và tiếp tục chiến đấu tàng hình. Đòn đánh đầu tiên trúng đích sẽ làm lộ diện nó, tiêu diệt hình nhân thế thân cũng vậy. $2"
ecr_book_mut_cloning_late: "Khi nó đối đầu với bạn trong bán kính $1 m, nó để lại một hình nhân thế thân vô hại tại chỗ và tiếp tục chiến đấu tàng hình. Đòn đánh đầu tiên trúng đích sẽ làm lộ diện nó, tiêu diệt hình nhân thế thân cũng vậy, và sau $2 nó cũng sẽ tự hiện hình. $3"
ecr_book_mut_cloning_once: "Một lần trong đời."
ecr_book_mut_cloning_times: "$1 lần trong đời."
ecr_book_mut_piercing: "Các đòn đánh của nó bỏ qua $1% giáp của bạn."
ecr_book_mut_howling: "Khi nó quay sang bạn, nó gầm hú, và $1 sinh vật đồng minh gần nhất trong bán kính $2 m sẽ lao đến chỗ bạn; lặp lại mỗi $3 khi nó chiến đấu với bạn. Không bao giờ gọi trùm."
ecr_book_mut_binding: "Để lại các mảng rễ cây chằng chịt nơi nó đi qua, một mảng mỗi $1 m, mỗi mảng tồn tại $2. Bước vào đó và rễ cây sẽ giữ bạn lại trong $3 (\"Bị Trói Rễ\": bạn vẫn có thể xoay người, đỡ đòn và đánh), sau đó thả bạn ra trong $4."
ecr_book_mut_flamebound: "Để lại mặt đất rực cháy nơi nó đi qua, mỗi mảng tồn tại $1. Đứng trong đó khiến bạn bị bốc cháy: $2 sát thương lửa mỗi giây, nhiều hơn theo từng sao. Kháng lửa và bị ướt sẽ giúp giảm sát thương; giáp không có tác dụng."

