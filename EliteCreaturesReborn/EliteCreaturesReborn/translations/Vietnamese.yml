# Compendium, Rendering Table page: the first orange heading, alone on its line, above how a trophy renders. A heading, not a question.
ecr_book_render_how: "Cách luyện hóa"
# Compendium, Rendering Table page: paragraph under the heading. $1 = least per roll (2), $2 = most per roll (4), $3 = draws from a boss trophy (5).
ecr_book_render_rolls: "Một chiến lợi phẩm cho $1-$2 của một loại quặng hoặc nguyên liệu thuộc vùng đất của nó, rút ngẫu nhiên từ các danh sách bên dưới; bàn có thể chuyển giữa quặng và nguyên liệu. Chiến lợi phẩm boss, dùng lên bàn từ thanh nhanh, cho $3 lần rút như vậy."
# Compendium, Rendering Table page: sentence right after the rolls paragraph, before the per-biome lists.
ecr_book_render_idols: "Chỉ chiến lợi phẩm boss mới tạo ra tượng Lò Rèn: một tượng của vùng đất đó, Chiến Đấu hoặc Bảo Hộ ngẫu nhiên."
# Compendium, Rendering Table page: a line under each biome's heading. $1 = that biome's trophies by the game's names, comma separated.
