# Rendering Table hover in Idols mode, in place of the [E] action line: a boss trophy must be used on it from the hotbar.
ecr_render_idol_hint: "Dùng chiến lợi phẩm boss lên bàn từ thanh nhanh để tạo tượng"
# Rendering Table hover: action after the [Shift + E] key label; switches the mode (Ores, Ingredients, Idols) for everyone.
ecr_render_change: "Đổi thứ nó tạo ra"

# Why the Rendering Table renders nothing
# Rendering Table: hover line and centre message on a table already built after the admin switched the table off in the .cfg. Rare.
ecr_render_off: "Bàn Luyện Hóa đã bị tắt."
# Rendering Table: centre message on pressing E with no ordinary trophy in the inventory (E never takes boss trophies).
ecr_render_none: "Không có chiến lợi phẩm để luyện hóa. Chiến lợi phẩm boss chỉ luyện hóa được từ thanh nhanh."
# Rendering Table, Idols mode: centre message on pressing E, or on using an ordinary (non-boss) trophy on it from the hotbar.
ecr_render_need_boss: "Chỉ chiến lợi phẩm boss mới tạo ra tượng: hãy dùng nó lên bàn từ thanh nhanh."
# Rendering Table: centre message when a trophy that is in none of its biome lists (e.g. another mod's) is used on it from the hotbar. Rare.
ecr_render_unknown: "Bàn Luyện Hóa không thể luyện hóa chiến lợi phẩm này."
# Rendering Table: centre message when none of the items that trophy's biome should give exist in this game. Rare.
ecr_render_nothing_made: "Game này không có thứ gì của vùng đất đó để tạo ra."
