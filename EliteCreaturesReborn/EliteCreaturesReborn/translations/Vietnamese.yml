# Hel's Trial: centre message when every player alive in the arena has voted ready: the break ends and the next wave comes at once.
ecr_arena_all_ready: "Tất cả đã sẵn sàng - lũ người chết đang đến!"
# Hel's Trial: action on Hel's hover after the key, "[E] Call the next wave", during a wave whose creatures are all out. Imperative, button label.
ecr_arena_call_hint: "Gọi đợt tiếp theo"
# Hel's Trial: centre message to the trial's players when someone calls the next wave early at Hel. $1 = that player's name.
ecr_arena_called: "$1 gọi đợt tiếp theo!"
# Hel's Trial: centre message to a player who tried to call the next wave while a boss still lives. $1 = the boss's name (Moder).
ecr_arena_boss_waits: "Hel chờ cho đến khi $1 gục ngã."
# The end and the reward again in the chat window: $1 the trial's name (coloured), $2 the message
# Hel's Trial: a line in the chat window repeating the end and reward messages. $1 = ecr_arena_name (coloured), $2 = the message.
