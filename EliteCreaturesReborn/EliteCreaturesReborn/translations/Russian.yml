ecr_aspect_does_tethered: "появляется в виде двух связанных боссов, у каждого на $1% меньше здоровья; чем сильнее различается их здоровье, тем быстрее они оба атакуют (вплоть до $2%) и тем меньше урона получает более слабый из них (вплоть до $3%)"
ecr_aspect_does_bountiful: "обладает еще $1 дополнительными аспектами одновременно"
ecr_aspect_does_portalbound: "бросает игроков через порталы (Древний — свои лозы, Масса Костей — слизь): один портал открывается у его руки, другой — где-то над вами"
ecr_aspect_does_nightfall: "превращает небо в штормовую полночь в радиусе $1 м от себя; каждые $2-$3 сек. у каждого находящегося там игрока возникает торнадо и преследует его в течение $4 сек., нанося $5 ед. урона в секунду внутри"
ecr_aspect_does_brutal: "его тяжелые удары отбрасывают пораженных игроков на $1 м; выстоять на ногах поможет успешный блок или парирование, а урон от падения после этого отбрасывания не наносится"
ecr_aspect_does_echoing: "через $1 сек. после начала боя появляется его белый призрак, который в точности повторяет все его действия, совершенные $1 сек. назад, включая удары и броски, пока призрак не погибнет"
