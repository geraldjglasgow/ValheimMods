ecr_book_mutations_intro: "Мутировавшее существо носит название своей мутации перед собственным именем, а его звезды окрашиваются в цвет этой мутации — цвет звезды перед каждым именем в списке ниже. Мутация $1 — самая редкая и единственная, которая играет вам на руку."
ecr_book_mutations_numbers: "Параметры для существа без звезд в биоме $1, где вы сейчас находитесь."
ecr_book_mutations_large: "Мутация на большой звезде значительно сильнее: её бонусы умножаются на x$1."
ecr_book_mutations_off: "Отключено на этом сервере"

# Компендиум: что делает каждая мутация
ecr_book_mut_mad: "Двигается на $1 быстрее и атакует на $2 быстрее, но имеет на $3 меньше здоровья. Никогда не встречается у летучих мышей."
ecr_book_mut_bloated: "Имеет в $1 раз больше здоровья, чем обычно. Через $2 после смерти взрывается: $3 ед. урона в радиусе $4 м (урон выше за каждую звезду существа)."
ecr_book_mut_cloaked: "Полностью невидимо, пока вы не приблизитесь на расстояние $1 м. Драконы, летучие мыши, гьялли и смертожалы никогда не бывают замаскированными ($2)."
ecr_book_mut_splintering: "При гибели разделяется на более слабые копии, каждая из которых наносит $1% от его оригинального урона, и они могут разделиться снова. Слизни никогда не бывают разделяющимися ($2)."
ecr_book_mut_leeching: "Восстанавливает $1% своего здоровья в секунду (не более $2 в секунду), если прошло $3 без получения ударов, и исцеляет себя на $4% от нанесенного им урона."
ecr_book_mut_warding: "Отражает $1% каждого нанесенного удара обратно в вас и отбрасывает назад, но не более $2% от вашего максимального запаса здоровья в секунду."
ecr_book_mut_plated: "Игнорирует $1% получаемого урона при полном здоровье (эффект снижается по мере того, как существо ранят) и бьет на $2% сильнее по мере разрушения этой брони."
ecr_book_mut_miasmic: "Оставляет за собой ядовитые облака шириной $1 м, каждое из которых держится $2. Они отравляют только игроков и никогда не вредят монстрам."
ecr_book_mut_devouring: "Убивает более мелких существ одним укусом и навсегда забирает себе $1% от их здоровья и $2% от их урона, замедляясь по мере роста. За всю жизнь может совершить столько трапез, сколько у него звезд (но не менее $3), по одной каждые $4. Никогда не пожирает боссов или крупных существ. Став достаточно большим, начинает охотиться и на игроков. На его панели здоровья отображается то, что оно съело."
ecr_book_mut_thieving: "Крадет один предмет при каждом попадании в ближнем бою, максимум до одного предмета за каждую звезду (но не менее $1). Украденные вещи отображаются на его панели здоровья. Убейте его, чтобы вернуть всё назад."
ecr_book_mut_gilded: "Сверкает золотом, никогда не атакует игрока и убегает от любого, кто приблизится в радиус $1 м. Дает в $2 раза больше своей обычной добычи плюс $3 $4, количество увеличивается за каждую звезду. Никогда не встречается у крупных существ."
ecr_book_mut_blinking: "Каждые $1 боя телепортируется на $2 м за спину своей цели. Перемещению предшествует вспышка и характерный звон на месте появления. Имеет на $3 меньше здоровья."
ecr_book_mut_blinking_never: "Имеет на $1 меньше здоровья. На этом сервере данное существо никогда не телепортируется."
ecr_book_mut_relentless: "Как только оно выбирает вас целью, то продолжит преследование (замечены вы или нет), пока вы не отдалитесь на $1 м; скрытность от него не спасает. Скорость преследования никогда не превышает его обычную скорость. Никогда не встречается у крупных существ."
ecr_book_mut_juggernaut: "Его невозможно ошеломить или отбросить: удары, парирования, взрывы и ловушки не способны его остановить. Вместо этого над ним появляется надпись «Неудержимый»."
ecr_book_mut_screecher: "Когда один точный удар отнимает у него сразу $1% здоровья, оно издает пронзительный визг: игроки в радиусе $2 м оглушаются на $3, а магическое оружие (Стихий и Крови) временно блокирует чтение заклинаний. Срабатывает не чаще одного раза в $4; смертельный удар визг не вызывает."
ecr_book_mut_frostbound: "Игроки в радиусе $1 м восстанавливают выносливость на $2% медленнее (эффект «Озноб»). Урон от мороза ($3) исцеляет его вместо нанесения повреждений."
ecr_book_mut_frostbound_ice: "Оставляет под ногами скользкий лед: находясь на нем, вы скользите и двигаетесь на $1% медленнее; каждая ледяная лужа держится $2."
ecr_book_mut_frostbound_no_ice: "На этом сервере оно не оставляет под ногами лед."
ecr_book_mut_mudbound: "Оставляет под ногами густую грязь: находясь в ней, вы двигаетесь на $1% медленнее, и этот эффект держится еще $2 после выхода из нее. Каждая лужа грязи держится $3."
ecr_book_mut_mudbound_none: "На этом сервере оно не оставляет под ногами грязь."
ecr_book_mut_corrodent: "Ваша броня теряет прочность в $1 раза быстрее под его ударами, и каждый пробивший удар отнимает ещё $2% от максимальной прочности предмета. Износ щитов остается прежним."
ecr_book_mut_cloning: "Когда оно сближается с вами вплотную в радиусе $1 м, то оставляет на своем месте безобидную приманку, а само продолжает невидимый бой. Первое же его попадание по вам раскрывает маскировку; уничтожение приманки также обнаруживает оригинал. Бонус: $2"
ecr_book_mut_cloning_late: "Когда оно сближается с вами вплотную в радиусе $1 м, то оставляет на своем месте безобидную приманку, а само продолжает невидимый бой. Первое же его попадание по вам раскрывает маскировку; уничтожение приманки также обнаруживает оригинал, а спустя $2 оно покажет себя в любом случае. Бонус: $3"
ecr_book_mut_cloning_once: "Один раз за всю жизнь."
ecr_book_mut_cloning_times: "$1 раза за всю жизнь."
ecr_book_mut_piercing: "Его удары полностью игнорируют $1% вашей брони."
ecr_book_mut_howling: "Когда оно нападает на вас, то издает вой, заставляя $1 ближайших союзных существ в радиусе $2 м броситься на вас. Повторяется каждые $3, пока оно ведет с вами бой. Никогда не призывает боссов."
ecr_book_mut_binding: "Оставляет за собой участки спутанных корней, по одному каждые $1 м, каждый участок существует $2. Если наступить в них, корни удержат вас на месте в течение $3 (статус «Опутать корнями»: вы все еще можете поворачиваться, блокировать атаки и наносить удары), а затем отпустят на $4."
ecr_book_mut_flamebound: "Оставляет за собой горящую землю, каждый участок огня держится $1. Нахождение в огне поджигает вас: наносит $2 ед. урона огнем в секунду (урон выше со звездами). Сопротивление огню и статус «Намокший» помогают выжить; броня урон не снижает."

